reby enhancing the relevancy of the content returned.","C":"Filters reformat and aggregate multiple documents into a single summary output to streamline and unify retriever output for more efficient and accurate AI grounding."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":110,"q":"Universal Containers is setting up the data library configuration within the Agentforce Builder. What is true regarding Agentforce Data Libraries?","o":{"A":"An agent can have only one data library assigned to it.","B":"Each data category can only have one data library.","C":"Only data library owners can assign it to the agent."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":111,"q":"Universal Containers (UC) needs to capture and store detailed interaction data for all agents. Which feature should help UC get a full view of the agent's behavior from start to finish, including reasoning engine executions, actions, prompt and gateway inputs/outputs, error messages, and final responses?","o":{"A":"Utterance Analysis","B":"Agentforce Session Tracing","C":"Agentforce Analytics"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":112,"q":"Universal Containers wants to keep retrieval accurate as product documentation changes frequently. Which approach should the company implement?","o":{"A":"Rebuild the search index.","B":"Manually delete the stale data chunks.","C":"Leave embeddings unchanged even if content is updated."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":113,"q":"Universal Containers (UC) is preparing and defining success criteria for Agentforce Testing Center test cases. Which details should UC specify as the expected output to ensure the tests accurately reflect the agent's functionality?","o":{"A":"Expected Topic API Name","B":"Expected Flow API Name","C":"Expected Prompt Template Name"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":114,"q":"An Agentforce Specialist at Universal Containers (UC) is building with no-code tools only. They have many small accounts that are only touched periodically by a specialized sales team, and UC wants to maximize the sales operations team's time. UC wants to help prep the sales team for calls by: Summarizing past purchases Displaying products the contact has shown interest in (with data captured via Data Cloud) Providing a recap of past email and phone conversations that have transcripts Which approach should the Agentforce Specialist recommend to achieve this goal?","o":{"A":"Deploy UC's own custom foundational model on this data first.","B":"Use a prompt template grounded on CRM and Data Cloud data using standard foundation models.","C":"Fine tune the standard foundational model due to the complexity of the data."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":115,"q":"Universal Containers (UC) wants to ensure its compliance team can retrieve exact matches of policy clause numbers from a structured legal document library. Which search type should UC implement?","o":{"A":"Use hybrid search to blend keyword and semantic recall.","B":"Use keyword search for exact term matching on structured fields like clause numbers.","C":"Use semantic search to interpret synonyms of clauses dynamically."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":116,"q":"A company wants to retrieve patient history details to augment the AI agent response. The company wants to leverage the Data Cloud search index feature. What is best practice when considering retrieval-augmented generation (RAG) for information that may contain personally identifiable information (PII)?","o":{"A":"Mask sensitive fields and index only non-PII data.","B":"Depend on the agent's prompt to avoid exposing PII.","C":"Encrypt embeddings, but still index PII records."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":117,"q":"Sales reps at Universal Containers should not be able to create or edit prompt templates. Which permission set should an Agentforce Specialist assign to the sales reps?","o":{"A":"Prompt Template User","B":"Prompt Template Manager","C":"Prompt Execute User"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":118,"q":"Universal Containers' service team wants to customize the standard case summary response from Agentforce. What should the Agentforce Specialist do to achieve this?","o":{"A":"Customize the standard Record Summary template for the Case object.","B":"Create a custom Record Summary prompt template for the Case object.","C":"Summarize the Case with a standard agent action."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":119,"q":"Universal Containers (UC) has a new AI project. What should UC consider when adding a related list on the Account object to be used in the prompt template?","o":{"A":"The fields for the related list are based on the default page layout of the Account for the current user.","B":"After selecting a related list from the Account, use the field picker to choose merge fields in Prompt Builder.","C":"Prompt Builder must be used to assign the fields from the related list as a JSON format."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":120,"q":"Universal Containers deploys a new Agentforce Service Agent into the company's website but is getting feedback that the Service Agent is not providing answers to customer questions that are found in the company's Salesforce Knowledge articles. What is the likely issue?","o":{"A":"The Agentforce Service Agent user needs to be created under the standard Agent Knowledge profile.","B":"The Agentforce Service Agent user was not given the Allow View Knowledge permission set.","C":"The Agentforce Service Agent user is not assigned the correct Agent Type License."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":121,"q":"An Agentforce Specialist is building a Flex prompt template. Which best practice should the Agentforce Specialist follow when creating the Flex prompt template?","o":{"A":"Provide the large language model (LLM) with contextual information and give it a role such as a sales or support rep.","B":"Ground the large language model (LLM) with a retriever and create a custom field to store the LLM-generated response.","C":"Ground the large language model (LLM) with account data and create a custom field account summary to store the LLM-generated response."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":122,"q":"Coral Cloud Resorts wants to cover a broad range of user phrasing when testing its FAQ agent. Which Testing Center feature meets that need?","o":{"A":"Relying on live customer logs to capture phrasing diversity after deployment","B":"Uploading only a small set of manually written prompts","C":"AI-generated synthetic test utterances based on natural language variations"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":123,"q":"Universal Containers (UC) is building a Flex prompt template. UC needs to use data returned by the flow in the prompt template. Which flow element should UC use?","o":{"A":"Add Flow Instructions","B":"Add Flex Instructions","C":"Add Prompt Instructions"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":124,"q":"Coral Cloud Resorts needs consistent pass/fail logic for agent testing. Which Testing Center capability provides that?","o":{"A":"Use customer rating as a proxy for correctness.","B":"Run a script on event logs to identify the failed utterances.","C":"Use structured batch testing with validation per test utterance."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":125,"q":"A Service Agent at Universal Containers (UC) is designed to help customers resolve issues by searching against knowledge articles. Knowledge articles have PDF attachments that add critical details. UC reports that the agent provides excellent summaries of the knowledge articles, but seems completely unaware of the PDF attachments. How should an Agentforce Specialist configure the Data Cloud search index to include the content of these attached files?","o":{"A":"Increase article chunk size and token limits for Knowledge indexing so larger contexts capture attachment references.","B":"Enable 'Include Related Attachments' for Knowledge_kav and map the ContentDocumentLink unstructured data model object (UDMO).","C":"Use Data Cloud's 'Include Attachments' option and select the ContentDocumentVersion unstructured data model object (UDMO)."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":126,"q":"Universal Containers wants to use an AI agent to answer questions about warranties. Warranty information has already been uploaded as unstructured data in Data Cloud. When answering user questions, the results must be filterable by product line and ranked by recent updates. Which approach should the Agentforce Specialist implement?","o":{"A":"Use the default retriever which automatically accounts for recency ranking.","B":"Build a custom retriever in Einstein Studio with product line filters and recency ranking.","C":"Apply semantic embeddings with default metadata filters to achieve the desired result."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":127,"q":"A service manager wants to use Salesforce Prompt Builder to help agents summarize customer case notes after a support call. The summary should: Capture the customer's issue, troubleshooting steps taken, and next actions. Be no longer than five sentences. Use plain language (no technical jargon). If no next action is identified, the summary should explicitly state \"No next action required.\" Which prompt template follows Salesforce prompt design best practices?","o":{"A":"Role: You are an experienced support agent. Task: Summarize the case notes. Context: Include customer issue, troubleshooting steps, and next actions. Constraints: Limit to 5 sentences, use plain language, and if no next action is found, state \"No next action required.\" Format: Use numbered sentences for clarity.","B":"Task: Provide a professional summary of the issue and troubleshooting steps. Context: Include customer issue, steps taken, and next actions if available. Constraints: No strict sentence limit, but use plain language. If no next action is found, leave it out. Format: Use paragraphs for readability.","C":"Context: Include customer issue, steps taken, and next actions if available. Constraints: No strict sentence limit, but use plain language. If no next action is found, leave it out. Format: Use paragraphs for readability. Role: You are a case documentation assistant. Task: Write a summary of the support call.","D":"Context: Always describe the customer issue, troubleshooting, and resolution details. Constraints: The summary should be comprehensive and professional, but there is no limit on length or language style. Format: Use complete sentences in a narrative style."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":129,"q":"An administrator at Universal Containers is setting up a new Sales Development Representative (SDR) Agent. The agent's purpose is to nurture cold leads before connecting them to the assigned sales rep. To ensure the agent has all the necessary access to the leads in the North America sales region, what should the administrator do?","o":{"A":"Assign the user in the highest-level role within the North America role hierarchy as the SDR Agent User.","B":"Grant View All record permission of the Lead object to the 'Einstein Agent User' profile.","C":"Create a criteria-based sharing rule to grant access to targeted lead records to SDR Agent User."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":130,"q":"Coral Cloud Resorts (CCR) wants to configure its agent so that booking actions are only available when a customer's membership tier is \"Premium\" or \"Elite\". This business rule must be enforced deterministically. What should CCR implement?","o":{"A":"Set up custom validation rules on the underlying booking objects to prevent non- eligible customers from completing bookings.","B":"Configure topic instructions that clearly state booking actions should only be used for Premium or Elite customers and include examples.","C":"Create a context variable mapped to the customer's membership tier field, then add a conditional filter on MembershipTier."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":132,"q":"During configuration, Universal Containers (UC) forgot to grant Knowledge access to the Agentforce Service Agent. Which permission must UC add for the agent to interact with Knowledge articles and answer customer questions effectively?","o":{"A":"Allow View Knowledge and Run Flows","B":"Access Knowledge records and fields, and Allow View Knowledge","C":"Access Custom Objects and Manage External Users"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":133,"q":"An Agentforce Specialist turned on Einstein Generative AI in Setup. Now, the Agentforce Specialist would like to create custom prompt templates in Prompt Builder. However, they cannot access Prompt Builder in the Setup menu. What is causing the problem?","o":{"A":"The Prompt Template Manager permission set was not assigned correctly.","B":"The Prompt Template User permission set was not assigned correctly.","C":"The large language model (LLM) was not configured correctly in Data Cloud."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":134,"q":"An Agentforce Specialist wants to ensure their custom agent action performs as expected in conversations. What should the Agentforce Specialist focus on when creating action instructions?","o":{"A":"Write concise agent action instructions and test in Agentforce Builder.","B":"Ensure the agent action label matches the utterance's intent.","C":"Include comprehensive detailed descriptions and perform smoke testing."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":135,"q":"Universal Containers wants to implement a customer verification process where sensitive account information can only be accessed after the customer passes identity verification. The agent must enforce this security rule deterministically without allowing the large language model (LLM) to bypass the verification requirement. What should an Agentforce Specialist recommend as the best solution?","o":{"A":"Use context variables to store verification status in the messaging session and configure the agent to check these variables through natural language prompts during each sensitive action.","B":"Include detailed verification instructions in the agent's topic instructions explaining when customers should be verified and rely on the LLM to follow these guidelines consistently across all interactions.","C":"Create a custom variable IsCustomerVerified set by a verification action, then apply a conditional filter using the expression IsCustomerVerified equals true to all sensitive data actions, ensuring deterministic access control that the LLM can't alter."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":136,"q":"Universal Containers plans to enable Agentforce in Slack so teams can interact with agents directly in Slack channels. Which description represents the key steps required to enable Agentforce in Slack?","o":{"A":"Enable the default Slack channel Agentforce, and assign Slack agent access to users.","B":"Configure the Slack workflow to invoke the Agentforce API, enabling users to interact with agents through predefined triggers and automated steps.","C":"Configure the Slack agent connection and, in Manage Agentforce, install the agent, then assign agent access to users."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":137,"q":"Coral Cloud Resorts (CCR) uses Agentforce to assist customers with booking and service issues. CCR wants to implement a triage process so that: High severity requests must be escalated to a human service rep. Lower severity requests should result in creating a support case for the guest. The requirement is to achieve the highest reliability and determinism in the response from the agent. Which approach should an Agentforce Specialist recommend?","o":{"A":"Write the triage and routing logic in Topic Instructions using an IF, THEN, ELSE pattern: \"Escalate to human service rep if the request is considered severe, otherwise create support case\".","B":"Use absolute keywords like \"Always\" and \"Never\" in Topic Instructions to enforce logic, such as \"Always escalate when severity is high\" and \"Never create a support case when severity is high\".","C":"Create a custom variable severityLevel populated by a Triage action. Add filters so the \"Escalate to human service rep\" action only runs when severityLevel = 'High', and the \"Create Support Case\" action runs only when severityLevel != 'High'."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":138,"q":"Coral Cloud Resorts wants visibility into credit usage associated with testing. Which feature supports this?","o":{"A":"Agentforce Analytics","B":"Digital Wallet","C":"Testing Center"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":139,"q":"Universal Containers implements custom agent actions to enhance its customer service operations. The development team needs to understand the core components of a custom agent action to ensure proper configuration and functionality. What should the development team review in the custom agent action configuration to identify one of the core components of a custom agent action?","o":{"A":"Output Types","B":"Action Triggers","C":"Instructions"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":140,"q":"What should Universal Containers consider when deploying a Service Agent with multiple topics and agent actions to production?","o":{"A":"Deploy flows or Apex after agents, topics, and agent actions to avoid deployment failures and potential production agent issues requiring complete redeployment.","B":"Ensure all dependencies are included, test coverage is appropriate, and configuration settings are aligned with production. Plan for version management and post- deployment activation.","C":"Ensure the agent is deployed without testing due to the probabilistic nature of AI which will prevent deployment issues."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":141,"q":"An Agentforce Specialist builds a new Service Agent that uses a custom action built on a flow. The agent has been tested in a sandbox and is now ready to deploy. What is a key consideration regarding the activation status of the agent in the production environment?","o":{"A":"The agent will be activated automatically only if the flow is also active.","B":"The agent must be manually activated in production, regardless of its status in the sandbox.","C":"The agent will automatically be activated upon successful deployment."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":142,"q":"Universal Containers has set up a Service Agent to allow customers to look up their order status. The topic setup includes: Name: Order Inquiry Classification Description: Handles user requests to look up order status, including tracking details and delivery estimates for orders placed within the last 90 days. Scope: Your job is only to assist authenticated users in looking up the status of their orders placed within the last 90 days. If the order is pending delivery, provide the tracking number and estimated delivery date. Do not handle inquiries for orders older than 90 days. Which information will be used by the Agentforce reasoning engine to choose this topic?","o":{"A":"Topic Name and Classification Description","B":"Topic Name and Scope","C":"Classification Description and Scope"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":143,"q":"Universal Containers needs to bring individual customer warranties from an external system into Data Cloud. They want Agentforce to return warranty-related responses only for accounts whose warranty status is active. Which search approach should the Agentforce Specialist configure to ensure warranty- related information is retrieved correctly?","o":{"A":"Depend on Agentforce instructions to enforce warranty constraints and include only WarrantyStatus = Active results.","B":"Store the account's warranty status in an Agentforce custom variable to dynamically filter warranties during retrieval.","C":"Use Hybrid Search and apply pre-filtering in a new custom retriever for matching accounts and where the WarrantyStatus = Active field."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":144,"q":"A business stakeholder wants to use AI to generate a summary based on Data Cloud data. Which method(s) should the stakeholder use to access Data Cloud data from Prompt Builder?","o":{"A":"Accessing data model objects (DMOs) directly in Flex templates, using Data Cloud related lists, and fetching Data Cloud data using prompt-initiated flows","B":"Using Data Cloud related lists and fetching Data Cloud data using prompt-initiated flows","C":"Using only external APIs to import Data Cloud data into Prompt Builder"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":145,"q":"What is one key purpose of action instructions when creating a custom agent action in Agentforce?","o":{"A":"Action instructions help the reasoning engine decide which action to use.","B":"Action instructions define the temperature of the large language model (LLM) powering the Reasoning Engine.","C":"Action instructions tell the user how to call this action in a conversation."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":146,"q":"Support agents at Universal Containers are using Agentforce to find troubleshooting information. They've reported that the agent frequently provides knowledge articles that are outdated, even when newer versions of the articles are available. The administrator has confirmed that all articles are correctly chunked and indexed. Which configuration change in the Data Cloud hybrid search index best addresses this problem?","o":{"A":"Disable the keyword index to rely solely on the vector index.","B":"Switch the chunking strategy from section-aware to fixed-size.","C":"Add a ranking factor for recency based on the LastModifiedDate field."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":147,"q":"What is one of the recommended approaches when constructing and refining Agentforce custom action instructions?","o":{"A":"Use consistent introductory phrases and verbs across multiple action instructions.","B":"Provide examples of user messages that are expected to trigger the action.","C":"Specify the persona who will request the action."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":148,"q":"Universal Containers (UC) has effectively utilized prompt templates to update summary fields on Lightning record pages. An admin now wishes to incorporate similar functionality into UC's automation processes using Flow. How should the admin get a response from this prompt template from within a flow to use as part of UC's automation?","o":{"A":"Invocable Apex","B":"Einstein for Flow","C":"Flow action"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":149,"q":"An Agentforce Specialist is creating a prompt template to assist support reps in drafting responses to customer complaints. To ensure the responses are empathetic and helpful, what is a key element to include in the prompt template?","o":{"A":"A direct instruction to the large language model (LLM) to role-play as a character","B":"A list of keywords related to customer complaints","C":"The entire history of the customer's previous interactions with the company"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":150,"q":"What is a valid use case for Data Cloud retrievers?","o":{"A":"Grounding data from external websites to augment a prompt with retrieval- augmented generation (RAG)","B":"Returning relevant data from the vector database to augment a prompt","C":"Modifying and updating data within the source systems connected to Data Cloud"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":151,"q":"At Universal Containers, a sales manager is tackling a tough challenge as several new junior sales reps struggle with objection handling and price negotiations for complex deals. The manager lacks the time to personally guide each sales rep through their specific customer scenarios before their critical meetings. The junior sales reps have asked for a tool that would allow them to practice their pitches by simulating tough conversations and receive personalized feedback that is specific to the commerce opportunity they are working on. Which Salesforce solution should an Agentforce Specialist recommend?","o":{"A":"Employee Coach","B":"SDR Agent","C":"Sales Coach"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":152,"q":"Universal Containers (UC) is implementing Agentforce Service Agent on Email. UC made an email template and now needs to connect it to a Service Agent. What should an Agentforce Specialist recommend?","o":{"A":"Create an Email Configuration for the Service Agent.","B":"Create an Omni-Channel flow to point to an email template.","C":"No action needed; the Service Agent connects automatically."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":153,"q":"What is the primary advantage of creating an individual retriever instead of the default retriever?","o":{"A":"Individual retrievers can aggregate multiple data spaces and data model objects (DMOs) into a unified retriever output.","B":"Individual retrievers allow the configuration of filters, specified fields, and how many results are returned.","C":"Individual retrievers automatically generate new search indexes and dynamically update vectors."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":154,"q":"Universal Containers (UC) is using related list merge fields in a prompt template associated with an Account object in Prompt Builder. What should UC consider?","o":{"A":"If person accounts have been enabled, merge fields will not be available for the Account object.","B":"Prompt generation will yield no response when there is no related list associated with an Account in runtime.","C":"The Activities related list on the Account object is not supported because it is a polymorphic field."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":156,"q":"Universal Containers wants to assign agents to improve department efficiency. Which configuration ensures the right tasks are handled by the right agents?","o":{"A":"SDR Agent for lead qualification, Service Agent for support tickets, Employee Agent for HR requests","B":"Sales Coach Agent for lead and service Agent for HR requests, and Support tickets to ensure cases are available","C":"One Service Agent to efficiently handle each of these scenarios, which reduces the number of agent types needed for support"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":157,"q":"Universal Containers (UC) plans to automatically populate the Description field on the Account object. Which type of prompt template should UC use?","o":{"A":"Sales Email","B":"Flex","C":"Field Generation"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":158,"q":"An Agentforce Specialist is assisting Universal Containers with troubleshooting an agent. The Agentforce Specialist notices that the agent is not using topic actions in the desired sequence, causing inconsistent outcomes. Which technique should the Agentforce Specialist recommend to ensure deterministic control over the order in which actions are executed?","o":{"A":"Specify the large language model (LLM) provider and version.","B":"Specify custom variables and filters.","C":"Specify the order of actions."},"a":"B","orig":"C","status":"corrected","note":"Order is enforced with variables + filters.","t":"Agent Builder & actions"},{"n":159,"q":"The Agentforce Specialist for Coral Cloud Resorts wants to create an agent that will automate the resolution of a large portion of guest complaints related to their vacation experiences. The agent will be able to offer upgrades, hotel credit, and other complimentary options. The agent will also be in charge of escalating the case to a human when a guest has suffered a major disruption (such as cancellation). Following Salesforce best practices, which type of agent should the Agentforce Specialist create?","o":{"A":"Sales Agent with a Flex prompt template","B":"Custom Agent with a Flex prompt template","C":"Service Agent with a Flex prompt template"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":161,"q":"What is a key benefit of the Agent-to-Agent (A2A) protocol?","o":{"A":"Provides a standardized framework for cross-vendor agent discovery and communication","B":"Allows auto-onboard third-party agents without additional contracts, trust scores, or shared identity controls","C":"Provides a standardized runtime engine for internal agent discovery and communication"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":162,"q":"Universal Containers is indexing millions of product manuals where users may ask both structured queries (model numbers) and natural language questions (for example, \"How do I reset my device?\"). Which retrieval approach should the company use?","o":{"A":"Use keyword search only, since model numbers dominate queries.","B":"Use semantic search only, as natural language is always preferred.","C":"Use hybrid search to combine keyword precision with semantic flexibility."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":163,"q":"When using a prompt template, what should an Agentforce Specialist consider with their grounding data and chosen model?","o":{"A":"Review the token limit in the Einstein Trust Layer.","B":"Ensure queries used for grounding employ offset so the token limits of models are not exceeded.","C":"Review the model limitation in Prompt Builder versus the grounding data size."},"a":"C","orig":"A","status":"corrected","note":"Trust Layer has no token limit setting.","t":"Prompt Builder"},{"n":164,"q":"An Agentforce Specialist created a Field Generation prompt template. What should the Agentforce Specialist do to expose the template to the user?","o":{"A":"Use a screen flow to associate the Field Generation prompt template.","B":"Associate the template with the form field on the Lightning page.","C":"Call a template using an autolaunched flow."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":165,"q":"Universal Containers (UC) is tracking web activities in Data Cloud for a unified contact. It wants to use that information in a prompt template to help extract insights from the data. Assuming that the Contact object is one of the objects associated with the prompt template, what is a valid way for UC to do this?","o":{"A":"Create a prompt template that takes a list of all Data Cloud activity records as input to pass to the large language model (LLM).","B":"Call the prompt directly from Data Cloud with a web tracking activity included in the prompt definition.","C":"Add the activity records as an enrichment related list to the Contact, then pass the Contact into a prompt template workspace using related list grounding."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":166,"q":"Universal Containers wants to test agents while preserving real data and isolating from production. Which environment should the company use with Testing Center?","o":{"A":"Use personal developer orgs unrepresentative of production data.","B":"Use production org directly with test assertions.","C":"Use sandbox environments replicated from production for safe testing."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":167,"q":"Coral Cloud Resorts wants to handle frequent customer misspellings of package names in queries. Which approach should the Agentforce Specialist implement?","o":{"A":"Hybrid search","B":"Vector search","C":"Keyword search"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":168,"q":"Universal Containers (UC) has configured a data library and wants to restrict indexing of knowledge articles to articles which are only publicly available in their knowledge base. UC also wants the agent to link sources that the large language model (LLM) grounded its response on. Which settings should help UC with this?","o":{"A":"In the data library setting window, under Knowledge Settings, enable Use Public Knowledge Article and select Show sources.","B":"In the data library setting window, under Knowledge Settings, enable Use Public Knowledge Article. It is not possible to display articles that the LLM grounded its response in.","C":"Use Data Categories to categorize publicly available articles to index. Sources are automatically displayed when knowledge articles are categorized as Public."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":170,"q":"Universal Containers (UC) has a library of custom-built personalized investment portfolio APIs, and is planning to extend it to agents. Which method should UC's agent choose to dynamically use the best API service?","o":{"A":"Agent-to-Agent (A2A) protocol support","B":"Model Context Protocol (MCP) server support","C":"MuleSoft connector for custom hosted processes"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent types & channels"},{"n":172,"q":"Cloud Kicks (CK) is launching a new partner portal on Experience Cloud. CK wants to provide partners with an agent that can answer questions about product specifications from the knowledge base and allow them to submit a new Lead for a potential customer they've identified. The agent must be accessible only to authenticated partner users on the portal. Which agent type is required to meet this scenario?","o":{"A":"Sales Agent","B":"Commerce Agent","C":"Service Agent"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":173,"q":"Universal Containers (UC) recently added a custom flow for processing returns and created a new agent action. What should UC do to ensure the Agentforce Service Agent can run this new flow as part of the new agent action?","o":{"A":"Recreate the flow using the Agentforce Agent user.","B":"Assign the Run Flows permission to the Agentforce Agent user.","C":"Assign the Manage Users permission to the Agentforce Agent user."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":174,"q":"Universal Containers is building a digital shopping assistant that needs to dynamically generate product recommendations using information from the company's external product recommendation predictive model through APIs. Which Agentforce capability should make it easier for the agent to consume the external product recommendation tool?","o":{"A":"Model Context Protocol (MCP)","B":"Hugging Face","C":"Agent-to-Agent (A2A) protocol"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":175,"q":"Universal Containers is using Agentforce for Sales to find similar opportunities to help close deals faster. The team wants to understand the criteria used by the agent to match opportunities. What is one criteria that Agentforce for Sales uses to match similar opportunities?","o":{"A":"Matched opportunities were created in the last 12 months.","B":"Matched opportunities have a status of Closed Won from last 12 months.","C":"Matched opportunities are limited to the same account."},"a":"B","orig":"B","status":"disputed","note":"Its duplicate in the master file was keyed C.","t":"General"},{"n":176,"q":"After an agent selects a topic, what is an important factor the reasoning engine uses to select the action?","o":{"A":"The priority given to each action","B":"The explicit order of actions in the topic","C":"The name and instructions of the actions"},"a":"C","orig":"A","status":"corrected","note":"No action priority; name + instructions decide.","t":"Agent Builder & actions"},{"n":188,"q":"Universal Containers (UC) recently attended a major trade show and received thousands of new leads from event badge scans. UC is struggling to follow up with each lead in a timely, personalized way. Leadership wants to: Qualify and nurture leads 24/7. Provide accurate answers to prospect questions. Automatically book meetings with qualified prospects. Free up reps to focus on building relationships and closing deals. Which Agentforce capability should UC implement to meet these goals?","o":{"A":"SDR Agent","B":"Sales Coach","C":"Commerce Agent"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":193,"q":"Universal Containers (UC) is considering using a Field Generation prompt template type. What should UC check before creating the Field Generation prompt to ensure it is possible for the field to be enabled for generative AI?","o":{"A":"That the field chosen is a rich text field with 255 characters or more","B":"That the org is set to API version 59 or higher","C":"That the Lightning page layout where the field will reside has been upgraded to Dynamic Forms"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":197,"q":"When configuring a prompt template, an Agentforce Specialist previews the results of the prompt template they've written. They see two distinct text outputs: Resolution and Response. Which information does the Resolution text provide?","o":{"A":"It shows which sensitive data is masked before it is sent to the LLM.","B":"It shows the response from the LLM based on the sample record.","C":"It shows the full text that is sent to the Trust Layer."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":198,"q":"Universal Containers (UC) is creating a new custom prompt template to populate a field with generated output. UC enabled the Einstein Trust Layer to ensure AI Audit data is captured and monitored for adoption and possible enhancements. Which prompt template type should UC use and which consideration should UC review?","o":{"A":"Flex, and that Dynamic Fields is enabled","B":"Field Generation, and that Dynamic Fields is enabled","C":"Field Generation, and that Dynamic Forms is enabled"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":199,"q":"Universal Containers (UC) wants to make a sales proposal and directly use data from multiple unrelated objects (standard and custom) in a prompt template. How should UC accomplish this?","o":{"A":"Create a Flex template to add resources with standard and custom objects as inputs.","B":"Create a prompt template passing in a special custom object that connects the records plish this?","o":{"A":"Invoke a flow which makes a call to external data to create a Knowledge article.","B":"Generate a Knowledge article based off the prompts that the agent enters to create steps to cancel flights.","C":"Execute tasks based on available actions, answering questions using information from accessible Knowledge articles."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":208,"q":"In a Knowledge-based data library configuration, what is the primary difference between the identifying fields and the content fields?","o":{"A":"Identifying fields highlight key terms for relevance scoring, while content fields store the full text of the article for retrieval.","B":"Identifying fields categorize articles for indexing purposes, while content fields provide a brief summary for display.","C":"Identifying fields help locate the correct Knowledge article, while content fields enrich AI responses with detailed information."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":209,"q":"Universal Containers (UC) wants to enable its sales team to use AI to suggest recommended products from its catalog. Which type of prompt template should UC use?","o":{"A":"Record summary prompt template","B":"Flex prompt template","C":"Email generation prompt template"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":210,"q":"Universal Containers (UC) plans to implement prompt templates that utilize the standard foundation models. What should UC consider when building prompt templates in Prompt Builder?","o":{"A":"Train LLM with data using different writing styles including word choice, intensifiers, emojis, and punctuation.","B":"Ask it to role-play as a character in the prompt template to provide more context to the LLM.","C":"Include multiple-choice questions within the prompt to test the LLM's understanding of the context."},"a":"B","orig":"B","status":"reviewed","note":"", owledge"},{"n":215,"q":"Universal Containers (UC) would like to implement Sales Development Representative (SDR) Agent. Which channel consideration should UC be aware of while implementing it?","o":{"A":"SDR Agent must also be deployed in the company website.","B":"SDR Agent must be deployed in Messaging channel.","C":"SDR Agent only works in Email channel."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":216,"q":"Universal Containers would like to route SMS text messages to a service rep from an Agentforce Service Agent. Which Service Channel should the company use in the flow to ensure it's routed properly?","o":{"A":"Live Agent","B":"Route Work Action","C":"Messaging"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":217,"q":"Universal Containers (UC) is rolling out an AI-powered support assistant to help customer service agents quickly retrieve relevant troubleshooting steps and policy guidelines. The assistant relies on a search index in Data Cloud that contains product manuals, policy documents, and past case resolutions. During testing, UC notices that agents are receiving too many irrelevant results from older product versions that no longer apply. How should UC address this issue?","o":{"A":"Create a custom retriever in Einstein Studio, and apply filters for publication date and product line.","B":"Use the default retriever, as it already searches the entire search index and provides broad coverage.","C":"Modify the search index to only store documents from the last year and remove older records."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":218,"q":"When creating a custom retriever in Einstein Studio, which step is considered essential?","o":{"A":"Select the search index, specify the associated data model object (DMO) and data space, and optionally define filters to narrow search results.","B":"Define the output configuration by specifying the maximum number of results to return, and map the output fields that will ground the prompt.","C":"Configure the search index, choose vector or hybrid search, choose the fields for filtering, the data space and model, then define the ranking method."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":219,"q":"For an Agentforce Data Library that contains uploaded files, what occurs once it is created and configured?","o":{"A":"Indexes the uploaded files in a location specified by the user","B":"Indexes the uploaded files into Data Cloud","C":"Indexes the uploaded files in Salesforce File Storage"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":220,"q":"Universal Containers has implemented an agent that answers questions based on Knowledge articles. Which topic and Agent Action will be shown in the Agent Builder?","o":{"A":"General CRM topic and Answers Questions with LLM Action","B":"General FAQ topic and Answers Questions with Knowledge Action","C":"General Q&A topic and Knowledge Article Answers action"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":221,"q":"How does an Agent respond when it can't understand the request or find any requested information?","o":{"A":"With a preconfigured message, based on the action type","B":"With a general message asking the user to rephrase the request","C":"With a generated error message"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":223,"q":"Universal Containers wants to utilize Agentforce for Sales to help sales reps reach their sales quotas by providing AI-generated plans containing guidance and steps for closing deals. Which feature meets this requirement?","o":{"A":"Create Account Plan","B":"Create Close Plan","C":"Find Similar Deals"},"a":"B","orig":"B","status":"reviewed","note":"","t":"General"},{"n":226,"q":"Universal Containers wants to reduce overall customer support handling time by minimizing the time spent typing routine answers for common questions in-chat, and reducing the post-chat analysis by suggesting values for case fields. Which combination of Agentforce for Service features enables this effort?","o":{"A":"Einstein Reply Recommendations and Case Summaries","B":"Einstein Service Replies and Work Summaries","C":"Einstein Reply Recommendations and Case Classification"},"a":"C","orig":"A","status":"corrected","note":"Case field values = Case Classification.","t":"Agent types & channels"},{"n":227,"q":"Universal Containers (UC) wants to leverage Generative AI Salesforce functionality to reduce Service Agent handling time by providing recommended replies based on the existing Knowledge articles. On which AI capability should UC train the service agents?","o":{"A":"Knowledge Replies","B":"Service Replies","C":"Case Replies"},"a":"B","orig":"A","status":"corrected","note":"No 'Knowledge Replies' feature.","t":"Data, retrieval & Knowledge"},{"n":228,"q":"An Agentforce Specialist needs to create a prompt template to fill a custom field named Latest Opportunities Summary on the Account object with information from the three most recently opened opportunities. How should the Agentforce Specialist gather the necessary data for the prompt template?","o":{"A":"Select the latest Opportunities related list as a merge field.","B":"Select the Account Opportunity object as a resource when creating the prompt template.","C":"Create a flow to retrieve the opportunity information."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":229,"q":"Universal Containers wants to implement a solution in Salesforce with a custom UX that allows users to enter a sales order number. Subsequently, the system will invoke a custom prompt template to create and display a summary of the sales order header and sales order details. Which solution should an Agentforce Specialist implement to meet this requirement?","o":{"A":"Create a template-triggered prompt flow and invoke the prompt template using the standard \"Prompt Template\" flow action.","B":"Create a screen flow to collect sales order number and invoke the prompt template using the standard \"Prompt Template\" flow action.","C":"Create an autolaunched flow and invoke the prompt template using the standard \"Prompt Template\" flow action."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":230,"q":"The sales team at a hotel resort would like to generate a guest summary about the guests' interests and provide recommendations based on their activity preferences captured in each guest profile. They want the summary to be available only on the contact record page. Which AI capability should the team use?","o":{"A":"Model Builder","B":"Prompt Builder","C":"Agent Builder"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":231,"q":"Which element in the Omni-Channel flow should be used to connect the flow with the agent?","o":{"A":"Assignment","B":"Decision","C":"Route Work Action"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":232,"q":"What is the importance of Action Instructions when creating a custom Agent action?","o":{"A":"Action Instructions tell the large language model (LLM) which action to use.","B":"Action Instructions define the expected user experience of an action.","C":"Action Instructions tell the user how to call this action in a conversation."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":233,"q":"Universal Containers (UC) wants to limit an agent's access to Knowledge articles, while deploying Answer Questions with Knowledge action. How should UC achieve this?","o":{"A":"Define scope instructions to the agent specifying a list of allowed article titles or IDs.","B":"Update the Data Library Retriever to filter on a custom field on the Knowledge article.","C":"Assign Data Categories to Knowledge articles, and define Data Category filters in the Agentforce Data Library."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"}];
const BY = Object.fromEntries(DATA.map(d => [d.n, d]));
const ALL = DATA.map(d => d.n);
const NCOR = DATA.filter(d => d.status === "corrected").length, NDIS = DATA.filter(d => d.status === "disputed").length;
const PASS = 73;
const LS = "afx-exam-v1";
const app = document.getElementById("app");
let S = null, view = "setup", timerId = null, keyLimit = 40;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const DEF = Object.fromEntries(DATA.map(d => [d.n, d.a]));
const LSK = "afx-key-v1";
let OV = {};
try { OV = JSON.parse(localStorage.getItem(LSK)) || {}; } catch (e) {}
const applyOv = () => DATA.forEach(d => { d.a = OV[d.n] || DEF[d.n]; d.user = !!OV[d.n]; });
const setAnswer = (n, k) => { if (k === DEF[n]) delete OV[n]; else OV[n] = k; try { localStorage.setItem(LSK, JSON.stringify(OV)); } catch (e) {} applyOv(); };
applyOv();
const pill = d => (d.user ? `<span class="pill user">Set by you, default ${DEF[d.n]}</span>` : "") + (d.status === "reviewed" ? "" : `<span class="pill ${d.status}">${d.status === "corrected" ? "Key corrected" : "Disputed"}</span>`);

function setTab(v) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === (v === "key" ? "key" : (v === "history" || (v === "results" && viewAttempt)) ? "history" : "setup"))));
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.view === "key") go("key"); else if (b.dataset.view === "history") go("history"); else go(S && !S.done ? "quiz" : (S && S.done ? "results" : "setup"));
}));

function go(v) { view = v; setTab(v); clearInterval(timerId); document.body.classList.toggle("testing", v === "quiz"); window.scrollTo(0, 0); ({setup, quiz, results, key, history})[v](); }

/* ---------- setup ---------- */
function setup() {
  const prev = load();
  const resumable = prev && !prev.done && prev.ids && prev.ids.length;
  app.innerHTML = `
  <div class="setup">
    <div>
      <h1>Agentforce Specialist practice exam</h1>
      <p class="lede">${ALL.length} questions from the master file, drawn in a new order each time. The real exam is 60 questions in 105 minutes, and you pass at ${PASS}%.</p>
      ${resumable ? `<div class="resume"><span>You have an unfinished ${prev.mode === "exam" ? "exam" : "practice set"}: ${Object.keys(prev.answers).length} of ${prev.ids.length} answered.</span><button class="btn primary" id="resume">Resume</button></div>` : ""}
    </div>
    <form class="panel" id="cfg">
      <fieldset><legend class="label">Mode</legend>
        <div class="seg">
          <label><input type="radio" name="mode" value="exam" checked><span>Exam</span></label>
          <label><input type="radio" name="mode" value="practice"><span>Practice</span></label>
        </div>
      </fieldset>
      <fieldset><legend class="label">Questions</legend>
        <div class="seg">
          ${[20, 40, 60, "all"].map(n => `<label><input type="radio" name="count" value="${n}" ${n === 60 ? "checked" : ""}><span>${n === "all" ? "All" : n}</span></label>`).join("")}
        </div>
      </fieldset>
      <fieldset><legend class="label">Options</legend>
        <label class="check"><input type="checkbox" id="timed" checked><span>Timer (105 min per 60 questions)</span></label>
      </fieldset>
      <button class="btn primary" type="submit" style="justify-content:center">Start</button>
    </form>
  </div>`;
  const f = document.getElementById("cfg");
  f.addEventListener("change", () => {
    const m = f.mode.value;
    document.getElementById("timed").checked = m === "exam";
  });
  f.addEventListener("submit", e => {
    e.preventDefault();
    const pool = ALL;
    const c = f.count.value === "all" ? pool.length : Math.min(+f.count.value, pool.length);
    const ids = shuffle(pool).slice(0, c);
    const timed = document.getElementById("timed").checked;
    S = newSession(f.mode.value, ids, timed ? Math.round(c * 105 / 60) * 60 : 0);
    save(); go("quiz");
  });
  const r = document.getElementById("resume");
  if (r) r.addEventListener("click", () => { S = prev; go("quiz"); });
}

/* ---------- quiz ---------- */
const L = "ABCD";
function newSession(mode, ids, limit) {
  return { mode, ids, oo: Object.fromEntries(ids.map(n => [n, shuffle(Object.keys(BY[n].o))])), answers: {}, flags: {}, idx: 0, started: Date.now(), limit, done: false, reviewing: false };
}
const orderOf = n => (S && S.oo && S.oo[n]) || Object.keys(BY[n].o);
function remaining() { return S.limit ? S.limit - (Date.now() - S.started) / 1000 : null; }

const addFoot = (inner, foot) => inner.replace(/<\/div>\s*$/, `<div class="xfoot-in">${foot}</div></div>`);
function examShell(inner) {
  const answered = Object.keys(S.answers).length;
  return `
  <div class="exam">
    <div class="xbar"><div class="xbar-in">
      <span class="xtitle">Agentforce Specialist practice ${S.mode === "exam" ? "exam" : "set"}</span>
      <span class="xprog">${S.reviewing ? `${answered} of ${S.ids.length} answered` : `Question ${S.idx + 1} of ${S.ids.length}`}</span>
      ${S.limit ? `<span class="xtime">Time remaining <b id="timer">--:--</b></span>` : ""}
      ${S.reviewing ? "" : `<button class="xmapbtn" id="maptoggle" aria-expanded="${mapOpen()}" aria-controls="qmap">Question map</button>`}
    </div></div>
    <div class="xbody">${inner}</div>
  </div>`;
}

const mapOpen = () => S.map === undefined ? innerWidth >= 1200 : S.map;
function withMap(inner) {
  if (!mapOpen()) return inner;
  const practice = S.mode === "practice";
  const cells = S.ids.map((n, i) => {
    const a = S.answers[n];
    const st = !a ? "" : practice ? (a === BY[n].a ? "r" : "w") : "ans";
    const lab = `Question ${i + 1}: ${!a ? "not answered" : practice ? (a === BY[n].a ? "correct" : "incorrect") : "answered"}${S.flags[n] ? ", marked" : ""}`;
    return `<button class="mcell ${st} ${i === S.idx ? "cur" : ""} ${S.flags[n] ? "fl" : ""}" data-i="${i}" aria-label="${lab}" ${i === S.idx ? 'aria-current="true"' : ""}>${i + 1}</button>`;
  }).join("");
  const answered = Object.keys(S.answers).length, marked = S.ids.filter(n => S.flags[n]).length;
  return `<div class="xlayout">${inner}
    <aside class="qmap" id="qmap" aria-label="Question map">
      <div class="qmap-head"><h3>Question map</h3><button class="qmap-close" id="mapclose" aria-label="Close question map">Close</button></div>
      <p class="qmap-sum">${answered} answered, ${S.ids.length - answered} left, ${marked} marked</p>
      <div class="mgrid">${cells}</div>
      <div class="mlegend">
        ${practice ? `<span><i class="mk r"></i>Correct</span><span><i class="mk w"></i>Incorrect</span>` : `<span><i class="mk ans"></i>Answered</span>`}
        <span><i class="mk"></i>Not answered</span><span><i class="mk fl"></i>Marked</span><span><i class="mk cur"></i>Current</span>
      </div>
    </aside></div>`;
}
function bindMap() {
  const tg = document.getElementById("maptoggle");
  if (tg) tg.onclick = () => { S.map = !mapOpen(); save(); quiz(); };
  const cl = document.getElementById("mapclose");
  if (cl) cl.onclick = () => { S.map = false; save(); quiz(); };
  app.querySelectorAll(".mcell").forEach(b => b.onclick = () => { S.idx = +b.dataset.i; if (innerWidth < 1200) S.map = false; save(); quiz(); window.scrollTo(0, 0); });
}

function startTimer() {
  clearInterval(timerId);
  if (!S.limit) return;
  const t = document.getElementById("timer");
  const tick = () => { const r = remaining(); if (t) { t.textContent = fmt(r); t.classList.toggle("low", r < 300); } if (r <= 0) endExam(); };
  tick(); timerId = setInterval(tick, 1000);
}

function quiz() {
  document.body.classList.add("testing");
  if (S.reviewing) return reviewScreen();
  const id = S.ids[S.idx], d = BY[id], pick = S.answers[id];
  const practice = S.mode === "practice", locked = practice && !!pick;
  const order = orderOf(id);
  const choices = order.map((k, i) => {
    let c = "";
    if (locked) c = k === d.a ? "right" : (k === pick ? "wrong" : "");
    return `<label class="choice ${c}"><input type="radio" name="ch" value="${k}" ${k === pick ? "checked" : ""} ${locked ? "disabled" : ""}><span class="cl">${L[i]}.</span><span>${esc(d.o[k])}</span></label>`;
  }).join("");
  let fb = "";
  if (locked) {
    const ok = pick === d.a;
    fb = `<div class="feedback ${ok ? "ok" : "no"}"><strong>${ok ? "Correct." : "Incorrect. Answer: " + L[order.indexOf(d.a)]}</strong>${d.note ? `${pill(d)}<p class="note">${esc(d.note)}</p>` : ""}</div>`;
  }
  const inner = `
    <div class="xq">
      <div class="xqhead" aria-label="Question ${S.idx + 1} of ${S.ids.length}"><span class="qnum">${S.idx + 1}</span><span class="qof">of ${S.ids.length}</span>${S.flags[id] ? `<span class="xmarked">Marked</span>` : ""}</div>
      <p class="qtext">${esc(d.q)}</p>
      <p class="instr">Choose 1 answer.</p>
      <div class="choices" role="radiogroup" aria-label="Answers">${choices}</div>
      ${fb}
    </div>`;
  const foot = `
    <label class="markbox"><input type="checkbox" id="mark" ${S.flags[id] ? "checked" : ""}> Mark for review</label>
    <div class="xbtns">
      <button class="xbtn" id="prev" ${S.idx === 0 ? "disabled" : ""}>Previous</button>
      <button class="xbtn" id="next">${S.idx === S.ids.length - 1 ? "Review answers" : "Next"}</button>
      <button class="xbtn" id="rev">Review all</button>
    </div>`;
  app.innerHTML = examShell(withMap(addFoot(inner, foot)));
  bindMap();
  app.querySelectorAll('.choice input').forEach(r => r.addEventListener("change", () => { S.answers[id] = r.value; save(); if (practice) quiz(); }));
  document.getElementById("prev").onclick = () => { S.idx--; save(); quiz(); };
  document.getElementById("next").onclick = () => { if (S.idx < S.ids.length - 1) S.idx++; else S.reviewing = true; save(); quiz(); window.scrollTo(0, 0); };
  document.getElementById("rev").onclick = () => { S.reviewing = true; save(); quiz(); };
  document.getElementById("mark").onchange = e => { S.flags[id] = e.target.checked; save(); quiz(); };
  startTimer();
}

function reviewScreen(filter) {
  filter = filter || S.reviewFilter || "all";
  S.reviewFilter = filter;
  const practice = S.mode === "practice";
  const unanswered = S.ids.filter(n => !S.answers[n]).length, marked = S.ids.filter(n => S.flags[n]).length;
  const rows = S.ids.map((n, i) => ({ n, i })).filter(({ n }) => filter === "all" || (filter === "marked" ? S.flags[n] : !S.answers[n]));
  const inner = `
    <div class="xq review">
      <div class="xqhead"><h2>Review your answers</h2></div>
      <p class="instr">${unanswered} unanswered, ${marked} marked for review. Select a question to go back to it.</p>
      <div class="xfilters" role="tablist">
        <button class="xbtn ${filter === "all" ? "on" : ""}" data-f="all">All (${S.ids.length})</button>
        <button class="xbtn ${filter === "marked" ? "on" : ""}" data-f="marked">Marked (${marked})</button>
        <button class="xbtn ${filter === "incomplete" ? "on" : ""}" data-f="incomplete">Incomplete (${unanswered})</button>
      </div>
      <div class="xgrid">${rows.length ? rows.map(({ n, i }) => {
        const a = S.answers[n];
        const st = !a ? "Incomplete" : practice ? (a === BY[n].a ? "Correct" : "Incorrect") : "Answered";
        const cls = !a ? "inc" : practice ? (a === BY[n].a ? "r" : "w") : "ans";
        return `<button class="xcell ${cls}" data-i="${i}"><b>${i + 1}</b><span>${st}</span>${S.flags[n] ? `<i>Marked</i>` : ""}</button>`;
      }).join("") : `<p class="empty">No questions in this list.</p>`}</div>
      <div id="endbox"></div>
    </div>`;
  const foot = `
    <span></span>
    <div class="xbtns">
      <button class="xbtn" id="back">Return to question ${S.idx + 1}</button>
      <button class="xbtn end" id="end">${practice ? "End practice" : "End exam"}</button>
    </div>`;
  app.innerHTML = examShell(addFoot(inner, foot));
  app.querySelectorAll(".xfilters button").forEach(b => b.onclick = () => { reviewScreen(b.dataset.f); save(); });
  app.querySelectorAll(".xcell").forEach(b => b.onclick = () => { S.idx = +b.dataset.i; S.reviewing = false; save(); quiz(); window.scrollTo(0, 0); });
  document.getElementById("back").onclick = () => { S.reviewing = false; save(); quiz(); };
  document.getElementById("end").onclick = () => {
    document.getElementById("endbox").innerHTML = `<div class="xconfirm"><p><strong>End the ${practice ? "practice set" : "exam"}?</strong> ${unanswered ? `${unanswered} question${unanswered > 1 ? "s are" : " is"} unanswered and will be scored as wrong. ` : ""}You can't change answers after this.</p><div class="xbtns"><button class="xbtn" id="cancelEnd">Cancel</button><button class="xbtn end" id="confirmEnd">${practice ? "End practice" : "End exam"}</button></div></div>`;
    document.getElementById("cancelEnd").onclick = () => { document.getElementById("endbox").innerHTML = ""; };
    document.getElementById("confirmEnd").onclick = endExam;
    document.getElementById("endbox").scrollIntoView({ block: "center" });
  };
  startTimer();
}

function endExam() { clearInterval(timerId); S.done = true; S.reviewing = false; S.ended = Date.now(); logAttempt(); save(); go("results"); }

/* ---------- results ---------- */
function results() {
  const past = !!viewAttempt, R = viewAttempt || S;
  viewAttempt = null;
  const K = n => (R.key && R.key[n]) || BY[n].a;
  const ord = n => (R.oo && R.oo[n]) || Object.keys(BY[n].o);
  const right = R.ids.filter(n => R.answers[n] === K(n)).length;
  const unans = R.ids.filter(n => !R.answers[n]).length;
  const pct = Math.round(right / R.ids.length * 100);
  const pass = pct >= PASS;
  const C = 2 * Math.PI * 64;
  app.innerHTML = `
  ${past ? `<button class="btn small" id="toHist" style="margin-bottom:20px">Back to history</button>` : ""}
  <div class="score">
    <div class="bigscore" aria-label="${right} of ${R.ids.length} correct">${right}<small>/${R.ids.length}</small></div>
    <div>
      <h1>${pass ? "Pass" : "Not a pass yet"}</h1>
      <p class="verdict"><b class="${pass ? "pass" : "fail"}">${pct}% correct</b>, pass mark ${PASS}%${past ? `. ${R.mode === "exam" ? "Exam" : "Practice"} taken ${when(R.ended)}` : ""}</p>
      <div class="stats">
        <div><b>${R.ids.length - right - unans}</b>wrong</div>
        <div><b>${unans}</b>unanswered</div>
        <div><b>${fmt(((R.ended || Date.now()) - R.started) / 1000)}</b>time taken</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
        <button class="btn primary" id="again">Start a new exam</button>
        <button class="btn" id="retry" ${right === R.ids.length ? "disabled" : ""}>Practise the ones I missed</button>
        ${past ? "" : `<button class="btn" id="seeHist">See history</button>`}
      </div>
    </div>
  </div>`;
  document.getElementById("again").onclick = () => { if (!past) { S = null; try { localStorage.removeItem(LS); } catch (e) {} } go("setup"); };
  document.getElementById("retry").onclick = () => {
    const ids = R.ids.filter(n => BY[n] && R.answers[n] !== K(n));
    S = newSession("practice", shuffle(ids), 0); save(); go("quiz");
  };
  const th = document.getElementById("toHist"); if (th) th.onclick = () => go("history");
  const sh = document.getElementById("seeHist"); if (sh) sh.onclick = () => go("history");
}

function card(d, pick, order, editable) {
  const ord = order || Object.keys(d.o), lab = k => order ? L[ord.indexOf(k)] : k;
  const li = ord.map(k => editable
    ? `<li class="${k === d.a ? "right" : ""}"><button class="setans" data-n="${d.n}" data-k="${k}" aria-pressed="${k === d.a}" title="Set ${k} as the answer"><b>${lab(k)}</b><span>${esc(d.o[k])}</span></button></li>`
    : `<li class="${k === d.a ? "right" : (k === pick ? "wrong" : "")}"><b>${lab(k)}</b><span>${esc(d.o[k])}</span></li>`).join("");
  return `<article class="item">
    <div class="meta"><span class="label">Question ${d.n}</span>${pill(d)}${pick !== undefined ? `<span class="label">${pick ? "You chose " + lab(pick) : "Not answered"}. Answer ${lab(d.a)}</span>` : `<span class="label">Answer ${d.a}</span>`}</div>
    <p class="q">${esc(d.q)}</p><ol>${li}</ol>
    ${d.note ? `<p class="note">${esc(d.note)}${d.status === "corrected" && !order ? " Was " + d.orig + "." : ""}</p>` : ""}
  </article>`;
}

/* ---------- history ---------- */
const HK = "afx-history-v1";
let viewAttempt = null;
const loadHist = () => { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch (e) { return []; } };
const saveHist = h => { try { localStorage.setItem(HK, JSON.stringify(h)); } catch (e) {} };
function logAttempt() {
  if (S.logged) return;
  const key = Object.fromEntries(S.ids.map(n => [n, BY[n].a]));
  const right = S.ids.filter(n => S.answers[n] === key[n]).length;
  const h = loadHist();
  h.push({ id: Date.now(), mode: S.mode, started: S.started, ended: S.ended, ids: S.ids, answers: S.answers, flags: S.flags, oo: S.oo, key, right, total: S.ids.length });
  saveHist(h); S.logged = true;
}
const pctOf = a => Math.round(a.right / a.total * 100);
const when = t => new Date(t).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function trendChart(h) {
  const W = 640, H = 210, l = 40, r = 16, t = 14, b = 30, iw = W - l - r, ih = H - t - b;
  const x = i => h.length === 1 ? l + iw / 2 : l + i * iw / (h.length - 1);
  const y = p => t + ih - p / 100 * ih;
  const pts = h.map((a, i) => [x(i), y(pctOf(a))]);
  const step = Math.max(1, Math.ceil(h.length / 12));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score per attempt">
    ${[0, 25, 50, 75, 100].map(p => `<line x1="${l}" x2="${W - r}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)" stroke-width="1"/><text x="${l - 8}" y="${y(p) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${p}%</text>`).join("")}
    <line x1="${l}" x2="${W - r}" y1="${y(PASS)}" y2="${y(PASS)}" stroke="var(--flag)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - r}" y="${y(PASS) - 6}" text-anchor="end" font-size="11" fill="var(--flag)">Pass ${PASS}%</text>
    ${pts.length > 1 ? `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--form)" stroke-width="2.5" stroke-linejoin="round"/>` : ""}
    ${pts.map(([px, py], i) => `<circle cx="${px}" cy="${py}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${pctOf(h[i]) >= PASS ? "var(--form)" : "var(--pen)"}" stroke="var(--sheet)" stroke-width="1.5"><title>Attempt ${i + 1}: ${pctOf(h[i])}%</title></circle>`).join("")}
    ${h.map((a, i) => i % step === 0 || i === h.length - 1 ? `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${i + 1}</text>` : "").join("")}
  </svg>`;
}

function history() {
  const h = loadHist();
  if (!h.length) {
    app.innerHTML = `<h1>Attempt history</h1>
      <p class="lede">No attempts yet. Finish an exam or practice set and your score, weak topics and most-missed questions show up here.</p>
      <div style="margin-top:24px"><button class="btn primary" id="hstart">Start an exam</button></div>`;
    document.getElementById("hstart").onclick = () => go("setup");
    return;
  }
  const ps = h.map(pctOf), last = ps[ps.length - 1], prev = ps[ps.length - 2];
  const avg = Math.round(ps.reduce((s, p) => s + p, 0) / ps.length);
  const passes = ps.filter(p => p >= PASS).length;
  // topic and question stats
  const topic = {}, q = {};
  h.forEach(a => a.ids.forEach(n => {
    const ok = a.answers[n] === a.key[n], tp = (BY[n] && BY[n].t) || "General";
    (topic[tp] = topic[tp] || { seen: 0, right: 0 }).seen++; if (ok) topic[tp].right++;
    (q[n] = q[n] || { seen: 0, miss: 0 }).seen++; if (!ok) q[n].miss++;
  }));
  const topics = Object.entries(topic).map(([k, v]) => ({ k, ...v, p: Math.round(v.right / v.seen * 100) })).sort((a, b) => a.p - b.p);
  const missed = Object.entries(q).filter(([n, v]) => v.miss && BY[n]).map(([n, v]) => ({ n: +n, ...v })).sort((a, b) => b.miss - a.miss || b.miss / b.seen - a.miss / a.seen).slice(0, 12);
  app.innerHTML = `
  <h1>Attempt history</h1>
  <p class="hsum"><b>${h.length}</b> attempt${h.length > 1 ? "s" : ""}, <b>${passes}</b> passed. Last score <b>${last}%</b>${prev !== undefined ? ` (${last - prev >= 0 ? "up" : "down"} ${Math.abs(last - prev)} from the one before)` : ""}, best <b>${Math.max(...ps)}%</b>, average <b>${avg}%</b>.</p>
  <section class="hsec"><h2>Score per attempt</h2><div class="chartbox">${trendChart(h)}</div></section>
  <div class="hgrid">
    <section class="hsec"><h2>Accuracy by topic</h2>
      <div class="topics">${topics.map(t => `<div class="trow"><span class="tname">${esc(t.k)}</span><span class="tbar"><i style="width:${t.p}%" class="${t.p >= PASS ? "ok" : "no"}"></i></span><span class="tval">${t.p}%</span><span class="tn">${t.right}/${t.seen}</span></div>`).join("")}</div>
      <p class="note">Bars below ${PASS}% are below the pass mark.</p>
    </section>
    <section class="hsec"><h2>Most missed questions</h2>
      ${missed.length ? `<ol class="missed">${missed.map(m => `<li><span class="mq">${esc(BY[m.n].q.length > 130 ? BY[m.n].q.slice(0, 130) + "…" : BY[m.n].q)}</span><span class="mm">Missed ${m.miss} of ${m.seen}</span></li>`).join("")}</ol>
      <button class="btn primary" id="hpractice">Practise these ${missed.length}</button>` : `<p class="empty">You haven't missed any question yet.</p>`}
    </section>
  </div>
  <section class="hsec"><h2>All attempts</h2>
    <div class="tablebox"><table class="htable">
      <thead><tr><th>#</th><th>Date</th><th>Mode</th><th>Score</th><th>Result</th><th>Time</th><th></th></tr></thead>
      <tbody>${h.map((a, i) => ({ a, i })).reverse().map(({ a, i }) => `<tr>
        <td>${i + 1}</td><td>${when(a.ended)}</td><td>${a.mode === "exam" ? "Exam" : "Practice"}</td>
        <td>${a.right}/${a.total} (${pctOf(a)}%)</td>
        <td><span class="res ${pctOf(a) >= PASS ? "ok" : "no"}">${pctOf(a) >= PASS ? "Pass" : "Fail"}</span></td>
        <td>${fmt((a.ended - a.started) / 1000)}</td>
        <td><button class="btn small" data-a="${i}">Review</button></td></tr>`).join("")}</tbody>
    </table></div>
    <button class="btn" id="hclear" style="margin-top:16px">Clear history</button>
  </section>`;
  app.querySelectorAll(".htable button[data-a]").forEach(b => b.onclick = () => { viewAttempt = h[+b.dataset.a]; go("results"); });
  const hp = document.getElementById("hpractice");
  if (hp) hp.onclick = () => { S = newSession("practice", shuffle(missed.map(m => m.n)), 0); save(); go("quiz"); };
  const hc = document.getElementById("hclear");
  hc.onclick = () => {
    if (!hc.dataset.armed) { hc.dataset.armed = 1; hc.textContent = "Click again to delete all attempts"; return; }
    try { localStorage.removeItem(HK); } catch (e) {} history();
  };
}

/* ---------- answer key ---------- */
function key() {
  app.innerHTML = `
    <h1>All ${DATA.length} questions</h1>
  <p class="lede">Click an option to make it the answer. Your choice is used for scoring in this browser.</p>
  <div class="toolbar">
    <input type="search" id="ks" placeholder="Search words or a question number" aria-label="Search">
    <select id="kf" aria-label="Filter"><option value="all">All</option><option value="corrected">Key corrected (${NCOR})</option><option value="disputed">Disputed (${NDIS})</option><option value="user">Set by you (<span id="nu">${Object.keys(OV).length}</span>)</option></select>
    <button class="btn" id="kreset" ${Object.keys(OV).length ? "" : "hidden"}>Reset all to default</button>
  </div>
  <div class="list" id="kl"></div><div class="more"><button class="btn" id="km">Show more</button></div>`;
  keyLimit = 40;
  const draw = () => {
    const s = document.getElementById("ks").value.trim().toLowerCase(), f = document.getElementById("kf").value;
    const rows = DATA.filter(d => (f === "all" || (f === "user" ? d.user : d.status === f)) && (!s || String(d.n) === s.replace("#", "") || (d.q + " " + Object.values(d.o).join(" ")).toLowerCase().includes(s)));
    document.getElementById("kl").innerHTML = rows.length ? rows.slice(0, keyLimit).map(d => card(d, undefined, null, true)).join("") : `<p class="empty">No question matches "${esc(s)}".</p>`;
    document.getElementById("km").hidden = rows.length <= keyLimit;
    const nu = Object.keys(OV).length;
    document.querySelector('#kf option[value="user"]').textContent = `Set by you (${nu})`;
    document.getElementById("kreset").hidden = !nu;
  };
  document.getElementById("kl").addEventListener("click", e => {
    const b = e.target.closest(".setans"); if (!b) return;
    setAnswer(+b.dataset.n, b.dataset.k); draw();
  });
  const rs = document.getElementById("kreset");
  rs.onclick = () => {
    if (!rs.dataset.armed) { rs.dataset.armed = 1; rs.textContent = "Click again to reset all"; return; }
    OV = {}; try { localStorage.removeItem(LSK); } catch (e) {} applyOv(); delete rs.dataset.armed; rs.textContent = "Reset all to default"; draw();
  };
  document.getElementById("ks").oninput = () => { keyLimit = 40; draw(); };
  document.getElementById("kf").onchange = () => { keyLimit = 40; draw(); };
  document.getElementById("km").onclick = () => { keyLimit += 40; draw(); };
  draw();
}

/* keyboard shortcuts on the exam screen */
document.addEventListener("keydown", e => {
  if (view !== "quiz" || !S || S.reviewing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches && e.target.matches("input[type=search],select,textarea")) return;
  const k = e.key.toLowerCase();
  const i = "abcd".indexOf(k);
  if (i >= 0) { const r = document.querySelectorAll(".choice input")[i]; if (r && !r.disabled) { r.checked = true; r.dispatchEvent(new Event("change")); if (S.mode !== "practice") quiz(); } e.preventDefault(); }
  else if (e.key === "ArrowRight") { document.getElementById("next")?.click(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { const p = document.getElementById("prev"); if (p && !p.disabled) p.click(); e.preventDefault(); }
  else if (k === "m") { document.getElementById("mark")?.click(); e.preventDefault(); }
});

/* boot */
(function () {
  const prev = load();
  if (prev && prev.done) { S = prev; go("results"); } else go("setup");
})();
</script>
