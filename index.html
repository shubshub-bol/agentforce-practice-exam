indexed articles to only those belonging to selected data categories, thereby improving indexing precision."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-14","t":"Deployment & security"},{"n":78,"q":"What is a valid option for Omni-Channel routing for a messaging channel?","o":{"A":"Agentforce Service Agent","B":"Autolaunched flow","C":"Agentforce Employee Agent"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-15","t":"Agent types & channels"},{"n":79,"q":"Universal Containers has deployed a Service Agent to production that handles billing, returns, and technical support across 12 subagents (formerly known as topics). Following a business process change, the Agentforce Specialist updates the Billing subagent instructions to include a new refund escalation path. Within days, the customer experience team reports that billing interactions are intermittently routing to the General FAQ subagent instead. Which approach is most effective in helping to diagnose the cause and confirm the full extent of the impact?","o":{"A":"Enable Utterance Analysis in the production org to review conversation logs for misrouted interactions, then iteratively adjust the Billing subagent instructions in Agent Builder until the misrouting rate falls below an acceptable threshold.","B":"Replicate each suspected failure scenario manually in Agentforce Builder's Conversation Preview, document the subagent selection results, and update the Billing subagent instructions before redeploying the agent.","C":"Re-run the stored test suite in Agentforce Testing Center against the modified agent, review Subagent Pass % and Action Pass % metrics to isolate regressions, then extend the suite to cover the refund escalation path."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-16","t":"Testing & monitoring"},{"n":80,"q":"Universal Containers is building an Agentforce Service Agent to help customers track their purchases. To store the customer's order number during the conversation, the Agentforce Specialist creates and initializes a variable in Agent Script using the declaration order_id: string = \"\", omitting the mutable keyword. During testing, the agent attempts to update this variable with the user's order number via the @utils.setVariables utility. What is the result of this variable declaration at runtime?","o":{"A":"The variable defaults to mutable; the mutable keyword is optional and has no effect, allowing the agent to successfully update the variable.","B":"The declaration is a syntax error and the agent will fail to deploy.","C":"The variable is treated as read-only; it cannot be updated by actions or @utils.setVariables at runtime because it lacks the mutable keyword."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-17","t":"Testing & monitoring"},{"n":81,"q":"An Agentforce Specialist at Universal Containers observes that the agent frequently directs customers with clear billing inquiries to the general troubleshooting subagent (formerly known as a topic). This misrouting is causing a spike in average handle time and missing service-level agreement (SLA) targets. The contact center manager requires a solution that is quick to implement but preserves the agent's ability to handle complex, non-linear conversations. What is the most appropriate approach to resolve this?","o":{"A":"Update the agent's global 'System Instructions' to include a list of forbidden keywords for each subagent.","B":"Audit subagent instructions for semantic competition and implement deterministic filters to guide the planner's selection.","C":"Create a 'Router' sub-flow that uses a Decision element to manually assign every incoming request to a specific subagent."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-18","t":"Testing & monitoring"},{"n":82,"q":"Pacific Distribution Co. is implementing a system to manage partner order support and inventory inquiries. The company needs to ensure that large documents are processed effectively to improve retrieval accuracy when agents respond to partner queries. Understanding how documents are broken down and indexed is crucial for this implementation. What is a key characteristic of the chunking process?","o":{"A":"Chunking breaks large documents into smaller units called passages.","B":"The chunking process returns entire documents to the large language model (LLM) for processing.","C":"Chunking strategies are interchangeable and do not affect the retrieval process."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-19","t":"Data, retrieval & Knowledge"},{"n":83,"q":"Universal Containers (UC) has a new AI project. What should UC consider when adding a related list on the Account object to be used in the prompt template?","o":{"A":"The fields for the related list are based on the default page layout of the Account for the current user.","B":"After selecting a related list from the Account, use the field picker to choose merge fields in Prompt Builder.","C":"Prompt Builder must be used to assign the fields from the related list as a JSON format."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-20","t":"Prompt Builder"},{"n":84,"q":"Universal Containers is building an Agentforce Service Agent to handle password resets. The agent must first verify the customer's identity using an email verification code, then once identity is confirmed the agent must execute the organization's existing password reset Flow. The identity verification subagent is already configured. Which implementation approach should the Agentforce Specialist recommend?","o":{"A":"Create an agent action referencing the password reset Flow, assign it to the identity verification subagent, and call it deterministically from the subagent's reasoning block using Agent Script conditional logic.","B":"Create a separate subagent named Password Reset, configure it with an action that invokes the Flow, and pass the identity verification variable as context so the subagent's instructions can reference the verified status before proceeding.","C":"Add an instruction to the identity verification subagent directing the agent to trigger the password reset Flow once identity is confirmed, and store the customer's reset intent in a conversation variable so the reasoning engine can reference it when deciding whether to proceed."},"a":"B","orig":"B","status":"disputed","note":"Running the Flow from Agent Script logic (A) also argued.","src":"SET3-21","t":"Agent types & channels"},{"n":85,"q":"Universal Containers uses Agentforce to manage its customer service operations. However, the company uses a completely separate, third-party AI agent system to manage its warehouse logistics. UC wants the Agentforce customer service agent to be able to seamlessly request shipping reroutes and collaborate autonomously with the warehouse agent. Which open standard protocol is specifically designed to facilitate this exact type of cross-platform collaboration?","o":{"A":"Model Context Protocol (MCP)","B":"Advanced Data Retrieval (ADR) standard","C":"Agent-to-Agent (A2A) protocol"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-22","t":"Agent types & channels"},{"n":86,"q":"Before deploying a Retrieval Augmented Generation (RAG) solution into production, an Agentforce Specialist wants to evaluate whether their individual custom retrievers are surfacing the most relevant chunks for specific queries without writing any code. Which tool should the specialist use to test the retriever?","o":{"A":"The Retriever Playground","B":"Agentforce Testing Center","C":"Data 360 Query Editor"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-23","t":"Testing & monitoring"},{"n":87,"q":"In a Knowledge-based data library configuration, what is the primary difference between the identifying fields and the content fields?","o":{"A":"Identifying fields highlight key terms for relevance scoring, while content fields store the full text of the article for retrieval.","B":"Identifying fields categorize articles for indexing purposes, while content fields provide a brief summary for display.","C":"Identifying fields help locate the correct Knowledge article, while content fields enrich AI responses with detailed information."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-24","t":"Data, retrieval & Knowledge"},{"n":88,"q":"An AI Specialist at Universal Containers is trying to set up a new Field Generation prompt template. They take the following steps. 1. Create a new Field Generation prompt template. 2. Choose Case as the object type. 3. Select the custom field AI_Analysis__c as the target field. After creating the prompt template, the AI Specialist saves, tests, and activates it. However, when they go to a case record, the AI Analysis field does not show the (Sparkle) icon on the Edit pencil. When the AI Specialist was editing the field, it was behaving as a normal field. Which critical step did the AI Specialist miss?","o":{"A":"They forgot to reactivate the Lightning page layout for the Case object after activating their Field Generation prompt template.","B":"They forgot that the Case Object is not supported for AI generation as Einstein Service Replies should be used instead.","C":"They forgot to edit the Lightning page layout and associate the field to a prompt template."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-25","t":"Prompt Builder"},{"n":89,"q":"An Agentforce Specialist wants to troubleshoot an agent that is hallucinating weblinks. The agent has an action that uses a prompt template, which is using a knowledge retriever, to generate the output text that the agent will use. Which process is appropriate to find the root cause of the hallucination behavior?","o":{"A":"Examine the prompt instructions and contents of the chunks shown in the resolved prompt output.","B":"Examine the topic instructions and ensure the word \"ALWAYS\" is used in the hallucination guardrails.","C":"Examine the topic name and classification description for hallucination guardrails."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-26","t":"Prompt Builder"},{"n":90,"q":"Northern Trail Outfitters is testing an agent connected to an Agentforce Data Library. The agent successfully retrieves the correct data from the library, but delivers the response to the user as raw JSON structures instead of grammatically correct conversational language. Which quality evaluation scores poorly in this scenario?","o":{"A":"Coherence","B":"Conciseness","C":"Completeness"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-27","t":"Testing & monitoring"},{"n":91,"q":"An insurance company needs a Service Agent to ground its responses based on company-specific PDFs and a comprehensive knowledge base. Which type of retriever should the Agentforce Specialist use to meet this requirement?","o":{"A":"Dynamic retriever","B":"Individual retriever","C":"Ensemble retriever"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-28","t":"Data, retrieval & Knowledge"},{"n":92,"q":"An Agentforce Specialist builds a new Service Agent that uses a custom action built on a flow. The agent has been tested in a sandbox and is now ready to deploy. What is a key consideration regarding the activation status of the agent in the production environment?","o":{"A":"The agent will be activated automatically only if the flow is also active.","B":"The agent must be manually activated in production, regardless of its status in the sandbox.","C":"The agent will automatically be activated upon successful deployment."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-29","t":"Deployment & security"},{"n":93,"q":"Ursa Major Solar is developing a help agent that must answer customer questions by grounding prompts in data from both internal knowledge articles and an external partner portal. The Agentforce Specialist configures the agent to use a Data 360 search index. During testing in the Agentforce Builder, the agent occasionally provides conflicting answers, and the specialist needs to differentiate between these two grounding sources to troubleshoot the responses. Which Data 360 process should the specialist review to ensure the origin of the information is accurately identified and made available?","o":{"A":"The data harmonization process, where raw data is mapped to data model objects (DMOs) and source metadata is standardized to be queried specifically by hybrid retrievers","B":"The Retrieval-Augmented Generation (RAG) synthesis phase, where the large language model (LLM) automatically uses a semantic retriever to append the source system tag to the final generated output","C":"The Data 360 retriever function process, where retrieved content can be filtered based on source metadata (such as document type or author) to refine results before they are ranked using semantic or hybrid search"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-30","t":"Testing & monitoring"},{"n":94,"q":"At Horizon Insurance, the customer service team is reporting that the agent consistently routes claims intake conversations to the Policy Inquiry subagent (formerly known as a topic), even though user intent clearly indicates a claims-related issue. This misrouting persists despite the user clearly expressing the intent to discuss a claim. The Agentforce Specialist added guard conditions but the problem persists. What is most likely causing this incorrect routing in Horizon Insurance's agent?","o":{"A":"Procedural instructions requiring Salesforce Flows to route to the correct subagent","B":"Use of global instructions to define subagent routing for agents in compliance-regulated environments","C":"Overlap in subagent descriptions and entry conditions between 'Claims Intake' and 'Policy Inquiry' subagents"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-31","t":"Agent Builder & actions"},{"n":95,"q":"Universal Containers is testing an agent with a \"Reset Password\" action restricted by the guard available when @variables.isVerified == True. During a single conversation turn, the large language model (LLM) successfully sets the isVerified flag to true using @utils.setVariables, but fails to invoke the \"Reset Password\" action immediately afterward. What must the Agentforce Specialist consider regarding how the reasoning engine evaluates action availability?","o":{"A":"The action is available from the start; the reasoning engine's intent to solve the user's issue automatically overrides the available when guard.","B":"The action becomes available immediately; available when conditions dynamically re-evaluate after every variable change within a single turn.","C":"The action remains unavailable for that turn; available when conditions control action visibility to the LLM and evaluate before the reasoning cycle begins, so the action won't be callable until the next turn."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-32","t":"Testing & monitoring"},{"n":96,"q":"Universal Containers has developed an agent for loan origination workflows that must handle both non-determinism and strict regulatory compliance requirements. The agent needs to ensure that identity verification and credit check steps execute in a precise sequence without deviation. Which statement correctly differentiates these two instruction patterns in Agent Script's hybrid reasoning approach?","o":{"A":"Declarative instructions require Flow execution for business logic, while procedural instructions are native to Agent Script but cannot access external systems or APIs.","B":"Declarative instructions provide conversational flexibility through large language model (LLM) interpretation, while procedural instructions use the '->' prefix to enforce guaranteed execution order with run, if, and transitions.","C":"Declarative instructions only work in Canvas View for visual editing, while procedural instructions require Script View and cannot be represented in the visual interface."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-33","t":"Prompt Builder"},{"n":97,"q":"Universal Containers (UC) needs to ensure that its agent can immediately process customer returns by validating order eligibility before proceeding with the return process. UC wants to maintain a natural conversational flow for customers while ensuring that the order validation step is strictly followed. What should the Agentforce Specialist do to achieve the desired outcome?","o":{"A":"Use Salesforce Flow to guide the large language model (LLM) in handling order validation and the return process.","B":"Use a custom Apex @InvocableMethod to handle the entire return process.","C":"Use procedural instructions in the Agent Script to enforce the order validation step."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-34","t":"Agent Builder & actions"},{"n":98,"q":"Universal Containers needs to create Data Cloud reports to understand agent behavior. Which data lake object (DLO) represents an overarching container capturing contiguous interactions with one or more AI agents?","o":{"A":"AIAgentSession","B":"AIAgentInteraction","C":"AIAgentInteractionMessage"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-35","t":"Data, retrieval & Knowledge"},{"n":99,"q":"An Agentforce Specialist at Universal Containers (UC) is building with no-code tools only. They have many small accounts that are only touched periodically by a specialized sales team, and UC wants to maximize the sales operations team's time. UC wants to help prep the sales team for calls by: • Summarizing past purchases • Displaying products the contact has shown interest in (with data captured via Data Cloud) • Providing a recap of past email and phone conversations that have transcripts Which approach should the Agentforce Specialist recommend to achieve this goal?","o":{"A":"Deploy UC's own custom foundational model on this data first.","B":"Use a prompt template grounded on CRM and Data Cloud data using standard foundation models.","C":"Fine tune the standard foundational model due to the complexity of the data."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-36","t":"Deployment & security"},{"n":100,"q":"A company built a custom Apex action invoked by an Employee Agent to fetch data from an external API. The callout method uses the current user's Salesforce session ID to authenticate the callout. The external callout works perfectly in the UI, but silently fails when the agent triggers it. What is the architectural best practice to fix this?","o":{"A":"Explicitly extend the Apex class security to the logged-in user's profile.","B":"Ensure the Employee Agent is assigned the AgentforceServiceAgentUserPsg.","C":"Replace the session ID retrieval with a Named Credential."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-37","t":"Deployment & security"},{"n":101,"q":"Which part of the Einstein Trust Layer architecture leverages an organization's own data within a large language model (LLM) prompt to confidently return relevant and accurate responses?","o":{"A":"Dynamic Grounding","B":"Prompt Defense","C":"Data Masking"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-44","t":"Prompt Builder"},{"n":102,"q":"Universal Containers (UC) is using related list merge fields in a prompt template associated with an Account object in Prompt Builder. What should UC consider?","o":{"A":"If person accounts have been enabled, merge fields will not be available for the Account object.","B":"Prompt generation will yield no response when there is no related list associated with an Account in runtime.","C":"The Activities related list on the Account object is not supported because it is a polymorphic field."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-45","t":"Prompt Builder"},{"n":103,"q":"Universal Containers' Service Agent executes a flow action to retrieve Opportunity records. The Opportunity object has an organization-wide default (OWD) of Private. The agent returns no results despite matching records existing and the flow logic being correctly configured. Which resolution strictly adheres to the principle of least privilege?","o":{"A":"Add the required object permissions to the Einstein Service Agent User's permission set and configure appropriate sharing rules.","B":"Set the agent action flow to run in System Mode without sharing.","C":"Change the Opportunity object's OWD to Public Read Only so the Einstein Service Agent User can access records."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-46","t":"Deployment & security"},{"n":104,"q":"Universal Containers wants to assign agents to improve department efficiency. Which configuration ensures the right tasks are handled by the right agents?","o":{"A":"SDR Agent for lead qualification, Service Agent for support tickets, Employee Agent for HR requests","B":"Sales Coach Agent for lead and service Agent for HR requests, and Support tickets to ensure cases are available","C":"One Service Agent to efficiently handle each of these scenarios, which reduces the number of agent types needed for support"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-47","t":"Agent types & channels"},{"n":105,"q":"Cloud Kicks (CK) is developing a prompt template in a sandbox and has created multiple saved versions during testing. CK is now preparing to move the template to production. What is a consideration when deploying the template to production?","o":{"A":"Deploying a template requires all previous versions to be manually activated before deployment can succeed.","B":"Deploying a template automatically removes all prior versions and replaces them with the deployed version in production.","C":"Deploying a prompt template includes all versions of the prompt template that are in the source org to the target org."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-48","t":"Testing & monitoring"},{"n":106,"q":"Which useful metrics does Agentforce Observability provide to a customer service team related to a Customer Service Agent?","o":{"A":"Call deflection rates, cost per interaction, and memory consumption","B":"Call deflection rates, productivity, and abandoned session rates","C":"Call deflection rates, abandoned session rates, and user intent ratings"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-49","t":"Testing & monitoring"},{"n":107,"q":"Pinnacle Healthcare is enhancing its agent and Agent Script implementation to improve patient scheduling and care coordination. The head of compliance has identified a need to ensure deterministic behavior for agents when verifying patient information before scheduling appointments. The process must enforce compliance by gating downstream actions (for example, scheduling) until patient verification is complete. What is the most appropriate approach the Agentforce Specialist should recommend while adhering to standard configuration guidelines?","o":{"A":"Use template expressions in the action descriptions to dynamically display instructions based on the verification status.","B":"Use '@utils.setVariables' to update a mutable session variable for patient verification status and gate scheduling actions with 'available when'.","C":"Call a custom Apex '@InvocableMethod' to enforce the verification logic and dynamically update the scheduling action availability."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-50","t":"Agent Builder & actions"},{"n":108,"q":"An Agentforce Specialist is creating a custom action in Agentforce. Which option is available for the Agentforce Specialist to choose for the custom agent action?","o":{"A":"Flows","B":"SOQL","C":"Apex trigger"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-51","t":"Agent Builder & actions"},{"n":109,"q":"The Agentforce Specialist for Coral Cloud Resorts wants to create an agent that will automate the resolution of a large portion of guest complaints related to their vacation experiences. The agent will be able to offer upgrades, hotel credit, and other complimentary options. The agent will also be in charge of escalating the case to a human when a guest has suffered a major disruption (such as cancellation). Following Salesforce best practices, which type of agent should the Agentforce Specialist create?","o":{"A":"Sales Agent with a Flex prompt template","B":"Custom Agent with a Flex prompt template","C":"Service Agent with a Flex prompt template"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-53","t":"Prompt Builder"},{"n":110,"q":"The VP of Service at Universal Containers (UC) requires a report showing weekly deflection rate trends and escalation volumes for the Agentforce Service Agent over the past 90 days. Which approach should the Agentforce Specialist recommend?","o":{"A":"Enable Agentforce Health Monitoring to configure escalation rate alert thresholds and export the resulting trend data into a Tableau dashboard aligned with the VP of Service's reporting requirements.","B":"Use Agent Analytics within Agentforce Observability, which provides Tableau-powered dashboards with prebuilt deflection rate, escalation volume, and abandonment metrics calculated from agent session data stored in Data 360.","C":"Query the OTEL-compliant Session Tracing Data Model in Data 360 using CRM Analytics to build a custom dashboard with deflection rate calculations and week-over-week escalation comparisons tailored to UC's reporting standards."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-54","t":"Testing & monitoring"},{"n":111,"q":"Universal Containers (UC) needs to create a sales email with a custom prompt template. UC needs to ground on the following data: Opportunity Products, Events near the customer, Tone and voice examples. How should UC obtain related items?","o":{"A":"Create a Flex template that takes the records in question as inputs.","B":"Utilize a standard email template and manually insert the required data fields.","C":"Call a prompt-initiated flow to fetch and ground the required data."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-55","t":"Prompt Builder"},{"n":112,"q":"Universal Containers wants to allow its service agents to query the current fulfillment status of an order with natural language. There is an existing autolaunched flow to query the information from Oracle ERP, which is the system of record for the order fulfillment process. How should an Agentforce Specialist apply the power of conversational AI to this use case?","o":{"A":"Create a Flex prompt template in Prompt Builder.","B":"Create a custom Agent action which calls a flow.","C":"Configure the Integration Flow Standard Action in Agent Builder."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-56","t":"Prompt Builder"},{"n":113,"q":"Universal Containers has multiple Salesforce orgs, each with a unique customer service agent where a verification agent must pass customer identity data to downstream agents handling account modifications. The customer ID must remain secure and persistent across agent handoffs without exposure to large language model (LLM) modification. What is the most appropriate configuration?","o":{"A":"Store customer identity information in conversation variables created by the first agent and have other agents read those same conversation variables.","B":"Implement a custom object to temporarily store verification status and have each agent query it via SQL actions during execution.","C":"Use the Agent API to start the downstream agent's session and pass the verified customer ID as a read-only context variable, ensuring security and preventing LLM alteration."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-58","t":"Agent types & channels"},{"n":114,"q":"Universal Containers wants to ensure that its AI agent's responses consistently reflect the company's unique brand voice and specific quality standards beyond simple pass or fail checks. How should the Agentforce Specialist configure the Testing Center to evaluate this specific criteria?","o":{"A":"Enable the Coherence quality evaluation.","B":"Use the default Response Evaluation metric.","C":"Create a custom evaluation using a large language model (LLM) judge."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-59","t":"Testing & monitoring"},{"n":115,"q":"Universal Containers' Agentforce Specialist suspects the Service Agent is systematically misclassifying billing dispute intents under a general enquiry topic, causing incorrect actions to execute. The administrator needs to identify this pattern across production sessions without reviewing individual transcripts. What should the specialist recommend?","o":{"A":"Enable Session Tracing in Agentforce Observability and query the Data 360 Session Tracing Data Model directly, grouping moments by topic classification API name to surface billing dispute intents routed to the incorrect topic at scale.","B":"Use Agent Optimization in Agentforce Studio, which segments production sessions into moments and generates system intent clusters weekly from cross-session analysis.","C":"Upload a representative set of billing dispute utterances to the Agentforce Testing Center and run a batch test comparing expected versus actual topic classifications to identify the scope of the misclassification pattern across production intents."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-60","t":"Testing & monitoring"},{"n":116,"q":"Universal Containers is auditing its AI architecture and needs to ensure that its developers are restricted to using only specifically approved large language models (LLMs). How should an Agentforce Specialist manage and prevent unapproved models from being accessed across the organization?","o":{"A":"Apply an Attribute-Based Access Control (ABAC) policy within the Einstein Trust Layer to block prompts from routing to unapproved LLMs.","B":"Write a strict system instruction within the Agent Builder stating, \"Never use external models for reasoning\".","C":"Ensure only approved LLMs are enabled in Model Provider section under Einstein setup."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-61","t":"Testing & monitoring"},{"n":117,"q":"An Agentforce Specialist turned on Einstein Generative AI in Setup. Now, the Agentforce Specialist would like to create custom prompt templates in Prompt Builder. However, they cannot access Prompt Builder in the Setup menu. What is causing the problem?","o":{"A":"The Prompt Template Manager permission set was not assigned correctly.","B":"The Prompt Template User permission set was not assigned correctly.","C":"The large language model (LLM) was not configured correctly in Data Cloud."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-63","t":"Deployment & security"},{"n":118,"q":"Universal Containers (UC) is deploying several prompt templates to assist its support agents using Salesforce's standard foundation models. Leadership requires the generated responses to consistently reflect an empathetic and highly professional tone. UC only permits the use of standard foundational large language models (LLMs). What is the most effective prompt engineering technique the Agentforce Specialist should implement in Prompt Builder to fulfill this requirement?","o":{"A":"Configure the prompt template tone with a dataset of past interactions using different writing styles, intensifiers, and punctuation to permanently alter the LLM default tone.","B":"Include a direct instruction asking the LLM to role-play as a specific character (for example, \"Act as an empathetic customer support agent\") to provide context and establish the tone.","C":"Include multiple-choice picklist questions within the prompt template to systematically test and correct the LLM's understanding of the desired context before generating the output."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-64","t":"Deployment & security"},{"n":119,"q":"Cloud Kicks uses a third-party agent for research and an Agentforce agent for customer service. Which purpose-built protocol allows cross-vendor agents to communicate?","o":{"A":"Model Context Protocol (MCP)","B":"Application Programming Interface (API)","C":"Agent-to-Agent (A2A)"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-65","t":"Agent types & channels"},{"n":120,"q":"Universal Containers has deployed Agentforce to handle customer order tracking, returns, and loyalty support. The agent needs to balance conversational flexibility for customer inquiries with guaranteed execution of identity verification steps before accessing the account information. The development team is evaluating how to structure the agent's instruction pattern to meet both requirements. Which statement correctly describes hybrid reasoning in Agentforce Agent Script?","o":{"A":"Hybrid reasoning uses multiple large language model (LLM) models simultaneously, with one model handling conversational responses and another model executing deterministic business logic through Flow integration.","B":"Hybrid reasoning requires Canvas View for declarative instructions and Script View for procedural instructions, as each editor provides different capabilities for the respective instruction types.","C":"Hybrid reasoning combines declarative natural language instructions that allow large language model (LLM) interpretation with procedural instructions using the '->' prefix that enforce guaranteed execution order."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET4-60","t":"Deployment & security"}];
const BY = Object.fromEntries(DATA.map(d => [d.n, d]));
const ALL = DATA.map(d => d.n);
document.querySelector(".brand small").textContent = DATA.length + " questions";
const NCOR = DATA.filter(d => d.status === "corrected").length, NDIS = DATA.filter(d => d.status === "disputed").length;
const PASS = 73;
const LS = "afx-exam-v2";
const app = document.getElementById("app");
let S = null, view = "setup", timerId = null, keyLimit = 40;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const DEF = Object.fromEntries(DATA.map(d => [d.n, d.a]));
const LSK = "afx-key-v2";
let OV = {};
try { OV = JSON.parse(localStorage.getItem(LSK)) || {}; } catch (e) {}
const applyOv = () => DATA.forEach(d => { d.a = OV[d.n] || DEF[d.n]; d.user = !!OV[d.n]; });
const setAnswer = (n, k) => { if (k === DEF[n]) delete OV[n]; else OV[n] = k; try { localStorage.setItem(LSK, JSON.stringify(OV)); } catch (e) {} applyOv(); };
applyOv();
const pill = d => (d.user ? `<span class="pill user">Set by you, default ${DEF[d.n]}</span>` : "") + (d.status === "reviewed" ? "" : `<span class="pill ${d.status}">${d.status === "corrected" ? "Key corrected" : "Disputed"}</span>`);

function setTab(v) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === (v === "key" ? "key" : (v === "history" || (v === "results" && viewAttempt)) ? "history" : "setup"))));
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.view === "key") go("key"); else if (b.dataset.view === "history") go("history"); else go(S && !S.done ? "quiz" : (S && S.done ? "results" : "setup"));
}));

function go(v) { view = v; setTab(v); clearInterval(timerId); document.body.classList.toggle("testing", v === "quiz"); window.scrollTo(0, 0); ({setup, quiz, results, key, history})[v](); }

/* ---------- setup ---------- */
function setup() {
  const prev = load();
  const resumable = prev && !prev.done && prev.ids && prev.ids.length;
  app.innerHTML = `
  <div class="setup">
    <div>
      <h1>Agentforce Specialist practice exam</h1>
      <p class="lede">${ALL.length} questions from three practice sets, duplicates removed, drawn in a new order each time. The real exam is 60 questions in 105 minutes, and you pass at ${PASS}%.</p>
      ${resumable ? `<div class="resume"><span>You have an unfinished ${prev.mode === "exam" ? "exam" : "practice set"}: ${Object.keys(prev.answers).length} of ${prev.ids.length} answered.</span><button class="btn primary" id="resume">Resume</button></div>` : ""}
    </div>
    <form class="panel" id="cfg">
      <fieldset><legend class="label">Mode</legend>
        <div class="seg">
          <label><input type="radio" name="mode" value="exam" checked><span>Exam</span></label>
          <label><input type="radio" name="mode" value="practice"><span>Practice</span></label>
        </div>
      </fieldset>
      <fieldset><legend class="label">Questions</legend>
        <div class="seg">
          ${[20, 40, 60, "all"].map(n => `<label><input type="radio" name="count" value="${n}" ${n === 60 ? "checked" : ""}><span>${n === "all" ? "All" : n}</span></label>`).join("")}
        </div>
      </fieldset>
      <fieldset><legend class="label">Options</legend>
        <label class="check"><input type="checkbox" id="timed" checked><span>Timer (105 min per 60 questions)</span></label>
      </fieldset>
      <button class="btn primary" type="submit" style="justify-content:center">Start</button>
    </form>
  </div>`;
  const f = document.getElementById("cfg");
  f.addEventListener("change", () => {
    const m = f.mode.value;
    document.getElementById("timed").checked = m === "exam";
  });
  f.addEventListener("submit", e => {
    e.preventDefault();
    const pool = ALL;
    const c = f.count.value === "all" ? pool.length : Math.min(+f.count.value, pool.length);
    const ids = shuffle(pool).slice(0, c);
    const timed = document.getElementById("timed").checked;
    S = newSession(f.mode.value, ids, timed ? Math.round(c * 105 / 60) * 60 : 0);
    save(); go("quiz");
  });
  const r = document.getElementById("resume");
  if (r) r.addEventListener("click", () => { S = prev; go("quiz"); });
}

/* ---------- quiz ---------- */
const L = "ABCD";
function newSession(mode, ids, limit) {
  return { mode, ids, oo: Object.fromEntries(ids.map(n => [n, shuffle(Object.keys(BY[n].o))])), answers: {}, flags: {}, idx: 0, started: Date.now(), limit, done: false, reviewing: false };
}
const orderOf = n => (S && S.oo && S.oo[n]) || Object.keys(BY[n].o);
function remaining() { return S.limit ? S.limit - (Date.now() - S.started) / 1000 : null; }

const addFoot = (inner, foot) => inner.replace(/<\/div>\s*$/, `<div class="xfoot-in">${foot}</div></div>`);
function examShell(inner) {
  const answered = Object.keys(S.answers).length;
  return `
  <div class="exam">
    <div class="xbar"><div class="xbar-in">
      <span class="xtitle">Agentforce Specialist practice ${S.mode === "exam" ? "exam" : "set"}</span>
      <span class="xprog">${S.reviewing ? `${answered} of ${S.ids.length} answered` : `Question ${S.idx + 1} of ${S.ids.length}`}</span>
      ${S.limit ? `<span class="xtime">Time remaining <b id="timer">--:--</b></span>` : ""}
      ${S.reviewing ? "" : `<button class="xmapbtn" id="maptoggle" aria-expanded="${mapOpen()}" aria-controls="qmap">Question map</button>`}
    </div></div>
    <div class="xbody">${inner}</div>
  </div>`;
}

const mapOpen = () => S.map === undefined ? innerWidth >= 1200 : S.map;
function withMap(inner) {
  if (!mapOpen()) return inner;
  const practice = S.mode === "practice";
  const cells = S.ids.map((n, i) => {
    const a = S.answers[n];
    const st = !a ? "" : practice ? (a === BY[n].a ? "r" : "w") : "ans";
    const lab = `Question ${i + 1}: ${!a ? "not answered" : practice ? (a === BY[n].a ? "correct" : "incorrect") : "answered"}${S.flags[n] ? ", marked" : ""}`;
    return `<button class="mcell ${st} ${i === S.idx ? "cur" : ""} ${S.flags[n] ? "fl" : ""}" data-i="${i}" aria-label="${lab}" ${i === S.idx ? 'aria-current="true"' : ""}>${i + 1}</button>`;
  }).join("");
  const answered = Object.keys(S.answers).length, marked = S.ids.filter(n => S.flags[n]).length;
  return `<div class="xlayout">${inner}
    <aside class="qmap" id="qmap" aria-label="Question map">
      <div class="qmap-head"><h3>Question map</h3><button class="qmap-close" id="mapclose" aria-label="Close question map">Close</button></div>
      <p class="qmap-sum">${answered} answered, ${S.ids.length - answered} left, ${marked} marked</p>
      <div class="mgrid">${cells}</div>
      <div class="mlegend">
        ${practice ? `<span><i class="mk r"></i>Correct</span><span><i class="mk w"></i>Incorrect</span>` : `<span><i class="mk ans"></i>Answered</span>`}
        <span><i class="mk"></i>Not answered</span><span><i class="mk fl"></i>Marked</span><span><i class="mk cur"></i>Current</span>
      </div>
    </aside></div>`;
}
function bindMap() {
  const tg = document.getElementById("maptoggle");
  if (tg) tg.onclick = () => { S.map = !mapOpen(); save(); quiz(); };
  const cl = document.getElementById("mapclose");
  if (cl) cl.onclick = () => { S.map = false; save(); quiz(); };
  app.querySelectorAll(".mcell").forEach(b => b.onclick = () => { S.idx = +b.dataset.i; if (innerWidth < 1200) S.map = false; save(); quiz(); window.scrollTo(0, 0); });
}

function startTimer() {
  clearInterval(timerId);
  if (!S.limit) return;
  const t = document.getElementById("timer");
  const tick = () => { const r = remaining(); if (t) { t.textContent = fmt(r); t.classList.toggle("low", r < 300); } if (r <= 0) endExam(); };
  tick(); timerId = setInterval(tick, 1000);
}

function quiz() {
  document.body.classList.add("testing");
  if (S.reviewing) return reviewScreen();
  const id = S.ids[S.idx], d = BY[id], pick = S.answers[id];
  const practice = S.mode === "practice", locked = practice && !!pick;
  const order = orderOf(id);
  const choices = order.map((k, i) => {
    let c = "";
    if (locked) c = k === d.a ? "right" : (k === pick ? "wrong" : "");
    return `<label class="choice ${c}"><input type="radio" name="ch" value="${k}" ${k === pick ? "checked" : ""} ${locked ? "disabled" : ""}><span class="cl">${L[i]}.</span><span>${esc(d.o[k])}</span></label>`;
  }).join("");
  let fb = "";
  if (locked) {
    const ok = pick === d.a;
    fb = `<div class="feedback ${ok ? "ok" : "no"}"><strong>${ok ? "Correct." : "Incorrect. Answer: " + L[order.indexOf(d.a)]}</strong>${d.note ? `${pill(d)}<p class="note">${esc(d.note)}</p>` : ""}</div>`;
  }
  const inner = `
    <div class="xq">
      <div class="xqhead" aria-label="Question ${S.idx + 1} of ${S.ids.length}"><span class="qnum">${S.idx + 1}</span><span class="qof">of ${S.ids.length}</span>${S.flags[id] ? `<span class="xmarked">Marked</span>` : ""}</div>
      <p class="qtext">${esc(d.q)}</p>
      <p class="instr">Choose 1 answer.</p>
      <div class="choices" role="radiogroup" aria-label="Answers">${choices}</div>
      ${fb}
    </div>`;
  const foot = `
    <label class="markbox"><input type="checkbox" id="mark" ${S.flags[id] ? "checked" : ""}> Mark for review</label>
    <div class="xbtns">
      <button class="xbtn" id="prev" ${S.idx === 0 ? "disabled" : ""}>Previous</button>
      <button class="xbtn" id="next">${S.idx === S.ids.length - 1 ? "Review answers" : "Next"}</button>
      <button class="xbtn" id="rev">Review all</button>
    </div>`;
  app.innerHTML = examShell(withMap(addFoot(inner, foot)));
  bindMap();
  app.querySelectorAll('.choice input').forEach(r => r.addEventListener("change", () => { S.answers[id] = r.value; save(); if (practice) quiz(); }));
  document.getElementById("prev").onclick = () => { S.idx--; save(); quiz(); };
  document.getElementById("next").onclick = () => { if (S.idx < S.ids.length - 1) S.idx++; else S.reviewing = true; save(); quiz(); window.scrollTo(0, 0); };
  document.getElementById("rev").onclick = () => { S.reviewing = true; save(); quiz(); };
  document.getElementById("mark").onchange = e => { S.flags[id] = e.target.checked; save(); quiz(); };
  startTimer();
}

function reviewScreen(filter) {
  filter = filter || S.reviewFilter || "all";
  S.reviewFilter = filter;
  const practice = S.mode === "practice";
  const unanswered = S.ids.filter(n => !S.answers[n]).length, marked = S.ids.filter(n => S.flags[n]).length;
  const rows = S.ids.map((n, i) => ({ n, i })).filter(({ n }) => filter === "all" || (filter === "marked" ? S.flags[n] : !S.answers[n]));
  const inner = `
    <div class="xq review">
      <div class="xqhead"><h2>Review your answers</h2></div>
      <p class="instr">${unanswered} unanswered, ${marked} marked for review. Select a question to go back to it.</p>
      <div class="xfilters" role="tablist">
        <button class="xbtn ${filter === "all" ? "on" : ""}" data-f="all">All (${S.ids.length})</button>
        <button class="xbtn ${filter === "marked" ? "on" : ""}" data-f="marked">Marked (${marked})</button>
        <button class="xbtn ${filter === "incomplete" ? "on" : ""}" data-f="incomplete">Incomplete (${unanswered})</button>
      </div>
      <div class="xgrid">${rows.length ? rows.map(({ n, i }) => {
        const a = S.answers[n];
        const st = !a ? "Incomplete" : practice ? (a === BY[n].a ? "Correct" : "Incorrect") : "Answered";
        const cls = !a ? "inc" : practice ? (a === BY[n].a ? "r" : "w") : "ans";
        return `<button class="xcell ${cls}" data-i="${i}"><b>${i + 1}</b><span>${st}</span>${S.flags[n] ? `<i>Marked</i>` : ""}</button>`;
      }).join("") : `<p class="empty">No questions in this list.</p>`}</div>
      <div id="endbox"></div>
    </div>`;
  const foot = `
    <span></span>
    <div class="xbtns">
      <button class="xbtn" id="back">Return to question ${S.idx + 1}</button>
      <button class="xbtn end" id="end">${practice ? "End practice" : "End exam"}</button>
    </div>`;
  app.innerHTML = examShell(addFoot(inner, foot));
  app.querySelectorAll(".xfilters button").forEach(b => b.onclick = () => { reviewScreen(b.dataset.f); save(); });
  app.querySelectorAll(".xcell").forEach(b => b.onclick = () => { S.idx = +b.dataset.i; S.reviewing = false; save(); quiz(); window.scrollTo(0, 0); });
  document.getElementById("back").onclick = () => { S.reviewing = false; save(); quiz(); };
  document.getElementById("end").onclick = () => {
    document.getElementById("endbox").innerHTML = `<div class="xconfirm"><p><strong>End the ${practice ? "practice set" : "exam"}?</strong> ${unanswered ? `${unanswered} question${unanswered > 1 ? "s are" : " is"} unanswered and will be scored as wrong. ` : ""}You can't change answers after this.</p><div class="xbtns"><button class="xbtn" id="cancelEnd">Cancel</button><button class="xbtn end" id="confirmEnd">${practice ? "End practice" : "End exam"}</button></div></div>`;
    document.getElementById("cancelEnd").onclick = () => { document.getElementById("endbox").innerHTML = ""; };
    document.getElementById("confirmEnd").onclick = endExam;
    document.getElementById("endbox").scrollIntoView({ block: "center" });
  };
  startTimer();
}

function endExam() { clearInterval(timerId); S.done = true; S.reviewing = false; S.ended = Date.now(); logAttempt(); save(); go("results"); }

/* ---------- results ---------- */
function results() {
  const past = !!viewAttempt, R = viewAttempt || S;
  viewAttempt = null;
  const K = n => (R.key && R.key[n]) || BY[n].a;
  const ord = n => (R.oo && R.oo[n]) || Object.keys(BY[n].o);
  const right = R.ids.filter(n => R.answers[n] === K(n)).length;
  const unans = R.ids.filter(n => !R.answers[n]).length;
  const pct = Math.round(right / R.ids.length * 100);
  const pass = pct >= PASS;
  const C = 2 * Math.PI * 64;
  app.innerHTML = `
  ${past ? `<button class="btn small" id="toHist" style="margin-bottom:20px">Back to history</button>` : ""}
  <div class="score">
    <div class="bigscore" aria-label="${right} of ${R.ids.length} correct">${right}<small>/${R.ids.length}</small></div>
    <div>
      <h1>${pass ? "Pass" : "Not a pass yet"}</h1>
      <p class="verdict"><b class="${pass ? "pass" : "fail"}">${pct}% correct</b>, pass mark ${PASS}%${past ? `. ${R.mode === "exam" ? "Exam" : "Practice"} taken ${when(R.ended)}` : ""}</p>
      <div class="stats">
        <div><b>${R.ids.length - right - unans}</b>wrong</div>
        <div><b>${unans}</b>unanswered</div>
        <div><b>${fmt(((R.ended || Date.now()) - R.started) / 1000)}</b>time taken</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
        <button class="btn primary" id="again">Start a new exam</button>
        <button class="btn" id="retry" ${right === R.ids.length ? "disabled" : ""}>Practise the ones I missed</button>
        ${past ? "" : `<button class="btn" id="seeHist">See history</button>`}
      </div>
    </div>
  </div>`;
  document.getElementById("again").onclick = () => { if (!past) { S = null; try { localStorage.removeItem(LS); } catch (e) {} } go("setup"); };
  document.getElementById("retry").onclick = () => {
    const ids = R.ids.filter(n => BY[n] && R.answers[n] !== K(n));
    S = newSession("practice", shuffle(ids), 0); save(); go("quiz");
  };
  const th = document.getElementById("toHist"); if (th) th.onclick = () => go("history");
  const sh = document.getElementById("seeHist"); if (sh) sh.onclick = () => go("history");
}

function card(d, pick, order, editable) {
  const ord = order || Object.keys(d.o), lab = k => order ? L[ord.indexOf(k)] : k;
  const li = ord.map(k => editable
    ? `<li class="${k === d.a ? "right" : ""}"><button class="setans" data-n="${d.n}" data-k="${k}" aria-pressed="${k === d.a}" title="Set ${k} as the answer"><b>${lab(k)}</b><span>${esc(d.o[k])}</span></button></li>`
    : `<li class="${k === d.a ? "right" : (k === pick ? "wrong" : "")}"><b>${lab(k)}</b><span>${esc(d.o[k])}</span></li>`).join("");
  return `<article class="item">
    <div class="meta"><span class="label">Question ${d.n}</span>${pill(d)}${pick !== undefined ? `<span class="label">${pick ? "You chose " + lab(pick) : "Not answered"}. Answer ${lab(d.a)}</span>` : `<span class="label">Answer ${d.a}</span>`}</div>
    <p class="q">${esc(d.q)}</p><ol>${li}</ol>
    ${d.note ? `<p class="note">${esc(d.note)}${d.status === "corrected" && !order ? " Was " + d.orig + "." : ""}</p>` : ""}
  </article>`;
}

/* ---------- history ---------- */
const HK = "afx-history-v2";
let viewAttempt = null;
const loadHist = () => { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch (e) { return []; } };
const saveHist = h => { try { localStorage.setItem(HK, JSON.stringify(h)); } catch (e) {} };
function logAttempt() {
  if (S.logged) return;
  const key = Object.fromEntries(S.ids.map(n => [n, BY[n].a]));
  const right = S.ids.filter(n => S.answers[n] === key[n]).length;
  const h = loadHist();
  h.push({ id: Date.now(), mode: S.mode, started: S.started, ended: S.ended, ids: S.ids, answers: S.answers, flags: S.flags, oo: S.oo, key, right, total: S.ids.length });
  saveHist(h); S.logged = true;
}
const pctOf = a => Math.round(a.right / a.total * 100);
const when = t => new Date(t).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function trendChart(h) {
  const W = 640, H = 210, l = 40, r = 16, t = 14, b = 30, iw = W - l - r, ih = H - t - b;
  const x = i => h.length === 1 ? l + iw / 2 : l + i * iw / (h.length - 1);
  const y = p => t + ih - p / 100 * ih;
  const pts = h.map((a, i) => [x(i), y(pctOf(a))]);
  const step = Math.max(1, Math.ceil(h.length / 12));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score per attempt">
    ${[0, 25, 50, 75, 100].map(p => `<line x1="${l}" x2="${W - r}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)" stroke-width="1"/><text x="${l - 8}" y="${y(p) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${p}%</text>`).join("")}
    <line x1="${l}" x2="${W - r}" y1="${y(PASS)}" y2="${y(PASS)}" stroke="var(--flag)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W - r}" y="${y(PASS) - 6}" text-anchor="end" font-size="11" fill="var(--flag)">Pass ${PASS}%</text>
    ${pts.length > 1 ? `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--form)" stroke-width="2.5" stroke-linejoin="round"/>` : ""}
    ${pts.map(([px, py], i) => `<circle cx="${px}" cy="${py}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="${pctOf(h[i]) >= PASS ? "var(--form)" : "var(--pen)"}" stroke="var(--sheet)" stroke-width="1.5"><title>Attempt ${i + 1}: ${pctOf(h[i])}%</title></circle>`).join("")}
    ${h.map((a, i) => i % step === 0 || i === h.length - 1 ? `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${i + 1}</text>` : "").join("")}
  </svg>`;
}

function history() {
  const h = loadHist();
  if (!h.length) {
    app.innerHTML = `<h1>Attempt history</h1>
      <p class="lede">No attempts yet. Finish an exam or practice set and your score, weak topics and most-missed questions show up here.</p>
      <div style="margin-top:24px"><button class="btn primary" id="hstart">Start an exam</button></div>`;
    document.getElementById("hstart").onclick = () => go("setup");
    return;
  }
  const ps = h.map(pctOf), last = ps[ps.length - 1], prev = ps[ps.length - 2];
  const avg = Math.round(ps.reduce((s, p) => s + p, 0) / ps.length);
  const passes = ps.filter(p => p >= PASS).length;
  // topic and question stats
  const topic = {}, q = {};
  h.forEach(a => a.ids.forEach(n => {
    const ok = a.answers[n] === a.key[n], tp = (BY[n] && BY[n].t) || "General";
    (topic[tp] = topic[tp] || { seen: 0, right: 0 }).seen++; if (ok) topic[tp].right++;
    (q[n] = q[n] || { seen: 0, miss: 0 }).seen++; if (!ok) q[n].miss++;
  }));
  const topics = Object.entries(topic).map(([k, v]) => ({ k, ...v, p: Math.round(v.right / v.seen * 100) })).sort((a, b) => a.p - b.p);
  const missed = Object.entries(q).filter(([n, v]) => v.miss && BY[n]).map(([n, v]) => ({ n: +n, ...v })).sort((a, b) => b.miss - a.miss || b.miss / b.seen - a.miss / a.seen).slice(0, 12);
  app.innerHTML = `
  <h1>Attempt history</h1>
  <p class="hsum"><b>${h.length}</b> attempt${h.length > 1 ? "s" : ""}, <b>${passes}</b> passed. Last score <b>${last}%</b>${prev !== undefined ? ` (${last - prev >= 0 ? "up" : "down"} ${Math.abs(last - prev)} from the one before)` : ""}, best <b>${Math.max(...ps)}%</b>, average <b>${avg}%</b>.</p>
  <section class="hsec"><h2>Score per attempt</h2><div class="chartbox">${trendChart(h)}</div></section>
  <div class="hgrid">
    <section class="hsec"><h2>Accuracy by topic</h2>
      <div class="topics">${topics.map(t => `<div class="trow"><span class="tname">${esc(t.k)}</span><span class="tbar"><i style="width:${t.p}%" class="${t.p >= PASS ? "ok" : "no"}"></i></span><span class="tval">${t.p}%</span><span class="tn">${t.right}/${t.seen}</span></div>`).join("")}</div>
      <p class="note">Bars below ${PASS}% are below the pass mark.</p>
    </section>
    <section class="hsec"><h2>Most missed questions</h2>
      ${missed.length ? `<ol class="missed">${missed.map(m => `<li><span class="mq">${esc(BY[m.n].q.length > 130 ? BY[m.n].q.slice(0, 130) + "…" : BY[m.n].q)}</span><span class="mm">Missed ${m.miss} of ${m.seen}</span></li>`).join("")}</ol>
      <button class="btn primary" id="hpractice">Practise these ${missed.length}</button>` : `<p class="empty">You haven't missed any question yet.</p>`}
    </section>
  </div>
  <section class="hsec"><h2>All attempts</h2>
    <div class="tablebox"><table class="htable">
      <thead><tr><th>#</th><th>Date</th><th>Mode</th><th>Score</th><th>Result</th><th>Time</th><th></th></tr></thead>
      <tbody>${h.map((a, i) => ({ a, i })).reverse().map(({ a, i }) => `<tr>
        <td>${i + 1}</td><td>${when(a.ended)}</td><td>${a.mode === "exam" ? "Exam" : "Practice"}</td>
        <td>${a.right}/${a.total} (${pctOf(a)}%)</td>
        <td><span class="res ${pctOf(a) >= PASS ? "ok" : "no"}">${pctOf(a) >= PASS ? "Pass" : "Fail"}</span></td>
        <td>${fmt((a.ended - a.started) / 1000)}</td>
        <td><button class="btn small" data-a="${i}">Review</button></td></tr>`).join("")}</tbody>
    </table></div>
    <button class="btn" id="hclear" style="margin-top:16px">Clear history</button>
  </section>`;
  app.querySelectorAll(".htable button[data-a]").forEach(b => b.onclick = () => { viewAttempt = h[+b.dataset.a]; go("results"); });
  const hp = document.getElementById("hpractice");
  if (hp) hp.onclick = () => { S = newSession("practice", shuffle(missed.map(m => m.n)), 0); save(); go("quiz"); };
  const hc = document.getElementById("hclear");
  hc.onclick = () => {
    if (!hc.dataset.armed) { hc.dataset.armed = 1; hc.textContent = "Click again to delete all attempts"; return; }
    try { localStorage.removeItem(HK); } catch (e) {} history();
  };
}

/* ---------- answer key ---------- */
function key() {
  app.innerHTML = `
    <h1>All ${DATA.length} questions</h1>
  <p class="lede">Click an option to make it the answer. Your choice is used for scoring in this browser.</p>
  <div class="toolbar">
    <input type="search" id="ks" placeholder="Search words or a question number" aria-label="Search">
    <select id="kf" aria-label="Filter"><option value="all">All</option><option value="corrected">Key corrected (${NCOR})</option><option value="disputed">Disputed (${NDIS})</option><option value="user">Set by you (<span id="nu">${Object.keys(OV).length}</span>)</option></select>
    <button class="btn" id="kreset" ${Object.keys(OV).length ? "" : "hidden"}>Reset all to default</button>
  </div>
  <div class="list" id="kl"></div><div class="more"><button class="btn" id="km">Show more</button></div>`;
  keyLimit = 40;
  const draw = () => {
    const s = document.getElementById("ks").value.trim().toLowerCase(), f = document.getElementById("kf").value;
    const rows = DATA.filter(d => (f === "all" || (f === "user" ? d.user : d.status === f)) && (!s || String(d.n) === s.replace("#", "") || (d.q + " " + Object.values(d.o).join(" ")).toLowerCase().includes(s)));
    document.getElementById("kl").innerHTML = rows.length ? rows.slice(0, keyLimit).map(d => card(d, undefined, null, true)).join("") : `<p class="empty">No question matches "${esc(s)}".</p>`;
    document.getElementById("km").hidden = rows.length <= keyLimit;
    const nu = Object.keys(OV).length;
    document.querySelector('#kf option[value="user"]').textContent = `Set by you (${nu})`;
    document.getElementById("kreset").hidden = !nu;
  };
  document.getElementById("kl").addEventListener("click", e => {
    const b = e.target.closest(".setans"); if (!b) return;
    setAnswer(+b.dataset.n, b.dataset.k); draw();
  });
  const rs = document.getElementById("kreset");
  rs.onclick = () => {
    if (!rs.dataset.armed) { rs.dataset.armed = 1; rs.textContent = "Click again to reset all"; return; }
    OV = {}; try { localStorage.removeItem(LSK); } catch (e) {} applyOv(); delete rs.dataset.armed; rs.textContent = "Reset all to default"; draw();
  };
  document.getElementById("ks").oninput = () => { keyLimit = 40; draw(); };
  document.getElementById("kf").onchange = () => { keyLimit = 40; draw(); };
  document.getElementById("km").onclick = () => { keyLimit += 40; draw(); };
  draw();
}

/* keyboard shortcuts on the exam screen */
document.addEventListener("keydown", e => {
  if (view !== "quiz" || !S || S.reviewing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches && e.target.matches("input[type=search],select,textarea")) return;
  const k = e.key.toLowerCase();
  const i = "abcd".indexOf(k);
  if (i >= 0) { const r = document.querySelectorAll(".choice input")[i]; if (r && !r.disabled) { r.checked = true; r.dispatchEvent(new Event("change")); if (S.mode !== "practice") quiz(); } e.preventDefault(); }
  else if (e.key === "ArrowRight") { document.getElementById("next")?.click(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { const p = document.getElementById("prev"); if (p && !p.disabled) p.click(); e.preventDefault(); }
  else if (k === "m") { document.getElementById("mark")?.click(); e.preventDefault(); }
});

/* boot */
(function () {
  const prev = load();
  if (prev && prev.done) { S = prev; go("results"); } else go("setup");
})();
</script>
