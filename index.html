<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agentforce Specialist Practice Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Exam booklet with a proctor's clock. Literata for reading, Albert Sans for controls.
   Colour = state only. Left aligned, no cards. */
:root{
  --paper:#ffffff; --desk:#f2f3f6; --ink:#1b1d22; --pencil:#5c6270; --rule:#dfe2e8; --rule-strong:#b8bec9;
  --bb:#22396b; --bb-deep:#182a52; --bb-soft:#e9edf6;
  --right:#2e6b40; --right-soft:#e8f2eb; --wrong:#a8352c; --wrong-soft:#f8e9e7; --marked:#a86d12;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Albert Sans","Segoe UI",system-ui,sans-serif;
  --r:6px;
  color-scheme:light;
  /* aliases used by scripted SVG and older markup */
  --line:var(--rule); --muted:var(--pencil); --form:var(--bb); --form-deep:var(--bb-deep); --pen:var(--wrong); --pen-soft:var(--wrong-soft); --flag:var(--marked); --sheet:var(--paper); --tint:var(--desk); --ok:var(--right); --good-soft:var(--right-soft); --on-form:#fff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bb);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-read);font-weight:600;letter-spacing:-.01em}
h1{font-size:44px;line-height:1.1}
h2{font-size:28px;line-height:1.2}
h3{font-size:20px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.lede{font-size:18px;color:var(--pencil);max-width:56ch;margin:16px 0 0}
.label{font-size:14px;color:var(--pencil)}
.note{margin:8px 0 0;font-size:14px;color:var(--pencil)}
.empty{color:var(--pencil);padding:24px 0}
.mono{font-variant-numeric:tabular-nums}

/* site header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{margin-right:auto;font-weight:600;display:flex;gap:10px;align-items:baseline}
.brand small{font-size:14px;color:var(--pencil);font-weight:400}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:none;padding:6px 12px;border-radius:var(--r);color:var(--pencil);font-weight:500}
nav.tabs button:hover{background:var(--desk);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--desk);color:var(--ink);font-weight:600}
main{padding-block:48px 80px}

/* buttons */
.btn,.xbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:var(--r);font-weight:600;font-size:15px;line-height:1.2;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled),.xbtn:hover:not(:disabled){background:var(--desk);border-color:var(--pencil)}
.btn:active:not(:disabled),.xbtn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled,.xbtn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary,.xbtn#next,.xbtn.end,.xbtn.on{background:var(--bb);border-color:var(--bb);color:#fff}
.btn.primary:hover:not(:disabled),.xbtn#next:hover,.xbtn.end:hover,.xbtn.on:hover{background:var(--bb-deep);border-color:var(--bb-deep)}
.btn.small{padding:6px 12px;font-size:14px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:64px;align-items:start}
.setup h1{font-size:56px;line-height:1.05}
.panel{display:grid;gap:28px;padding-left:40px;border-left:1px solid var(--rule)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{padding:0;margin-bottom:10px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:10px 8px;border:1px solid var(--rule-strong);border-radius:var(--r);font-weight:500;transition:background .12s,border-color .12s}
.seg label:hover span{background:var(--desk)}
.seg input:checked + span{background:var(--bb);border-color:var(--bb);color:#fff;font-weight:600}
.seg input:focus-visible + span{outline:2px solid var(--bb);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center}
.check input{width:18px;height:18px;accent-color:var(--bb)}
.resume{margin-top:32px;padding:14px 18px;background:var(--desk);border-radius:var(--r);display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* exam screen */
body.testing header.top{display:none}
body.testing main{padding:0;max-width:none}
.exam{background:var(--paper)}
.xbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.xbar-in,.xbody{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.xbar-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px}
.xtitle{font-weight:600;margin-right:auto}
.xprog{color:var(--pencil);font-variant-numeric:tabular-nums}
.xtime{display:inline-flex;align-items:baseline;gap:8px;color:var(--pencil);font-size:14px}
.xtime b{font-family:var(--f-read);font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.xtime b.low{color:var(--wrong)}
.xbar .xmapbtn{border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:14px}
.xbar .xmapbtn:hover{background:var(--desk)}
.xbar .xmapbtn[aria-expanded="true"]{background:var(--desk);border-color:var(--bb)}
.xbody{padding-block:24px 56px}
.xlayout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:56px;align-items:start}

/* the booklet item: big number in the margin */
.xq{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:24px;max-width:860px}
.xq > *{grid-column:2}
.xqhead{grid-column:1;grid-row:1 / span 6;display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:2px}
.qnum{font-family:var(--f-read);font-size:64px;line-height:.9;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.qof{font-size:14px;color:var(--pencil);white-space:nowrap}
.xmarked{font-size:13px;font-weight:600;color:var(--marked);text-align:right}
.qtext{font-family:var(--f-read);font-size:20px;line-height:1.6;max-width:64ch;margin:0 0 20px;white-space:pre-line}
.instr{font-size:14px;color:var(--pencil);margin:0 0 10px}
.choices{display:grid;gap:4px}
.choice{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:start;padding:12px 14px;border-radius:var(--r);cursor:pointer;font-size:17px;line-height:1.5;transition:background .12s}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .cl{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:5px;font-weight:600;font-size:14px;color:var(--pencil);background:var(--paper);margin-top:-2px}
.choice:hover{background:var(--desk)}
.choice:has(input:checked){background:var(--bb-soft)}
.choice:has(input:checked) .cl{background:var(--bb);border-color:var(--bb);color:#fff}
.choice:has(input:focus-visible){outline:2px solid var(--bb);outline-offset:1px}
.choice.right{background:var(--right-soft)}
.choice.right .cl{background:var(--right);border-color:var(--right);color:#fff}
.choice.wrong{background:var(--wrong-soft)}
.choice.wrong .cl{background:var(--wrong);border-color:var(--wrong);color:#fff}
.choice:has(input:disabled){cursor:default}
.feedback{margin-top:16px;padding:12px 16px;border-left:3px solid var(--right);background:var(--right-soft)}
.feedback.no{border-left-color:var(--wrong);background:var(--wrong-soft)}
.feedback strong{display:block}
.pill{font-size:13px;font-weight:600;margin-right:8px}
.pill.corrected{color:var(--wrong)} .pill.disputed{color:var(--marked)} .pill.user{color:var(--bb)}
.xfoot-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px}
.xbtns{display:flex;gap:8px;flex-wrap:wrap}
.markbox{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule-strong);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:15px;cursor:pointer}
.markbox:hover{background:var(--desk)}
.markbox input{width:16px;height:16px;accent-color:var(--marked)}
.markbox:has(input:checked){border-color:var(--marked);color:var(--marked)}
.keys{grid-column:2;margin-top:18px;font-size:13px;color:var(--pencil)}
.keys kbd{font:600 12px var(--f-ui);border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}

/* question map */
.qmap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
.qmap-head{display:flex;align-items:baseline;justify-content:space-between}
.qmap-close{background:none;border:0;color:var(--bb);font-weight:600;font-size:14px;padding:4px 0}
.qmap-sum{font-size:14px;color:var(--pencil);margin:4px 0 14px}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;overflow:auto;padding:3px}
.mcell{aspect-ratio:1;border:1px solid var(--rule-strong);background:var(--paper);border-radius:5px;font-size:13px;font-weight:600;padding:0;position:relative;font-variant-numeric:tabular-nums}
.mcell:hover{background:var(--desk)}
.mcell.ans{background:var(--bb);border-color:var(--bb);color:#fff}
.mcell.r{background:var(--right);border-color:var(--right);color:#fff}
.mcell.w{background:var(--wrong);border-color:var(--wrong);color:#fff}
.mcell.cur{outline:2px solid var(--ink);outline-offset:2px}
.mcell.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--marked);border:2px solid var(--paper)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--pencil);margin-top:14px}
.mk{display:inline-block;width:12px;height:12px;border:1px solid var(--rule-strong);border-radius:3px;margin-right:6px;vertical-align:-2px;background:var(--paper)}
.mk.ans{background:var(--bb);border-color:var(--bb)} .mk.r{background:var(--right);border-color:var(--right)} .mk.w{background:var(--wrong);border-color:var(--wrong)}
.mk.fl{background:var(--marked);border-color:var(--marked);border-radius:50%} .mk.cur{outline:2px solid var(--ink);outline-offset:1px}

/* review screen */
.xq.review{display:block;max-width:860px}
.xq.review .xqhead{display:block}
.xfilters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.xcell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);font-size:13px;color:var(--pencil)}
.xcell:hover{background:var(--desk)}
.xcell b{font-family:var(--f-read);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.xcell i{font-style:normal;font-weight:600;color:var(--marked)}
.xcell.inc{border-style:dashed;border-color:var(--rule-strong)}
.xcell.ans{background:var(--bb-soft)}
.xcell.r{background:var(--right-soft)}
.xcell.w{background:var(--wrong-soft)}
.xconfirm{margin-top:28px;padding:16px 18px;border-left:3px solid var(--wrong);background:var(--wrong-soft);display:grid;gap:12px}
.xconfirm p{margin:0}

/* results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 48px;align-items:end;padding-bottom:32px;border-bottom:1px solid var(--rule)}
.bigscore{font-family:var(--f-read);font-size:96px;line-height:.9;font-weight:500;font-variant-numeric:tabular-nums}
.bigscore small{font-size:40px;color:var(--pencil);font-weight:400}
.verdict{font-size:18px;margin:10px 0 0}
.verdict b.pass{color:var(--right)} .verdict b.fail{color:var(--wrong)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px;color:var(--pencil)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:32px 0 8px}
.toolbar input[type=search]{flex:1 1 260px;min-width:0;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper)}
.toolbar select{padding:10px 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper)}

/* question lists (review, answer key) */
.list{display:grid}
.item{padding:24px 0;border-top:1px solid var(--rule);max-width:860px}
.item:first-child{border-top:0}
.item .meta{display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px;font-size:14px;color:var(--pencil)}
.item .meta .label:first-child{font-family:var(--f-read);font-size:18px;font-weight:600;color:var(--ink)}
.item p.q{font-family:var(--f-read);font-size:18px;line-height:1.6;margin:0 0 12px;max-width:66ch;white-space:pre-line}
.item ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.item li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:var(--r)}
.item li b{font-weight:600;color:var(--pencil)}
.item li.right{background:var(--right-soft)}
.item li.right b{color:var(--right)}
.item li.wrong{background:var(--wrong-soft)}
.item li.wrong b{color:var(--wrong)}
.item li:has(.setans){display:block;padding:0}
.setans{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:var(--r);font-size:16px;line-height:1.5}
.setans:hover{background:var(--desk)}
.setans b{font-weight:600;color:var(--pencil)}
.item li.right .setans b{color:var(--right)}
.item li.right .setans:hover{background:var(--right-soft)}
.more{display:flex;margin-top:16px}

/* history */
.hsum{font-size:18px;max-width:60ch;margin:14px 0 0;color:var(--pencil)}
.hsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.hsec{margin-top:48px}
.hsec h2{font-size:24px;margin-bottom:16px}
.chartbox{overflow-x:auto}
.chart{display:block;width:100%;min-width:420px;height:auto}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 56px}
.topics{display:grid;gap:12px}
.trow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 44px 52px;gap:12px;align-items:center}
.tbar{height:8px;background:var(--desk);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:4px}
.tbar i.ok{background:var(--right)} .tbar i.no{background:var(--wrong)}
.tval{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tn{font-size:13px;color:var(--pencil);font-variant-numeric:tabular-nums}
.missed{margin:0 0 18px;padding-left:22px;display:grid;gap:12px}
.mq{display:block;font-family:var(--f-read)}
.mm{font-size:13px;font-weight:600;color:var(--wrong)}
.tablebox{overflow-x:auto}
.htable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.htable th{text-align:left;font-size:14px;color:var(--pencil);font-weight:500;padding:10px 16px 10px 0;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
.htable td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.res{font-weight:600} .res.ok{color:var(--right)} .res.no{color:var(--wrong)}

@media (max-width:999px){
  .xlayout{display:block}
  .qmap{position:fixed;inset:auto 0 0 0;top:auto;z-index:20;background:var(--paper);border-top:1px solid var(--rule);box-shadow:0 -10px 30px rgba(27,29,34,.16);max-height:70vh;padding:16px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .mgrid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  .setup,.hgrid{grid-template-columns:minmax(0,1fr)}
  .panel{padding-left:0;border-left:0;padding-top:32px;border-top:1px solid var(--rule)}
}
@media (max-width:640px){
  h1,.setup h1{font-size:36px}
  main{padding-block:28px 56px}
  .xq{grid-template-columns:minmax(0,1fr)}
  .xq > *{grid-column:1}
  .xqhead{grid-row:auto;flex-direction:row;align-items:baseline;gap:10px;margin-bottom:12px}
  .qnum{font-size:44px}
  .qtext{font-size:18px}
  .choice{font-size:16px;padding:10px 8px}
  .xfoot-in{flex-direction:column;align-items:stretch}
  .xbtns .xbtn{flex:1 1 0;padding-inline:8px}
  .markbox{justify-content:center}
  .keys{display:none}
  .score{grid-template-columns:minmax(0,1fr)}
  .bigscore{font-size:72px}
  .trow{grid-template-columns:minmax(0,1fr) 44px 52px}
  .trow .tbar{grid-column:1/-1;grid-row:2}
  .brand small{display:none}
}
/* question map: fixed panel on the right edge, always in the same place */
.xlayout{display:block}
.qmap{position:fixed;top:0;right:0;bottom:0;left:auto;width:340px;max-width:100vw;max-height:none;margin:0;z-index:20;background:var(--paper);border-left:1px solid var(--rule);border-top:0;box-shadow:none;display:flex;flex-direction:column;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.mgrid{grid-template-columns:repeat(6,minmax(0,1fr));max-height:none;flex:1;overflow:auto;align-content:start}
.mcell{aspect-ratio:auto;height:40px}
@media (min-width:1200px){.exam:has(.qmap){padding-right:340px}}
@media (max-width:1199px){.qmap{box-shadow:-12px 0 32px rgba(27,29,34,.16)}}
@media (max-width:640px){.qmap{top:auto;width:100%;height:70vh;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -10px 30px rgba(27,29,34,.16)}.mgrid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}}
/* buttons always sit at the bottom of the screen, whatever the question length */
.exam{min-height:100vh;display:flex;flex-direction:column}
.xbody{flex:1;display:flex;flex-direction:column;width:100%}
.xlayout{flex:1;display:flex;flex-direction:column}
.xq{flex:1;display:flex;flex-direction:column;position:relative;padding-left:120px;max-width:980px;width:100%}
.xqhead{position:absolute;left:0;top:0;width:96px}
.xq .xfoot-in{margin-top:auto;padding-top:32px}
.xq.review{display:flex;padding-left:0;max-width:980px}
.xq.review .xqhead{position:static;width:auto}
@media (max-width:640px){.xq{padding-left:0}.xqhead{position:static;width:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.stats b{margin-right:4px}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Agentforce Specialist <small>199 questions</small></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-exam" aria-selected="true" data-view="setup">Exam</button>
    <button role="tab" id="tab-hist" aria-selected="false" data-view="history">History</button>
    <button role="tab" id="tab-key" aria-selected="false" data-view="key">Answer key</button>
  </nav>
</div></header>

<main class="wrap" id="app"></main>

<script>
const DATA = [{"n":1,"q":"Universal Containers wants its AI agent to answer customer questions with precise and up-to-date information. How does an Agentforce Data Library simplify and enable this?","o":{"A":"It automates the ingestion and optical character recognition (OCR) processing of any PDF, and indexes them to enable regular SQL query retrieval to ground prompts and agents with relevant information.","B":"It automates the ingestion, indexing of data, and creates a default retriever to be used in prompts and agents for grounding with relevant information.","C":"It automates the ingestion, taxonomical classification and storage of knowledge in Data Cloud for precision keyword search retrieval to ground prompts and agents with relevant information."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":2,"q":"How is Data Cloud leveraged by the Answer Questions with Knowledge action in Agentforce?","o":{"A":"Data Cloud provides the real-time data streams that update the Knowledge articles.","B":"Data Cloud stores and manages the indexed Knowledge articles.","C":"Data Cloud is not required; the articles can be accessed directly from the CRM by the agent."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":3,"q":"Universal Containers (UC) wants to enable its sales team with automatic post-call visibility into mention of competitors, product and other custom phrases. Which feature should the company use to enable the sales team?","o":{"A":"Call Summaries","B":"Call Insights","C":"Call Explorer"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent types & channels"},{"n":4,"q":"Universal Containers (UC) wants its AI agent to return responses quickly. UC needs to optimize the retriever's configuration to ensure minimal latency when grounding AI responses. Which configuration aspect should UC prioritize?","o":{"A":"Ensure the retriever's filters are defined to limit the scope of each search efficiently.","B":"Increase the recency bias setting for the retriever limiting scope to more recent data.","C":"Configure the retriever to operate in dynamic mode so that it modifies the search index structure at runtime."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":5,"q":"Universal Containers (UC) wants to ensure the effectiveness, reliability, and trust of its agents prior to deploying them in production. UC would like to efficiently test a large and repeatable number of utterances. What should the Agentforce Specialist recommend?","o":{"A":"Deploy the agent in a Q/A sandbox environment and review the Utterance Analysis reports to review effectiveness.","B":"Leverage the Agent Large Language Model (LLM) UI and test UC's agents with different utterances prior to activating the agent.","C":"Create a CSV file with UC's test cases in Agentforce Testing Center using the testing template."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":6,"q":"What is the primary function of the reasoning engine in Agentforce?","o":{"A":"Identifying agent topics and actions to respond to user utterances","B":"Generating record queries based on conversation history","C":"Offering real-time natural language response during conversations"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":7,"q":"When a customer chat is initiated, which functionality in Salesforce provides generative AI replies or draft emails based on recommended Knowledge articles?","o":{"A":"Einstein Grounding","B":"Einstein Reply Recommendations","C":"Einstein Service Replies"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":8,"q":"Leadership needs to populate a dynamic form field with a summary or description created by a large language model (LLM) to facilitate more productive conversations with customers. Leadership also wants to keep a human in the loop to be considered in their AI strategy. Which prompt template type should the Agentforce Specialist recommend?","o":{"A":"Field Generation","B":"Record Summary","C":"Sales Email"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":9,"q":"Universal Containers built a Field Generation prompt template that worked for many records, but users are reporting random failures with token limit errors. What is the cause of the random nature of this error?","o":{"A":"The template type needs to be switched to Flex to accommodate the variable amount of tokens generated by the prompt grounding.","B":"The number of tokens generated by the dynamic nature of the prompt template will vary by record.","C":"The number of tokens that can be processed by the LLM varies with total user demand."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":10,"q":"In the context of retriever and search indexes, what best describes the data preparation process in Data Cloud?","o":{"A":"Data preparation entails aggregating, normalizing, and encoding structured datasets to ensure compliance with data governance and security protocols.","B":"Data preparation involves loading, chunking, vectorizing, and storing content in a search-optimized manner to support retrieval from the vector database.","C":"Data preparation focuses on real-time data ingestion and dynamic indexing to generate dynamic grounding reference data without preprocessing steps."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":11,"q":"An AI Specialist at Universal Containers is trying to set up a new Field Generation prompt template. They take the following steps. 1. Create a new Field Generation prompt template. 2. Choose Case as the object type. 3. Select the custom field AI_Analysis_c as the target field. After creating the prompt template, the AI Specialist saves, tests, and activates it. Howsoever, when they go to a case record, the AI Analysis field does not show the (Sparkle) icon on the Edit pencil. When the AI Specialist was editing the field, it was behaving as a normal field. Which critical step did the AI Specialist miss?","o":{"A":"They forgot to reactivate the Lightning page layout for the Case object after activating their Field Generation prompt template.","B":"They forgot that the Case Object is not supported for Add generation as Feinstein Service Replies should be used instead.","C":"They forgot to edit the Lightning page layout and associate the field to a prompt template"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":12,"q":"A Universal Containers administrator is setting up Einstein Data Libraries. After creating a new library, the administrator notices that only the file upload option is available; there is no option to configure the library using a Salesforce Knowledge base. What is the most likely cause of this issue?","o":{"A":"Salesforce Knowledge is not enabled in the organization; without Salesforce Knowledge enabled, the Knowledge based data source option will not be available in Einstein Data Libraries.","B":"The current Salesforce org lacks the necessary Einstein for Service permissions that support the Knowledge-based Data Library option, so only the file upload option is presented.","C":"The administrator is not using Lightning Experience, which is required to display all data source options, including the Knowledge base option, when configuring Einstein Data Libraries."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":13,"q":"Universal Containers would like to route a service agent conversation to a human agent queue. Which tool connects the service agent to the human agent queue for escalation?","o":{"A":"Prompt Flow","B":"Outbound Omni-Channel Flow","C":"Screen Flow"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent types & channels"},{"n":14,"q":"An administrator wants to check the response of the Flex prompt template they've built, but the preview button is greyed out. What's the reason for this?","o":{"A":"The prompt has not been saved and activated.","B":"A merge field has not been inserted in the prompt.","C":"The records related to the prompt have not been selected."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":15,"q":"An Agentforce Service Agent, who has been successfully assisting customers with service requests in Salesforce, is now unable to help customers with issues related to a new product replacement process. The company recently implemented a custom Product Replacement object in Salesforce to track and manage these replacements. Which Agentforce Agent User change must be implemented to address this issue?","o":{"A":"The profile assigned to the Agentforce Agent User needs AI training permission to the custom Product Replacement object.","B":"The permission set group assigned to the Agent User needs to grant access to the Product Replacement flow.","C":"The permission set assigned to the Agent User needs Read access to the custom Product Replacement object."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":16,"q":"What is true of Agentforce Testing Center?","o":{"A":"Running tests risks modifying CRM data in a production environment.","B":"Running tests does not consume Einstein Requests.","C":"Agentforce Testing Center can only be used in a production environment."},"a":"A","orig":"B","status":"corrected","note":"Tests consume Einstein Requests and can modify CRM data.","t":"Testing & monitoring"},{"n":17,"q":"An Agentforce Specialist is tasked to optimize a business process flow by assigning actions to agents within the Salesforce Agentforce Platform. What is the correct method for the Agentforce Specialist to assign actions to an Agent?","o":{"A":"Assign the action to a Topic first on the Agent Actions detail page.","B":"Assign the action to a Topic first in Agent Builder.","C":"Assign the action to a Topic first on Action Builder."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":18,"q":"Which object stores the conversation transcript between the customer and the agent?","o":{"A":"Case","B":"Messaging End User","C":"Messaging Session"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":19,"q":"A Salesforce Administrator wants to generate personalized, targeted emails that incorporate customer interaction data. The admin wants to leverage large language models (LLMs) to write the emails, and wants to reuse templates for different products and customers. Which solution approach should the admin leverage?","o":{"A":"Create a Field Generation prompt template type.","B":"Use Sales Email standard templates.","C":"Create a Sales Email prompt template type."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":20,"q":"Universal Containers (UC) implements a custom retriever to improve the accuracy of AI- generated responses. UC notices that the retriever is returning too many irrelevant results, making the responses less useful. What should UC do to ensure only relevant data is retrieved?","o":{"A":"Define filters to narrow the search results based on specific conditions.","B":"Change the search index to a different data model object (DMO).","C":"Increase the maximum number of results returned to capture a broader dataset."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":21,"q":"What is the correct process to leverage Prompt Builder in a Salesforce org?","o":{"A":"Select the appropriate prompt template type to use, develop the prompt within the prompt workspace, select resources to dynamically insert CRM-derived grounding data, pick the model to use, and test and validate the generated responses.","B":"Enable the target object for generative prompting, develop the prompt within the prompt workspace, select records to fine-tune and ground the response, enable the Trust Layer, and associate the prompt to an action.","C":"Select the appropriate prompt template type to use, select one of Salesforce's standard prompts, determine the object to associate the prompt, select a record to validate against, and associate the prompt to an action."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":22,"q":"Universal Containers tests out a new Einstein Generative AI feature for its sales team to create personalized and contextualized emails for its customers. Sometimes, users find that the draft email contains placeholders for attributes that could have been derived from the recipient's contact record. What is the most likely explanation for why the draft email shows these placeholders?","o":{"A":"The user does not have Einstein Sales Emails permission assigned.","B":"The user does not have permission to access the fields.","C":"The user's locale language is not supported by Prompt Builder."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":23,"q":"Universal Containers (UC) configured a new PDF file ingestion in Data Cloud with all the required fields, and also created the mapping and the search index. UC is now setting up the retriever and notices a required field is missing. How should UC resolve this?","o":{"A":"Update the search index to include the desired field.","B":"Modify the retriever's configuration to include the desired field.","C":"Create a new custom Data Cloud object that includes the desired field."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":24,"q":"Universal Containers (UC) has implemented Generative AI within Salesforce to enable summarization of a custom object called Guest. Users have reported mismatches in the generated information. In refining its prompt design strategy, which key practices should UC prioritize?","o":{"A":"Create concise, clear, and consistent prompt templates with effective grounding, contextual role-playing, clear instructions, and iterative feedback.","B":"Enable prompt test mode, allocate different prompt variations to a subset of users for evaluation, and standardize the most effective model based on performance feedback.","C":"Submit a prompt review case to Salesforce and conduct thorough testing in the playground to refine outputs until they meet user expectations."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":25,"q":"What is the main benefit of using a Knowledge article in an Agentforce Data Library?","o":{"A":"Only the retriever for Knowledge articles allows for agents to access Knowledge from both inside the platform and on a customer's website.","B":"The retriever for Knowledge articles has better accuracy and performance than the default retriever.","C":"It provides a structured, searchable repository of approved documents so the agent can retrieve reliable information for each inquiry."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":26,"q":"Universal Containers has seen a high adoption rate of a new feature that uses generative AI to populate a summary field of a custom object, Competitor Analysis. All sales users have the same profile but one user cannot see the generative AI-enabled field icon next to the summary field. What is the most likely cause of the issue?","o":{"A":"The user does not have the field Generative AI User permission set assigned.","B":"The prompt template associated with summary field is not activated for that user.","C":"The user does not have the Prompt Template User permission set assigned."},"a":"C","orig":"A","status":"corrected","note":"Sparkle icon needs Prompt Template User.","t":"Deployment & security"},{"n":27,"q":"Universal Containers recently launched a pilot program to integrate conversational AI into its CRM business operations with Agentforce Agents. How should the Agentforce Specialist monitor Agents' usability and the assignment of actions?","o":{"A":"Run a report on the Platform Debug Logs.","B":"Run Agent Analytics.","C":"Query the Agent log data using the metadata API."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":28,"q":"Universal Containers (UC) users are complaining that agent answers are not satisfactory. The agent is using PDF files as a knowledge source. How should UC troubleshoot this issue?","o":{"A":"Check that the agent has the PDF file field permission access for the data library.","B":"Analyze the data mapping between source fields and Data Cloud object fields.","C":"Verify the retriever's filter criteria and data source connection."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":29,"q":"Universal Containers wants to leverage the Record Snapshots grounding feature in a prompt template. What preparations are required?","o":{"A":"Configure page layout of the master record type","B":"Enable and configure dynamic form for the object","C":"Create a field set for all the fields to be grounded"},"a":"A","orig":"C","status":"corrected","note":"Snapshots use page layout fields, not field sets.","t":"Prompt Builder"},{"n":30,"q":"How does the AI retriever function within Data Cloud?","o":{"A":"It performs contextual searches over an indexed repository to quickly fetch the most relevant documents, enabling grounding AI responses with trustworthy, verifiable information.","B":"It monitors and aggregates data quality metrics across various data pipelines to ensure only high-integrity data is used for strategic decision-making.","C":"It automatically extracts and reformats raw data from diverse sources into standardized datasets for use in historical trend analysis and forecasting."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":31,"q":"Universal Containers (UC) currently tracks Leads with a custom object. UC is preparing to implement the Sales Development Representative (SDR) Agent. Which consideration should UC keep in mind?","o":{"A":"Agentforce SDR only works with the standard Lead object.","B":"Agentforce SDR only works on Opportunities.","C":"Agentforce SDR only supports custom objects associated with Accounts."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":32,"q":"Universal Containers is planning a marketing email about products that most closely match a customer's expressed interests. What should the company use to generate this email?","o":{"A":"Standard email draft with Einstein and choose standard email template","B":"Custom sales email template which is grounded with interest and product information","C":"Standard email marketing template using Apex or flows for matching interest in products"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":33,"q":"Universal Containers implements three custom actions to get three distinct types of sales summaries for its users. Users are complaining that they are not getting the right summary based on their utterances. What should the Agentforce Specialist investigate as the root cause?","o":{"A":"Review the Action Instructions to ensure they are unique.","B":"Ensure the input and output types are correctly chosen.","C":"Review that the custom action is assigned to an Agent."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":34,"q":"Universal Containers plans to enhance the customer support team's productivity using AI. Which specific use case necessitates the use of Prompt Builder?","o":{"A":"Estimating support ticket volume based on historical data and seasonal trends","B":"Creating an AI-generated customer support agent performance score","C":"Creating a draft of a support bulletin post for new product patches"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":35,"q":"An Agentforce Specialist is creating a custom action for Agentforce. Which setting should the Agentforce Specialist test and iterate on to ensure the action performs as expected?","o":{"A":"Action Instructions","B":"Action Name","C":"Action Input"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":36,"q":"Universal Containers deployed the new Agentforce Sales Development Representative (SDR) into production, but sales reps are saying they can't find it. What is causing this issue?","o":{"A":"Sales rep users do not have access to the SDR Agent object.","B":"Sales rep users are missing the Use SDR Agent permission set.","C":"Sales rep users profiles are missing the Allow SDR Agent permission."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":37,"q":"A sales manager is using Agent Assistant to streamline their daily tasks. They ask the agent to \"Show me a list of my open opportunities.\" How does the large language model (LLM) in Agentforce identify and execute the action to show the sales manager a list of open opportunities?","o":{"A":"The LLM interprets the user's request, generates a plan by identifying the appropriate topics and actions, and executes the actions to retrieve and display the open opportunities.","B":"The LLM uses a static set of rules to match the user's request with predefined topics and actions, bypassing the need for dynamic interpretation and planning.","C":"Using a dialog pattern, the LLM matches the user query to the available topic, action and steps then performs the action."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":38,"q":"Universal Containers (UC) wants to use Flow to bring data from unified Data Cloud objects to prompt templates. Which type of flow should UC use?","o":{"A":"Unified-object linking flow","B":"Data Cloud-triggered flow","C":"Template-triggered prompt flow"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":39,"q":"An Agentforce Agent has been developed with multiple topics and Agent Actions that use flows and Apex. Which options are available for deploying these to production?","o":{"A":"Deploy flows, Apex, and all agent-related items using either change sets or the Salesforce CLI/Metadata API.","B":"Use only change sets because the Salesforce CLI does not currently support the deployment of agent-related metadata.","C":"Deploy the flows and Apex using normal deployment tools and manually create the agent-related items in production."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":40,"q":"After configuring and saving a Salesforce Agentforce Data Library (regardless of the data source), which components are automatically created and available in Data Cloud?","o":{"A":"A data connector, an analytics dashboard, and a workflow rule","B":"A data stream, a search index, and a retriever","C":"A data pipeline, an indexing engine, and a query processor"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":41,"q":"An Agentforce Specialist is tasked with creating a prompt template for a sales team. The template needs to generate a summary of all related opportunities for a given Account. Which grounding technique should the Agentforce Specialist use to include data from the related list of opportunities in the prompt template?","o":{"A":"Use merge fields to reference the default related list of opportunities.","B":"Use the merge fields to reference a custom related list of opportunities.","C":"Use formula fields to reference the Einstein related list of opportunities."},"a":"B","orig":"B","status":"disputed","note":"Default related list (A) also argued.","t":"Prompt Builder"},{"n":42,"q":"Once a data source is chosen for an Agentforce Data Library, what is true about changing that data source later?","o":{"A":"The Data Retriever can be reconfigured to use a different data source.","B":"The data source can be changed through the Data Cloud settings.","C":"The data source cannot be changed after it is selected."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":43,"q":"Universal Containers (UC) wants to make a marketing newsletter and to directly use data from five unrelated objects (two standard and three custom) in a prompt template. How should UC accomplish this?","o":{"A":"Create a flex template and use the five objects as inputs.","B":"Create a prompt template passing in a special custom object that connects the records temporarily.","C":"Create a prompt template-triggered flow to access the data from five objects."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":44,"q":"Based on the user utterance, \"Show me all the customers in New York\", which standard Agent action will the planner service use?","o":{"A":"Query Records","B":"Fetch Records","C":"Select Records"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":45,"q":"Universal Containers recently added a custom flow for processing returns and created a new Agent Action. Which action should the company take to ensure the Agentforce Service Agent can run this new flow as part of the new Agent Action?","o":{"A":"Assign the Manage Users permission to the Agentforce Agent user.","B":"Recreate the flow using the Agentforce Agent user.","C":"Assign the Run Flows permission to the Agentforce Agent user."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":46,"q":"A support team handles a high volume of chat interactions and needs a solution to provide quick, relevant responses to customer inquiries. Responses must be grounded in the organization's knowledge base to maintain consistency and accuracy. Which feature in Agentforce for Service should the support team use?","o":{"A":"Einstein Service Replies","B":"Einstein Reply Recommendations","C":"Einstein Knowledge Recommendations"},"a":"A","orig":"B","status":"corrected","note":"Knowledge-grounded replies = Service Replies.","t":"Data, retrieval & Knowledge"},{"n":47,"q":"Universal Containers (UC) has configured Agentforce Data Library using Knowledge articles. When testing in Agent Builder and the Experience Cloud site, the agent is not responding with grounded Knowledge article information. However, when tested in Prompt Builder, the response returns correctly. What should UC do to troubleshoot the issue?","o":{"A":"Create a new permission set that assigns \"Manage Knowledge\" and assign it to the Agentforce Service Agent User.","B":"Ensure the assigned User permission set includes access to the prompt template used to access the Knowledge articles.","C":"Ensure the Data Cloud User permission set has been assigned to the Agentforce Service Agent User."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":48,"q":"A sales manager needs to contact leads at scale with hyper-relevant solutions and customized communications in the most efficient manner possible. Which Salesforce solution best suits this need?","o":{"A":"Einstein Lead follow-up","B":"Einstein Sales Assistant","C":"Prompt Builder"},"a":"B","orig":"B","status":"disputed","note":"Prompt Builder (C) also argued.","t":"Prompt Builder"},{"n":50,"q":"Universal Containers (UC) wants to enable its sales reps to explore opportunities that are similar to previously won opportunities by entering the utterance, \"Show me other opportunities like this one.\" How should UC achieve this with Agents?","o":{"A":"Create a custom Agent action calling an Apex class.","B":"Use the standard Agent action.","C":"Create a custom Agent action calling a flow."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":51,"q":"An Agentforce Specialist is setting up a new org and needs to ensure that users can create and execute prompt templates. The Agentforce Specialist is unsure which roles are necessary for these tasks. Which permission sets should the Agentforce Specialist assign to users who need to create and execute prompt templates?","o":{"A":"Prompt Template Manager for creating templates and Data Cloud Admin for executing templates","B":"Data Cloud Admin for creating templates and Prompt Template User for executing templates","C":"Prompt Template Manager for creating templates and Prompt Template User for executing templates"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":52,"q":"Universal Containers' Agent Action includes several Apex classes for the new Agentforce Agent. What is an important consideration when deploying Apex that is invoked by an Agent Action?","o":{"A":"Apex classes invoked by an Agent Action may be deployed with less than 75% test coverage as long as the agent is not activated in production.","B":"The Apex classes may bypass the 75% code coverage requirement as long as they are only used by the agent.","C":"The Apex classes must have at least 75% code coverage from unit tests, and all dependencies must be in the deployment package."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":53,"q":"Universal Containers (UC) has a legacy system that needs to integrate with Salesforce. UC wishes to create a digest of account action plans using the generative API feature. Which API service should UC use to meet this requirement?","o":{"A":"SOAP API","B":"REST API","C":"Metadata API"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":54,"q":"What is an Agentforce Specialist able to do when the 'Enrich event logs with conversation data' setting in the Agentforce configuration is enabled?","o":{"A":"View session data including user input and Agent responses for sessions over the past 7 days.","B":"View the user click path that led to each Agent action.","C":"Generate detailed reports on all Agent conversations over any time period."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":55,"q":"Universal Containers wants to allow its service agents to query the current fulfillment status of an order with natural language. There is an existing autolaunched flow to query the information from Oracle ERP, which is the system of record for the order fulfillment process. How should an Agentforce Specialist apply the power of conversational AI to this use case?","o":{"A":"Create a Flex prompt template in Prompt Builder.","B":"Create a custom Agent action which calls a flow.","C":"Configure the Integration Flow Standard Action in Agent Builder."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":56,"q":"What considerations should an Agentforce Specialist be aware of when using Record Snapshots grounding in a prompt template?","o":{"A":"Activities such as tasks and events are excluded.","B":"Empty data, such as fields without values or sections without limits, is filtered out.","C":"Email addresses associated with the object are excluded."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":57,"q":"What is the role of the large language model (LLM) in understanding intent and executing an Agent Action?","o":{"A":"Determine a user's topic access and sort actions by priority to be executed","B":"Identify the best matching topic and actions and correct order of execution","C":"Find similar requested topics and provide the actions that need to be executed"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":58,"q":"Which scenario best demonstrates when an Agentforce Data Library is most useful for improving an AI agent's response accuracy?","o":{"A":"When the AI agent must provide answers based on a curated set of policy documents that are stored, regularly updated, and indexed in the data library.","B":"When data is being retrieved from Snowflake using zero-copy for vectorization and retrieval.","C":"When the AI agent needs to combine data from disparate sources based on mutually common data, such as Customer Id and Product Id for grounding."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":59,"q":"Amid their busy schedules, sales reps at Universal Containers dedicate time to follow up with prospects and existing clients via email regarding renewals or new deals. They spend many hours throughout the week reviewing past communications and details about their customers before performing their outreach. Which standard Agent action helps sales reps draft personalized emails to prospects by generating text based on previous successful communications?","o":{"A":"Agent Action: Find Similar Opportunities","B":"Agent Action: Summarize Record","C":"Agent Action: Draft or Revise Sales Email"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":60,"q":"Universal Containers (UC) wants to build an Agentforce Service Agent that provides the latest, active, and relevant policy and compliance information to customers. The agent must: Semantically search HR policies, compliance guidelines, and company procedures. Ensure responses are grounded on published Knowledge. Allow Knowledge updates to be reflected immediately without manual reconfiguration. What should UC do to ensure the agent retrieves the right information?","o":{"A":"Manually add policy responses into the AI model to prevent hallucinations.","B":"Enable the agent to search all internal records and past customer inquiries.","C":"Set up an Agentforce Data Library to store and index policy documents for AI retrieval."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":61,"q":"Universal Containers recently rolled out Einstein Generative AI capabilities and has created a custom prompt to summarize case records. Users have reported that the generated case summaries are not returning the appropriate information. What is a possible explanation for the poor prompt performance?","o":{"A":"The Einstein Trust Layer is incorrectly configured.","B":"The data being used for grounding is incorrect or incomplete.","C":"The prompt template version is incompatible with the chosen large language model (LLM)."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":62,"q":"Universal Containers has created an Employee Agent. Which step should an Agentforce Specialist take to connect the agent with a Slack channel?","o":{"A":"Create a connection between Salesforce and the Slack workspace.","B":"Create an embedded service deployment and connection between Salesforce and the Slack workspace.","C":"Create an Omni-Channel flow and connection between Salesforce and the Slack workspace."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":63,"q":"An Agentforce Specialist needs to enable the use of Sales Email prompt templates for the sales team. The Agentforce Specialist has already created the templates in Prompt Builder. According to best practices, which steps should the Agentforce Specialist take to ensure the sales team can use these templates?","o":{"A":"Assign the Prompt Template User permission set and enable Sales Emails in Setup.","B":"Assign the Data Cloud Admin permission set and enable Sales Emails in Setup.","C":"Assign the Prompt Template Manager permission set and enable Sales Emails in Setup."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":65,"q":"Universal Containers needs to create Data Cloud reports to understand agent behavior. Which data lake object (DLO) represents an overarching container capturing contiguous interactions with one or more AI agents?","o":{"A":"AIAgentSession","B":"AIAgentInteraction","C":"AIAgentInteractionMessage"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":66,"q":"Which scenario best illustrates the use of Model Context Protocol (MCP) in an enterprise AI deployment?","o":{"A":"A sales agent discovering other agents' capabilities using Agent Cards","B":"A legal assistant agent using MCP to dynamically find a document classification API to analyze case files","C":"A customer service agent engaging another agent in real-time conversation to resolve tickets"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":68,"q":"Universal Containers (UC) has registered an external service and created a template- triggered prompt flow that invokes the external service to fetch data from a REST API. UC now needs to make the response data from the external service usable inside a prompt template as a merge field when the template runs. How should UC meet this requirement?","o":{"A":"Use the 'Add Prompt Instructions' flow element.","B":"Use External Service Record merge fields.","C":"Convert the JSON to an XML merge field."},"a":"A","orig":"B","status":"corrected","note":"Master file had a duplicate keyed A.","t":"Prompt Builder"},{"n":69,"q":"Universal Containers (UC) wants to deploy an Agentforce Service Agent to support customers via a web experience. UC uses a Digital Experience site and wants to enable messaging for logged in users. The customer needs to pass the membership number to the agent for which a pre chat variable is available. What is a required step to connect the agent to the Digital Experience site using Messaging for In-App and Web?","o":{"A":"Configure MuleSoft to establish a secure API tunnel between the agent and the Digital Experience site.","B":"Configure a messaging Lightning web component using standard or custom Lightning Type for Agentforce.","C":"Create an Omni-Channel flow that routes messages to the agent."},"a":"B","orig":"B","status":"disputed","note":"Two other question sets also say B; Omni-Channel flow (C) also argued.","t":"Deployment & security"},{"n":72,"q":"How does Agentforce select the correct action to resolve a user's request?","o":{"A":"Each topic contains a list of the matching action's user utterances so that the agent can map the user request to the right topic and action.","B":"The large language model (LLM) selects the right topic and action, if they exist. If there are no matches, the LLM attempts to answer the user's request.","C":"The reasoning engine identifies the agent action to be executed by its name and action input instructions."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":73,"q":"Universal Containers (UC) is expanding its Agentforce for Service capabilities to include case management. For security purposes, UC wants the agent to verify a customer's identity before providing any case-related information. The verification must be deterministic ensuring that no case details are shared unless identity verification has been successfully completed. Which approach best meets this requirement?","o":{"A":"Create a variable to store the verification status, set it as output from a \"Verify Identity\" action, and apply a filter so any case-related actions only run when the variable confirms verification.","B":"Use keywords such as \"Always\" and \"Never\" to write clear logic in Topic Instructions to verify user identity before providing any case information.","C":"Store the verification status in a custom variable and set a global instruction that the agent should check this variable before sharing case information."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":74,"q":"Cloud Kicks wants to integrate its agent with its custom website. The goal is for customers to interact with the custom agent chat interface. Which approach provides the framework for the custom web application to communicate with the agent?","o":{"A":"Agent API","B":"Model Context Protocol (MCP)","C":"Agent to Agent (A2A)"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":75,"q":"Universal Containers (UC) plans to answer questions based on similar cases that have been successfully resolved in the past. What should UC consider when implementing this approach?","o":{"A":"No action is needed, as past cases are used to answer the question.","B":"Create an unstructured data model object (UDMO) based on Case object and create an index on it.","C":"Create a data model object (DMO) based on Case object and create an index on it."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":76,"q":"Universal Containers (UC) is preparing to use the Agentforce Testing Center to ensure the reliability of a new agent. UC has a CSV file with test cases and is reviewing the documentation to understand best practices and limitations. Which best practice should the company follow to avoid modifying CRM data while running tests in the Testing Center?","o":{"A":"Limit the number of test cases to 50 per test to minimize data changes.","B":"Use the Testing Center only in the sandbox environment.","C":"Run tests in the production environment to ensure real time data accuracy."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":77,"q":"Universal Containers has PDF maintenance guides in an external folder, not yet in Salesforce. The team wants a standard, clicks-only setup for the Service Agent to use these documents. Which approach should the Agentforce Specialist implement?","o":{"A":"Paste external PDF links into topic instructions and rely on the model to follow them, avoiding configuration of a retrieval source, index, or retriever action.","B":"Upload the PDFs as File source in the Agentforce Data Library which will build a Search Index, and create a retriever to ground responses from those documents.","C":"Configure Data Cloud to ingest file attachments and create custom index and retriever for product record and attachment data."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":78,"q":"Coral Cloud Resorts is about to start testing its concierge agent with guests. Which metrics should be captured to monitor the performance, correctness, and user experience?","o":{"A":"Agent performance, token usage, and conversation duration","B":"Response performance, tone, and CSATS","C":"Response times, accuracy and relevance of answers, and resolution success"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":79,"q":"An Agentforce Specialist wants to troubleshoot an agent that is hallucinating weblinks. The agent has an action that uses a prompt template, which is using a knowledge retriever, to generate the output text that the agent will use. Which process is appropriate to find the root cause of the hallucination behavior?","o":{"A":"Examine the prompt instructions and contents of the chunks shown in the resolved prompt output.","B":"Examine the topic instructions and ensure the word \"ALWAYS\" is used in the hallucination guardrails.","C":"Examine the topic name and classification description for hallucination guardrails."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":80,"q":"An Agentforce Specialist needs to create a prompt template that extracts the customer's name, phone number, and case number from a block of text, and nothing else. How should the Agentforce Specialist structure the prompt to ensure the large language model (LLM) doesn't include extra conversation or text?","o":{"A":"Ask the LLM to extract and only output the important information in the text.","B":"Use well-defined output instructions and provide desired output examples.","C":"Ensure in the prompt that the LLM has been told to only use name value pairs in the response."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":81,"q":"Before activating a custom agent action, an Agentforce Specialist would like to evaluate multiple real-world user utterances to ensure the action is being selected appropriately. Which tool should the Agentforce Specialist recommend?","o":{"A":"Testing Center","B":"Agentforce Builder","C":"Prompt Builder"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":82,"q":"Coral Cloud Resorts needs to ensure its booking agent executes actions in a specific sequence: First retrieve available sessions, then verify customer eligibility, and finally create the booking. The current implementation allows the large language model (LLM) to execute these actions in any order, causing booking failures. Which approach should an Agentforce Specialist implement?","o":{"A":"Create custom variables that store completion status for each step, then implement conditional filters on subsequent actions requiring previous variables to be populated, ensuring deterministic execution order.","B":"Configure topic, classification description, and action instructions with priority levels and sequence indicators to guide the reasoning engine in selecting the correct action order automatically.","C":"Write comprehensive topic instructions detailing the exact sequence of actions using numbered steps and explicit ordering requirements for the reasoning engine to follow during booking workflows."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":83,"q":"When a verified customer in a help center says, \"I want to upgrade my service plan,\" an AI agent needs to complete the following asks: Verify identity and entitlement. Create a new quote. Calculate a prorated upgrade amount. Escalate to an Account Executive (AE) only if the reorder exceeds US $25,000 Which type of agent should an Agentforce Specialist build to support this use case?","o":{"A":"Service Agent to resolve the case end-to-end and create a new opportunity for the sales team","B":"Sales Agent to handle the upsell and large-deal escalation","C":"Employee Agent to orchestrate internal logistics and finance"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":84,"q":"Coral Cloud Resorts is uploading thousands of new HTML knowledge articles files for a resort launch. To ensure Agentforce retrieves accurate responses quickly, which chunking strategy should be used when creating a new index?","o":{"A":"Conversation-based chunking","B":"Semantic based passage extraction","C":"Section-aware chunking"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":85,"q":"Which statement explains why a company might prefer a hybrid search index in Data Cloud for Agentforce?","o":{"A":"Vector embeddings in hybrid search are prefiltered by keyword matches, reducing computational overhead and improving response accuracy.","B":"Hybrid search indexes process queries faster than vector search because they eliminate the need for semantic embedding.","C":"Hybrid search indexes support both literal keyword matches and semantic recall, useful when queries mix specific terms and intent."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":86,"q":"Universal Containers (UC) is setting up a new Agentforce Service Agent. The company has sensitive medical product research stored internally and wants to ensure the agent cannot access it. What should UC do?","o":{"A":"Assign the Agentforce Service Agent user the lowest possible role in the organization's hierarchy to block access.","B":"Disable the Agentforce Service Agent's ability to use any Salesforce custom object or related fields.","C":"Follow the principle of least privilege and avoid granting permission to view the Medical Product object or related fields."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":87,"q":"Universal Containers (UC) needs to create a prompt template that provides a detailed product description based on the latest product data. The description will be used in marketing materials to ensure consistency and accuracy. Which prompt template type should UC use?","o":{"A":"Record Summary","B":"Sales Email","C":"Field Generation"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":88,"q":"What does it mean when a prompt template version is described as immutable?","o":{"A":"Every modification on a template will be saved as a new version automatically.","B":"After a prompt template version is activated, no further changes can be saved to that version.","C":"Only the latest version of a template can be activated."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":89,"q":"Universal Containers stores case details and updates in several custom fields and custom objects related to the case. UC would like its Agentforce Service Agent to be able to provide information in these fields and related records as part of an answer back to its customers when the customer is asking for updates. Which best practice should UC follow to grant access to this information for the Agentforce Service Agent?","o":{"A":"Update the Object and Field access in the Einstein Agent User Profile so that the Agentforce Service Agents will always get the necessary access.","B":"Update the Object and Field access in the AgentforceServiceAgentUserPsg permission set group that is already assigned to the Agentforce Service Agent user.","C":"Create a new permission set with the Einstein Agent License and enable Read access to the custom fields and custom objects, and assign it to the Agentforce Service Agent user."},"a":"B","orig":"B","status":"disputed","note":"Separate permission set (C) also argued.","t":"Deployment & security"},{"n":90,"q":"Universal Containers wants to systematically validate agent responses before deployment using a scalable testing process. Which Testing Center approach should the company implement?","o":{"A":"Manually interact with the agent in Builder until responses seem correct.","B":"Use pilot users in production to flag incorrect responses post launch.","C":"Upload a structured CSV test template and run batch test cases in Testing Center."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":91,"q":"Universal Containers needs to restrict access to refund processing actions so only customers with Active account status can initiate refunds. How should an Agentforce Specialist apply the restriction deterministically?","o":{"A":"Create a context variable for the account status field and apply a conditional filter AccountStatus equals \"Active\" to refund actions.","B":"Include step-by-step instructions at the topic level and action level explaining the rules and examples.","C":"Create a Flex Prompt Template that has instructions to check for account status."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":92,"q":"Coral Cloud Resorts is implementing Agentforce retrieval. Customers sometimes type ambiguous terms (for example, \"package\" could mean vacation package or baggage). Which retrieval strategy best balances precision and contextual disambiguation?","o":{"A":"Use hybrid search, which combines keyword matching for precision with semantic embeddings for context.","B":"Use keyword search only, which prioritizes exact term matching but risks missing contextual meaning.","C":"Use semantic search only, which captures intent but may struggle with ambiguous terms when no context is provided."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":93,"q":"Universal Containers has multiple Salesforce orgs, each with a unique customer service agent where a verification agent must pass customer identity data to downstream agents handling account modifications. The customer ID must remain secure and persistent across agent handoffs without exposure to large language model (LLM) modification. What is the most appropriate configuration?","o":{"A":"Store customer identity information in conversation variables created by the first agent and have other agents read those same conversation variables.","B":"Implement a custom object to temporarily store verification status and have each agent query it via SQL actions during execution.","C":"Use the Agent API to start the downstream agent's session and pass the verified customer ID as a read-only context variable, ensuring security and preventing LLM alteration."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":94,"q":"Universal Containers has a requirement to provide a sales summary for its sales reps who are using Employee Agents, but they are not happy with the default answer. Which best practice should the Agentforce Specialist recommend?","o":{"A":"Create a Knowledge Answer custom prompt template.","B":"Create a Record Summary custom prompt template.","C":"Update the standard record summary action."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":95,"q":"Cloud Kicks (CK) recently finished the development of a new prompt template that uses its own large language model (LLM). CK is deploying a prompt template from a sandbox to a production org, and is receiving an error. When trying to deploy the change set, CK is getting an error related to the LLM used in the prompt template. What is the cause of the error?","o":{"A":"The prompt does not specify that it is a custom LLM.","B":"The name of the LLM does not match in sandbox and production.","C":"BYOLLM is not yet supported for prompt templates in production."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":96,"q":"Universal Containers (UC) needs to create a custom prompt template that can be called from a Lightning web component. Which prompt template type should UC create?","o":{"A":"Flex","B":"Sales Email","C":"Field Generation"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":97,"q":"An Agentforce Specialist is creating a custom agent action. The topic is selected correctly, but the action is not. Which setting should the Agentforce Specialist test and iterate on to ensure the action performs as expected?","o":{"A":"Action Instructions","B":"Action Scope","C":"Classification Description"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":98,"q":"An administrator at Universal Containers has successfully deployed a new agent from a sandbox to production using a change set. The agent uses a prompt template that invokes a Salesforce flow to perform a complex calculation. In production, when users interact with the agent, it fails with an error message every time the flow is supposed to run. The flow was included in the change set and is present in production. What is the most likely cause of this issue?","o":{"A":"The change set did not include the dependent Apex classes for the flow.","B":"The flow was not manually activated in the production org after the deployment.","C":"The user in production does not have permission to run the flow."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":99,"q":"When is the Agent-to-Agent (A2A) protocol an appropriate communication choice?","o":{"A":"When agents need to collaborate","B":"When agents need to access tools","C":"When agents need to invoke third party API"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":100,"q":"Coral Cloud Resorts (CCR) sees the agent forgot the dietary/activity preferences gathered earlier. They need those preferences to persist throughout the session. What should CCR implement?","o":{"A":"Configure custom variables to capture/store customer preferences from action outputs.","B":"Rely on natural conversation memory and instruct the agent to look back.","C":"Create a context variable to capture/store customer preferences."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":101,"q":"An Agentforce Specialist is creating a custom action in Agentforce. Which option is available for the Agentforce Specialist to choose for the custom agent action?","o":{"A":"Flows","B":"SOQL","C":"Apex trigger"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":102,"q":"Universal Containers has a custom agent action calling a flow to retrieve the real-time status of an order from the order fulfillment system. For the given flow, what should the Agentforce Specialist consider about the running user's data access?","o":{"A":"The flow must have the 'with sharing' permission selected in the advanced settings for the permissions, field level security, and sharing settings to be respected.","B":"The agent will always run flows in system mode so the running user's data access will not affect the data returned.","C":"The custom action adheres to the permissions, field-level security, and sharing settings configured in the flow."},"a":"C","orig":"A","status":"corrected","note":"Flows run per their own run context; \"with sharing\" is Apex wording.","t":"Deployment & security"},{"n":103,"q":"What is automatically created when a search index is created in Data Cloud?","o":{"A":"A predefined Apex retriever class that can be edited by a developer to meet specific needs","B":"A dynamic retriever to allow runtime selection of retriever parameters without manual configuration","C":"A default retriever that shares the name of the custom search index"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":104,"q":"The Agentforce Specialist for Cloud Kicks wants to create an agent that will allow the sales staff to schedule their daily tasks, and assist in providing detailed explanations behind prices and deals of the products. Following Salesforce best practices, which type of agent should the Agentforce Specialist create?","o":{"A":"Service Agent","B":"Employee Agent","C":"Sales Agent"},"a":"B","orig":"C","status":"corrected","note":"Internal staff helper = Employee Agent.","t":"Agent types & channels"},{"n":105,"q":"Universal Containers' administrator has developed a new agent in a sandbox environment and now wants to deploy it to production. What should the administrator do to deploy an agent?","o":{"A":"Export agent components as JSON files and manually import them into production using the Metadata API.","B":"Create an outbound change set with all the necessary agent components, then upload to production.","C":"Manually recreate the agent configuration, topics, and actions in production because change sets cannot be used."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":106,"q":"A developer is using the Salesforce CLI to deploy agent components from a sandbox to production. They recently made a change to several topics, instructions, and actions. Which metadata component should the developer include in their package.xml file that contains all of the topics and actions an agent will interact with?","o":{"A":"EinsteinAiPlannerBundle","B":"genAiPlannerBundle","C":"BotBundle"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":107,"q":"Universal Containers (UC) wants to empower its marketing team with AI capabilities that help employees quickly find campaign data, generate creative content, and manage project tasks. The solution should also allow marketers to receive personalized support, surface relevant information, and complete work directly in Salesforce. Which AI solution should UC implement?","o":{"A":"Service Agent","B":"Employee Agent","C":"Sales Coach Agent"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent types & channels"},{"n":109,"q":"What is the purpose of applying filters in a custom retriever configuration?","o":{"A":"Filters automatically encrypt and mask sensitive fields in the search index to ensure that only non-confidential information is retrieved for public queries.","B":"Filters narrow the search results by applying up to 10 conditions based on fields defined in the
