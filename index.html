<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agentforce Specialist Practice Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Exam booklet with a proctor's clock. Literata for reading, Albert Sans for controls.
   Colour = state only. Left aligned, no cards. */
:root{
  --paper:#ffffff; --desk:#f2f3f6; --ink:#1b1d22; --pencil:#5c6270; --rule:#dfe2e8; --rule-strong:#b8bec9;
  --bb:#22396b; --bb-deep:#182a52; --bb-soft:#e9edf6;
  --right:#2e6b40; --right-soft:#e8f2eb; --wrong:#a8352c; --wrong-soft:#f8e9e7; --marked:#a86d12;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Albert Sans","Segoe UI",system-ui,sans-serif;
  --r:6px;
  color-scheme:light;
  /* aliases used by scripted SVG and older markup */
  --line:var(--rule); --muted:var(--pencil); --form:var(--bb); --form-deep:var(--bb-deep); --pen:var(--wrong); --pen-soft:var(--wrong-soft); --flag:var(--marked); --sheet:var(--paper); --tint:var(--desk); --ok:var(--right); --good-soft:var(--right-soft); --on-form:#fff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bb);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-read);font-weight:600;letter-spacing:-.01em}
h1{font-size:44px;line-height:1.1}
h2{font-size:28px;line-height:1.2}
h3{font-size:20px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.lede{font-size:18px;color:var(--pencil);max-width:56ch;margin:16px 0 0}
.label{font-size:14px;color:var(--pencil)}
.note{margin:8px 0 0;font-size:14px;color:var(--pencil)}
.empty{color:var(--pencil);padding:24px 0}
.mono{font-variant-numeric:tabular-nums}

/* site header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{margin-right:auto;font-weight:600;display:flex;gap:10px;align-items:baseline}
.brand small{font-size:14px;color:var(--pencil);font-weight:400}
nav.tabs{display:flex;gap:4px}
nav.tabs button{border:0;background:none;padding:6px 12px;border-radius:var(--r);color:var(--pencil);font-weight:500}
nav.tabs button:hover{background:var(--desk);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--desk);color:var(--ink);font-weight:600}
main{padding-block:48px 80px}

/* buttons */
.btn,.xbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:var(--r);font-weight:600;font-size:15px;line-height:1.2;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled),.xbtn:hover:not(:disabled){background:var(--desk);border-color:var(--pencil)}
.btn:active:not(:disabled),.xbtn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled,.xbtn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary,.xbtn#next,.xbtn.end,.xbtn.on{background:var(--bb);border-color:var(--bb);color:#fff}
.btn.primary:hover:not(:disabled),.xbtn#next:hover,.xbtn.end:hover,.xbtn.on:hover{background:var(--bb-deep);border-color:var(--bb-deep)}
.btn.small{padding:6px 12px;font-size:14px}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:64px;align-items:start}
.setup h1{font-size:56px;line-height:1.05}
.panel{display:grid;gap:28px;padding-left:40px;border-left:1px solid var(--rule)}
fieldset{border:0;padding:0;margin:0;display:grid;gap:10px}
legend{padding:0;margin-bottom:10px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;text-align:center;padding:10px 8px;border:1px solid var(--rule-strong);border-radius:var(--r);font-weight:500;transition:background .12s,border-color .12s}
.seg label:hover span{background:var(--desk)}
.seg input:checked + span{background:var(--bb);border-color:var(--bb);color:#fff;font-weight:600}
.seg input:focus-visible + span{outline:2px solid var(--bb);outline-offset:2px}
.check{display:flex;gap:10px;align-items:center}
.check input{width:18px;height:18px;accent-color:var(--bb)}
.resume{margin-top:32px;padding:14px 18px;background:var(--desk);border-radius:var(--r);display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* exam screen */
body.testing header.top{display:none}
body.testing main{padding:0;max-width:none}
.exam{background:var(--paper)}
.xbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.xbar-in,.xbody{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.xbar-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px}
.xtitle{font-weight:600;margin-right:auto}
.xprog{color:var(--pencil);font-variant-numeric:tabular-nums}
.xtime{display:inline-flex;align-items:baseline;gap:8px;color:var(--pencil);font-size:14px}
.xtime b{font-family:var(--f-read);font-size:22px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.xtime b.low{color:var(--wrong)}
.xbar .xmapbtn{border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);border-radius:var(--r);padding:8px 14px;font-weight:600;font-size:14px}
.xbar .xmapbtn:hover{background:var(--desk)}
.xbar .xmapbtn[aria-expanded="true"]{background:var(--desk);border-color:var(--bb)}
.xbody{padding-block:24px 56px}
.xlayout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:56px;align-items:start}

/* the booklet item: big number in the margin */
.xq{display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:24px;max-width:860px}
.xq > *{grid-column:2}
.xqhead{grid-column:1;grid-row:1 / span 6;display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:2px}
.qnum{font-family:var(--f-read);font-size:64px;line-height:.9;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.qof{font-size:14px;color:var(--pencil);white-space:nowrap}
.xmarked{font-size:13px;font-weight:600;color:var(--marked);text-align:right}
.qtext{font-family:var(--f-read);font-size:20px;line-height:1.6;max-width:64ch;margin:0 0 20px;white-space:pre-line}
.instr{font-size:14px;color:var(--pencil);margin:0 0 10px}
.choices{display:grid;gap:4px}
.choice{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:start;padding:12px 14px;border-radius:var(--r);cursor:pointer;font-size:17px;line-height:1.5;transition:background .12s}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .cl{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:5px;font-weight:600;font-size:14px;color:var(--pencil);background:var(--paper);margin-top:-2px}
.choice:hover{background:var(--desk)}
.choice:has(input:checked){background:var(--bb-soft)}
.choice:has(input:checked) .cl{background:var(--bb);border-color:var(--bb);color:#fff}
.choice:has(input:focus-visible){outline:2px solid var(--bb);outline-offset:1px}
.choice.right{background:var(--right-soft)}
.choice.right .cl{background:var(--right);border-color:var(--right);color:#fff}
.choice.wrong{background:var(--wrong-soft)}
.choice.wrong .cl{background:var(--wrong);border-color:var(--wrong);color:#fff}
.choice:has(input:disabled){cursor:default}
.feedback{margin-top:16px;padding:12px 16px;border-left:3px solid var(--right);background:var(--right-soft)}
.feedback.no{border-left-color:var(--wrong);background:var(--wrong-soft)}
.feedback strong{display:block}
.pill{font-size:13px;font-weight:600;margin-right:8px}
.pill.corrected{color:var(--wrong)} .pill.disputed{color:var(--marked)} .pill.user{color:var(--bb)}
.xfoot-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px}
.xbtns{display:flex;gap:8px;flex-wrap:wrap}
.markbox{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule-strong);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:15px;cursor:pointer}
.markbox:hover{background:var(--desk)}
.markbox input{width:16px;height:16px;accent-color:var(--marked)}
.markbox:has(input:checked){border-color:var(--marked);color:var(--marked)}
.keys{grid-column:2;margin-top:18px;font-size:13px;color:var(--pencil)}
.keys kbd{font:600 12px var(--f-ui);border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}

/* question map */
.qmap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
.qmap-head{display:flex;align-items:baseline;justify-content:space-between}
.qmap-close{background:none;border:0;color:var(--bb);font-weight:600;font-size:14px;padding:4px 0}
.qmap-sum{font-size:14px;color:var(--pencil);margin:4px 0 14px}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;overflow:auto;padding:3px}
.mcell{aspect-ratio:1;border:1px solid var(--rule-strong);background:var(--paper);border-radius:5px;font-size:13px;font-weight:600;padding:0;position:relative;font-variant-numeric:tabular-nums}
.mcell:hover{background:var(--desk)}
.mcell.ans{background:var(--bb);border-color:var(--bb);color:#fff}
.mcell.r{background:var(--right);border-color:var(--right);color:#fff}
.mcell.w{background:var(--wrong);border-color:var(--wrong);color:#fff}
.mcell.cur{outline:2px solid var(--ink);outline-offset:2px}
.mcell.fl::after{content:"";position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--marked);border:2px solid var(--paper)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--pencil);margin-top:14px}
.mk{display:inline-block;width:12px;height:12px;border:1px solid var(--rule-strong);border-radius:3px;margin-right:6px;vertical-align:-2px;background:var(--paper)}
.mk.ans{background:var(--bb);border-color:var(--bb)} .mk.r{background:var(--right);border-color:var(--right)} .mk.w{background:var(--wrong);border-color:var(--wrong)}
.mk.fl{background:var(--marked);border-color:var(--marked);border-radius:50%} .mk.cur{outline:2px solid var(--ink);outline-offset:1px}

/* review screen */
.xq.review{display:block;max-width:860px}
.xq.review .xqhead{display:block}
.xfilters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.xcell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);font-size:13px;color:var(--pencil)}
.xcell:hover{background:var(--desk)}
.xcell b{font-family:var(--f-read);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.xcell i{font-style:normal;font-weight:600;color:var(--marked)}
.xcell.inc{border-style:dashed;border-color:var(--rule-strong)}
.xcell.ans{background:var(--bb-soft)}
.xcell.r{background:var(--right-soft)}
.xcell.w{background:var(--wrong-soft)}
.xconfirm{margin-top:28px;padding:16px 18px;border-left:3px solid var(--wrong);background:var(--wrong-soft);display:grid;gap:12px}
.xconfirm p{margin:0}

/* results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 48px;align-items:end;padding-bottom:32px;border-bottom:1px solid var(--rule)}
.bigscore{font-family:var(--f-read);font-size:96px;line-height:.9;font-weight:500;font-variant-numeric:tabular-nums}
.bigscore small{font-size:40px;color:var(--pencil);font-weight:400}
.verdict{font-size:18px;margin:10px 0 0}
.verdict b.pass{color:var(--right)} .verdict b.fail{color:var(--wrong)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px;color:var(--pencil)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:32px 0 8px}
.toolbar input[type=search]{flex:1 1 260px;min-width:0;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper)}
.toolbar select{padding:10px 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--paper)}

/* question lists (review, answer key) */
.list{display:grid}
.item{padding:24px 0;border-top:1px solid var(--rule);max-width:860px}
.item:first-child{border-top:0}
.item .meta{display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px;font-size:14px;color:var(--pencil)}
.item .meta .label:first-child{font-family:var(--f-read);font-size:18px;font-weight:600;color:var(--ink)}
.item p.q{font-family:var(--f-read);font-size:18px;line-height:1.6;margin:0 0 12px;max-width:66ch;white-space:pre-line}
.item ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.item li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:6px 8px;border-radius:var(--r)}
.item li b{font-weight:600;color:var(--pencil)}
.item li.right{background:var(--right-soft)}
.item li.right b{color:var(--right)}
.item li.wrong{background:var(--wrong-soft)}
.item li.wrong b{color:var(--wrong)}
.item li:has(.setans){display:block;padding:0}
.setans{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:var(--r);font-size:16px;line-height:1.5}
.setans:hover{background:var(--desk)}
.setans b{font-weight:600;color:var(--pencil)}
.item li.right .setans b{color:var(--right)}
.item li.right .setans:hover{background:var(--right-soft)}
.more{display:flex;margin-top:16px}

/* history */
.hsum{font-size:18px;max-width:60ch;margin:14px 0 0;color:var(--pencil)}
.hsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.hsec{margin-top:48px}
.hsec h2{font-size:24px;margin-bottom:16px}
.chartbox{overflow-x:auto}
.chart{display:block;width:100%;min-width:420px;height:auto}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 56px}
.topics{display:grid;gap:12px}
.trow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 44px 52px;gap:12px;align-items:center}
.tbar{height:8px;background:var(--desk);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:4px}
.tbar i.ok{background:var(--right)} .tbar i.no{background:var(--wrong)}
.tval{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tn{font-size:13px;color:var(--pencil);font-variant-numeric:tabular-nums}
.missed{margin:0 0 18px;padding-left:22px;display:grid;gap:12px}
.mq{display:block;font-family:var(--f-read)}
.mm{font-size:13px;font-weight:600;color:var(--wrong)}
.tablebox{overflow-x:auto}
.htable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.htable th{text-align:left;font-size:14px;color:var(--pencil);font-weight:500;padding:10px 16px 10px 0;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
.htable td{padding:12px 16px 12px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.res{font-weight:600} .res.ok{color:var(--right)} .res.no{color:var(--wrong)}

@media (max-width:999px){
  .xlayout{display:block}
  .qmap{position:fixed;inset:auto 0 0 0;top:auto;z-index:20;background:var(--paper);border-top:1px solid var(--rule);box-shadow:0 -10px 30px rgba(27,29,34,.16);max-height:70vh;padding:16px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
  .mgrid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  .setup,.hgrid{grid-template-columns:minmax(0,1fr)}
  .panel{padding-left:0;border-left:0;padding-top:32px;border-top:1px solid var(--rule)}
}
@media (max-width:640px){
  h1,.setup h1{font-size:36px}
  main{padding-block:28px 56px}
  .xq{grid-template-columns:minmax(0,1fr)}
  .xq > *{grid-column:1}
  .xqhead{grid-row:auto;flex-direction:row;align-items:baseline;gap:10px;margin-bottom:12px}
  .qnum{font-size:44px}
  .qtext{font-size:18px}
  .choice{font-size:16px;padding:10px 8px}
  .xfoot-in{flex-direction:column;align-items:stretch}
  .xbtns .xbtn{flex:1 1 0;padding-inline:8px}
  .markbox{justify-content:center}
  .keys{display:none}
  .score{grid-template-columns:minmax(0,1fr)}
  .bigscore{font-size:72px}
  .trow{grid-template-columns:minmax(0,1fr) 44px 52px}
  .trow .tbar{grid-column:1/-1;grid-row:2}
  .brand small{display:none}
}
/* question map: fixed panel on the right edge, always in the same place */
.xlayout{display:block}
.qmap{position:fixed;top:0;right:0;bottom:0;left:auto;width:340px;max-width:100vw;max-height:none;margin:0;z-index:20;background:var(--paper);border-left:1px solid var(--rule);border-top:0;box-shadow:none;display:flex;flex-direction:column;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.mgrid{grid-template-columns:repeat(6,minmax(0,1fr));max-height:none;flex:1;overflow:auto;align-content:start}
.mcell{aspect-ratio:auto;height:40px}
@media (min-width:1200px){.exam:has(.qmap){padding-right:340px}}
@media (max-width:1199px){.qmap{box-shadow:-12px 0 32px rgba(27,29,34,.16)}}
@media (max-width:640px){.qmap{top:auto;width:100%;height:70vh;border-left:0;border-top:1px solid var(--rule);box-shadow:0 -10px 30px rgba(27,29,34,.16)}.mgrid{grid-template-columns:repeat(auto-fill,minmax(42px,1fr))}}
/* buttons always sit at the bottom of the screen, whatever the question length */
.exam{min-height:100vh;display:flex;flex-direction:column}
.xbody{flex:1;display:flex;flex-direction:column;width:100%}
.xlayout{flex:1;display:flex;flex-direction:column}
.xq{flex:1;display:flex;flex-direction:column;position:relative;padding-left:120px;max-width:980px;width:100%}
.xqhead{position:absolute;left:0;top:0;width:96px}
.xq .xfoot-in{margin-top:auto;padding-top:32px}
.xq.review{display:flex;padding-left:0;max-width:980px}
.xq.review .xqhead{position:static;width:auto}
@media (max-width:640px){.xq{padding-left:0}.xqhead{position:static;width:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.stats b{margin-right:4px}
</style>

<header class="top"><div class="wrap">
  <div class="brand">Agentforce Specialist <small>199 questions</small></div>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-exam" aria-selected="true" data-view="setup">Exam</button>
    <button role="tab" id="tab-hist" aria-selected="false" data-view="history">History</button>
    <button role="tab" id="tab-key" aria-selected="false" data-view="key">Answer key</button>
  </nav>
</div></header>

<main class="wrap" id="app"></main>

<script>
const DATA = [{"n":1,"q":"Universal Containers has successfully chunked and vectorized its unstructured meeting notes into a Data 360 search index. An Agentforce Specialist needs to connect this data to a prompt template to dynamically refine search criteria and retrieve the most relevant information. How should the specialist achieve this?","o":{"A":"Create a Flex template referencing a data lake object (DLO).","B":"Create a Flex template referencing a retriever in the prompt template.","C":"Create a Flex template referencing the data model object (DMO)."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-01","t":"Prompt Builder"},{"n":2,"q":"Which business requirement best presents a good use case for using Prompt Builder?","o":{"A":"Forecast future sales trends based on historical data","B":"Send a quote proposal in reply to a request for a quote","C":"Identify potential high-value leads based on lead score."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-02","t":"Prompt Builder"},{"n":3,"q":"An Agentforce Specialist is creating a custom agent action. The subagent (formerly known as a topic) is selected correctly, but the action is not. Which component of Action structure in Agent Script helps the large language model (LLM) decide when to use the action?","o":{"A":"target","B":"label","C":"description"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-03","t":"Agent Builder & actions"},{"n":4,"q":"An Agentforce Specialist is evaluating an agent conversation. What is the reason why intents and session metrics within Observability are important to consider?","o":{"A":"To evaluate the agent's overall performance","B":"To evaluate why the agent was unable to answer a user's question","C":"To evaluate the deflection rate of the agent"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-04","t":"Testing & monitoring"},{"n":5,"q":"Universal Containers (UC) is implementing Agentforce Service Agent on Email. UC made an email template and now needs to connect it to a Service Agent. What should an Agentforce Specialist recommend?","o":{"A":"Create an Email Configuration for the Service Agent.","B":"Create an Omni-Channel flow to point to an email template.","C":"No action needed; the Service Agent connects automatically."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-05","t":"Agent types & channels"},{"n":6,"q":"A company's support agent is inconsistently executing a mandatory fraud check action before processing refunds. In some conversations the fraud check fires, but in others the agent skips directly to issuing the refund. Upon review, an Agentforce Specialist recommends placing the instruction guideline with 'run @actions.fraud_check' followed by 'run @actions.process_refund'. What is the effect of this configuration change?","o":{"A":"The fraud-check action will be more strongly suggested to the large language model (LLM), but it may still be skipped if the LLM determines it is not relevant to the conversation.","B":"The fraud-check action will execute after the large language model (LLM) check if it missed it in the process step execution, but the agent will lose its ability to use an empathetic tone.","C":"The fraud-check action will be forced to execute before the refund action in every conversation, because procedural instructions provide deterministic control over the execution order."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-06","t":"Agent Builder & actions"},{"n":7,"q":"Universal Containers is configuring its Agentforce Testing Center to evaluate an agent handling customer complaints. The company wants to assess if the agent successfully demonstrates empathy and follows a proprietary \"De-escalation Framework\" before offering a resolution. Where should the Agentforce Specialist utilize a large language model (LLM)-as-judge to achieve an appropriate evaluation?","o":{"A":"Adjust the fixed criteria of the standard Coherence quality evaluation to control the LLM-as-judge evaluation.","B":"Enable the default Instruction Adherence evaluation which natively uses LLM-as-judge.","C":"Create a custom evaluation with a tailored prompt outlining the framework's criteria."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-07","t":"Testing & monitoring"},{"n":8,"q":"Universal Containers is implementing a customer verification process for its service agent where sensitive account information can only be accessed after the customer passes identity verification. The Agentforce Specialist needs to ensure this security rule is enforced deterministically, preventing the large language model (LLM) from bypassing the verification requirement to execute the account lookup action. What should the specialist configure to manage this deterministic behavior?","o":{"A":"Configure a Prompt Defense policy in the Einstein Trust Layer to mask the sensitive account data from the reasoning engine until the user successfully completes the verification process.","B":"Store the user's verification status in a custom variable and apply an \"available when\" filter condition to the account lookup action, making the action invisible to the reasoning engine until the variable evaluates to true.","C":"Add explicit natural language instructions within the subagent (formerly known as a topic) definition instructing the large language model (LLM) to always prioritize the customer verification action before proceeding to the account lookup action."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-08","t":"Prompt Builder"},{"n":9,"q":"Universal Containers' agent must always look up the customer's account tier and open cases from Salesforce before deciding how to respond. Based on Agent Script flow of control, what is true about executing deterministic actions at the very start of a subagent (formerly known as a topic)?","o":{"A":"Actions can only be guaranteed to run by placing them in the config block.","B":"Only before_reasoning can guarantee the large language model (LLM) is invoked before an action runs.","C":"The first instruction in reasoning instructions always runs before the large language model (LLM) is invoked."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-09","t":"Agent Builder & actions"},{"n":10,"q":"Cloud Kicks (CK) recently finished the development of a new prompt template that uses its own large language model (LLM). CK is deploying a prompt template from a sandbox to a production org, and is receiving an error. When trying to deploy the change set, CK is getting an error related to the LLM used in the prompt template. What is the cause of the error?","o":{"A":"The prompt does not specify that it is a custom LLM.","B":"The name of the LLM does not match in sandbox and production.","C":"BYOLLM is not yet supported for prompt templates in production."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-10","t":"Deployment & security"},{"n":11,"q":"An Agentforce Specialist is testing an agent with Testing Center. The test results show that an agent correctly identifies the right subagent to handle an utterance, but it fails to select all necessary actions within that subagent. Which evaluation metric specifically identifies this failure?","o":{"A":"Action Assertion","B":"Response Evaluation","C":"Subagent Assertion"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-11","t":"Testing & monitoring"},{"n":12,"q":"Universal Containers (UC) has configured a data library and wants to restrict indexing of knowledge articles to articles which are only publicly available in their knowledge base. UC also wants the agent to link sources that the large language model (LLM) grounded its response on. Which settings should help UC with this?","o":{"A":"In the data library setting window, under Knowledge Settings, enable Use Public Knowledge Article and select Show sources.","B":"In the data library setting window, under Knowledge Settings, enable Use Public Knowledge Article. It is not possible to display articles that the LLM grounded its response in.","C":"Use Data Categories to categorize publicly available articles to index. Sources are automatically displayed when knowledge articles are categorized as Public."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-12","t":"Data, retrieval & Knowledge"},{"n":13,"q":"The compliance team at Universal Containers has determined that a specific customer service prompt must only process data through a secure, self-hosted Amazon Bedrock model and must be prevented from accessing the default OpenAI models. How should the Agentforce Specialist configure this specific model routing?","o":{"A":"Assign a permission set to the dedicated Agent User that restricts Read access to the default Salesforce large language model (LLM) metadata records.","B":"Configure a Data 360 Private Connect endpoint that automatically reroutes all Agentforce requests away from the default large language model (LLM) Gateway.","C":"Register the model as a BYOLLM in Einstein Studio, then explicitly select this model when configuring the prompt template."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-13","t":"Deployment & security"},{"n":14,"q":"Cloud Kicks wants its Agentforce Service Agent to retrieve up-to-date factual data from the internet. Which step must an Agentforce Specialist take to ensure the agent uses the web search capability properly?","o":{"A":"Enable the Answer Questions with Knowledge standard action specifically on the General FAQ subagent (formerly known as a topic).","B":"Map the web search retriever to a custom search index in Data 360 before activating the agent.","C":"Remove the default General FAQ subagent (formerly known as a topic) from the agent and replace its function with a new General Web Search topic."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-14","t":"Data, retrieval & Knowledge"},{"n":15,"q":"Universal Containers (UC) is scaling its Agentforce deployment and needs to securely connect its AI agents to a growing number of external enterprise data systems and local developer environments. Instead of building custom integration logic and bespoke Application Programming Interfaces (APIs) for each new data source, the Agentforce Specialist recommends leveraging the Model Context Protocol (MCP). What is the primary purpose of using an open standard like MCP in this scenario?","o":{"A":"To standardize the secure connection and delivery of context between the AI models and various local or remote data sources","B":"To replace the need for Retrieval-Augmented Generation (RAG) by storing all external data natively within the large language model (LLM) weights","C":"To allow the agent to autonomously negotiate task delegation with third-party supply chain agents"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-15","t":"Deployment & security"},{"n":16,"q":"An Agentforce Specialist at Universal Containers previously recommended removing superseded mortgage policy documents ingested into Data 360 to prevent the agent retrieving outdated terms. Legal has now confirmed that all historical versions must remain in the system simultaneously, as each version remains contractually binding for customers who signed under it. Which revised recommendation should the specialist make?","o":{"A":"Configure a custom retriever in AI Models (formerly Einstein Studio) with a dynamic filter on the policy version metadata field, populated at runtime from the customer's Contract record in CRM, ensuring retrieval is deterministically scoped to the document version applicable to that customer's agreement before similarity ranking is applied.","B":"Add the policy version identifier as a prepend field in the search index so every chunk is tagged with its applicable version at indexing time, enabling the large language model (LLM) to identify and select the correct version during response generation.","C":"Create a separate data stream for each policy version and configure the agent to query the appropriate unstructured data model object (UDMO) corresponding to the customer's contract date, isolating each version's vectors from the others."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-16","t":"Deployment & security"},{"n":17,"q":"Universal Containers (UC) wants to incorporate the current order fulfillment status into a prompt for a large language model (LLM). The order status is stored in the external enterprise resource planning (ERP) system. What is the most appropriate data grounding technique that UC should use?","o":{"A":"External Object Record merge fields","B":"Apex merge fields","C":"External Services merge fields"},"a":"A","orig":"A","status":"disputed","note":"Apex merge fields (B) also argued.","src":"SET2-17","t":"Prompt Builder"},{"n":18,"q":"An Agentforce Specialist is building a multistep onboarding workflow using agent actions. The workflow includes four sequential steps: account creation, profile setup, settings configuration, and finalization. After the create_account action executes successfully, the system must immediately send a verification email without requiring an additional user interaction. Which approach should the specialist use to ensure the verification email is automatically triggered after account creation?","o":{"A":"Use the keyword 'run' within the create_account action to chain the send_verification action as a follow-up.","B":"Add the send verification logic inside the procedural instructions so it executes before profile setup finishes.","C":"Configure the send_verification action to be available when account_created = True and wait for the agent to call it in the next step."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-18","t":"Deployment & security"},{"n":19,"q":"Before activating a custom agent action, an Agentforce Specialist would like to evaluate multiple real-world user utterances to ensure the action is being selected appropriately. Which tool should the Agentforce Specialist recommend?","o":{"A":"Testing Center","B":"Agentforce Builder","C":"Prompt Builder"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-19","t":"Testing & monitoring"},{"n":20,"q":"Universal Containers has deployed Agentforce to handle customer order tracking, returns, and loyalty support. The agent needs to balance conversational flexibility for customer inquiries with guaranteed execution of identity verification steps before accessing the account information. The development team is evaluating how to structure the agent's instruction pattern to meet both requirements. Which statement correctly describes hybrid reasoning in Agentforce Agent Script?","o":{"A":"Hybrid reasoning uses multiple large language model (LLM) models simultaneously, with one model handling conversational responses and another model executing deterministic business logic through Flow integration.","B":"Hybrid reasoning requires Canvas View for declarative instructions and Script View for procedural instructions, as each editor provides different capabilities for the respective instruction types.","C":"Hybrid reasoning combines declarative natural language instructions that allow large language model (LLM) interpretation with procedural instructions using the \"->\" prefix that enforce guaranteed execution order."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-20","t":"Deployment & security"},{"n":21,"q":"Universal Containers has built a Service Agent for its hospitality brand grounded on a knowledge data library containing 200 FAQ articles covering reservations, amenities, and cancellation policies. The project team estimates that manually authoring test cases to achieve adequate knowledge coverage would take 3 weeks. A junior administrator proposes that Testing Center can significantly accelerate this process. Which step should an Agentforce Specialist take to generate a comprehensive initial test suite without manual authoring of individual test cases?","o":{"A":"Upload test cases","B":"Generate test cases based on the knowledge available to the agent","C":"Generate test cases based on subagent (formerly known as a topic) and actions"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-21","t":"Testing & monitoring"},{"n":22,"q":"An Agentforce Specialist is working declaratively on version 4 of a prompt template which is significantly different than the previous version 3. A bug is then identified in version 3 and requires a hotfix to be deployed to production immediately by another team. The team will deploy this change as a new version. What should the specialist do to ensure that their work on the latest version is not lost and does not conflict with the new version?","o":{"A":"Create a new prompt template with the bug fix, update all references to the new version, and delete the old prompt template.","B":"Save their work in version 4, and allow the template to be deployed with a new version 5 containing the fix.","C":"Copy and paste version 4 into a backup file or version-control alternative, and allow the other team to overwrite the contents of version 4 with the bug-fixed version."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-22","t":"Deployment & security"},{"n":23,"q":"Cloud Kicks has long, complex legal agreements. An Agentforce agent must be able to retrieve specific clauses that are often nested within larger sections. The standard chunking method is failing to capture the full context of these clauses. Which chunking strategy should an administrator use to preserve the structure of the documents?","o":{"A":"Implement a smaller chunk size.","B":"Implement a larger chunk size.","C":"Implement a keyword-based chunking strategy."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-23","t":"Data, retrieval & Knowledge"},{"n":24,"q":"An Agentforce Specialist is setting up Salesforce Knowledge as the data source for a Data Library and must select \"Identifying Fields\" to help Agentforce locate the right information. The Knowledge article contents are rich, detailed, and quite long. What should the Agentforce Specialist use as Identifying Fields?","o":{"A":"The main contents of the article to ensure the most relevant article is used","B":"Any text or text area fields that provide a concise summary of the article","C":"Any standard or custom formula field that contains a suitable concatenated key"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-24","t":"Data, retrieval & Knowledge"},{"n":25,"q":"Universal Containers (UC) has built a custom retriever in AI Models (formerly Einstein Studio) to ground AI responses with technical documentation. UC now requires that a summary field from the search index be included in the output to provide a brief overview of each retrieved document. What is the recommended course of action for UC?","o":{"A":"Create a completely new custom retriever with an entirely revised configuration that incorporates the summary field, and delete the current retriever. Editing the existing retriever is not possible.","B":"Edit the existing retriever version to add the summary field to the list of fields returned by the retriever, save the changes, and activate the new version so that prompt templates use the updated configuration.","C":"Use only the default retriever, which will automatically include all available fields from the search index, including the summary field, without any need to create or manage custom retrievers."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-25","t":"Prompt Builder"},{"n":26,"q":"An Agentforce Specialist is trying to troubleshoot a reported issue from an end user and they do not see the session in the Processed Sessions tab of Agentforce Observability. What should the specialist take into consideration?","o":{"A":"The agent has not yet been registered in the Observability app so no sessions are processed.","B":"The session is queued to be processed and can be viewed on the Unprocessed Sessions tab.","C":"Sessions are batched on a 24-hour rolling process and the logs must be checked again the next day."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-26","t":"General"},{"n":27,"q":"Universal Containers is designing an agent to assist with order management and dealer support automation. The agent must verify a dealer's credentials before granting access to order details. The team has already: - Declared a variable is_verified to track verification status - Configured an action that verifies the dealer's credentials. They plan to restrict access to the order details subagent (formerly known as a topic) using a guard condition based on is_verified. What must the team do to ensure the order details subagent becomes available only after a dealer is successfully verified?","o":{"A":"Add an available when: @variables.is_verified == true condition to the order details subagent.","B":"Declare the is_verified variable as immutable so it cannot be modified during the session.","C":"Update the is_verified variable to true after the verification action succeeds using @utils.setVariables."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-27","t":"Agent Builder & actions"},{"n":28,"q":"Universal Containers is implementing a Retrieval Augmented Generation (RAG) solution where the knowledge store contains Spanish articles, but users will query the agent in French and English. The Agentforce Specialist needs to ensure the retriever can accurately find relevant articles despite the language differences. What should the specialist do to meet this requirement?","o":{"A":"Use the multilingual-e5-large embedding model for French and Spanish language users.","B":"Use the multilingual-e5-large embedding model for French and English language users.","C":"Use the multilingual-e5-large embedding model to handle all languages."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-28","t":"Data, retrieval & Knowledge"},{"n":29,"q":"Universal Containers (UC) recently attended a major trade show and received thousands of new leads from event badge scans. UC is struggling to follow up with each lead in a timely, personalized way. Leadership wants to: • Qualify and nurture leads 24/7. • Provide accurate answers to prospect questions. • Automatically book meetings with qualified prospects. • Free up reps to focus on building relationships and closing deals. Which Agentforce capability should UC implement to meet these goals?","o":{"A":"SDR Agent","B":"Sales Coach","C":"Commerce Agent"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-29","t":"Agent types & channels"},{"n":30,"q":"Universal Containers (UC) wants to create a prompt template that consistently extracts a customer's specific product model number and quantity from an email inquiry to draft a response back to the customer. Which best practice should UC implement to achieve this goal?","o":{"A":"Provide clear, positive instructions and use few-shot examples.","B":"Incorporate open-ended questions to encourage detailed responses.","C":"Use a high temperature setting to increase creative output."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-30","t":"Prompt Builder"},{"n":31,"q":"An Agentforce Specialist is creating a prompt template to assist support reps in drafting responses to customer complaints. To ensure the responses are empathetic and helpful, what is a key element to include in the prompt template?","o":{"A":"A direct instruction to the large language model (LLM) to role-play as a character","B":"A list of keywords related to customer complaints","C":"The entire history of the customer's previous interactions with the company"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-31","t":"Prompt Builder"},{"n":32,"q":"A customer wants to analyze complete agent interactions, from the initial user request through to the final resolution, to better understand agent behavior and response quality. Which Agentforce feature should an Agentforce Specialist recommend?","o":{"A":"Agent Inspection","B":"Agent Insights","C":"Agent Optimization"},"a":"A","orig":"A","status":"disputed","note":"No feature called Agent Inspection found; Agent Optimization (C) also argued.","src":"SET2-32","t":"Agent Builder & actions"},{"n":33,"q":"Universal Containers has been building an agent using Canvas. It has created an \"Issue Refund\" action. Business rules dictate that refunds can only be issued if the customer's Account_Tier is \"Platinum\". Currently, the agent relies on its system instructions to check the tier, but it occasionally hallucinates authorization and attempts to call the refund action for Standard customers, resulting in backend errors. How should the Agentforce Specialist use filters to deterministically ensure the agent cannot process the \"Issue Refund\" action unless the customer meets the criteria?","o":{"A":"Update the agent's system instructions with a strict rule to manually filter out any refund requests if the customer's account tier is not Platinum.","B":"Apply a text filter to the Agent Session that automatically blocks the word 'refund' from the user's prompt unless they are a Platinum customer.","C":"Configure an Action Condition filter on the \"Issue Refund\" action so that it is only available to the agent when Account Tier equals \"Platinum\"."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-33","t":"Agent Builder & actions"},{"n":34,"q":"Universal Containers (UC) is tracking web activities in Data Cloud for a unified contact. It wants to use that information in a prompt template to help extract insights from the data. Assuming that the Contact object is one of the objects associated with the prompt template, what is a valid way for UC to do this?","o":{"A":"Create a prompt template that takes a list of all Data Cloud activity records as input to pass to the large language model (LLM).","B":"Call the prompt directly from Data Cloud with a web tracking activity included in the prompt definition.","C":"Add the activity records as an enrichment related list to the Contact, then pass the Contact into a prompt template workspace using related list grounding."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-34","t":"Prompt Builder"},{"n":35,"q":"When configuring a file upload based data library, what are the maximum allowed file sizes for text/HTML files and PDF files, respectively?","o":{"A":"Up to 4 MB for text/HTML files and up to 100 MB for PDF files","B":"Up to 50 MB for both text/HTML files and PDF files","C":"Up to 100 MB for text/HTML files and up to 4 MB for PDF files"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-35","t":"Data, retrieval & Knowledge"},{"n":36,"q":"A customer is authenticated and identified as being either bronze, silver, or gold membership level. Those levels define which subagents or actions are available to the agent to perform specific tasks as per the level-based entitlements. What is the best way to ensure the agent responds appropriately?","o":{"A":"Use before_reasoning to set custom variables that will be used in filters and flow logic.","B":"Use after_reasoning to set custom variables that will be used in filters and flow logic.","C":"Use Agent Router to set custom variables that will be used in filters and flow logic."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-36","t":"Agent Builder & actions"},{"n":37,"q":"Which feature in the Trust Layer helps to minimize the risks of jailbreaking and prompt injection attacks?","o":{"A":"Data Masking","B":"Prompt Defense","C":"Secure Data Retrieval and Grounding"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-37","t":"Prompt Builder"},{"n":38,"q":"An Agentforce Specialist at Cloud Kicks wants to build a retrieval augmented generation (RAG) powered agent grounded in text-based PDF documents. The specialist wants a quickstart approach that automatically generates all underlying components, including the vector data store, search index, retriever, and standard action. Which feature should the specialist use?","o":{"A":"Ensemble Retriever","B":"Agentforce Data Library","C":"Search Index"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-38","t":"Data, retrieval & Knowledge"},{"n":39,"q":"Universal Containers operates in a regulated industry and must maintain a complete, turn-by-turn audit trail of every agent interaction. Which Agentforce feature provides full visibility into reasoning engine executions, actions, inputs, outputs, and error messages across an entire agent conversation?","o":{"A":"Agentforce Session Tracing","B":"Agentforce Optimization","C":"Utterance Analysis"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-39","t":"Testing & monitoring"},{"n":40,"q":"Universal Containers operates in a regulated industry and has deployed an Agentforce customer service agent handling thousands of interactions per week. The operations team notices that a significant number of conversations are resulting in unexpected escalations, but cannot identify which agent subagents (formerly known as topics) or actions are consistently underperforming or misconfigured. Which Agentforce feature allows the team to cluster interaction patterns, identify performance gaps across sessions, and apply quality scoring to pinpoint where the agent's configuration needs improvement?","o":{"A":"Agentforce Optimization","B":"Agentforce Health Monitoring","C":"Agentforce Session Tracing"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-40","t":"Testing & monitoring"},{"n":41,"q":"Universal Containers (UC) wants to ground a new prompt template with the User related list. What should UC consider?","o":{"A":"The User related list is not supported in prompt templates.","B":"The User related list should have View All access.","C":"The User related list needs to be included on the record page."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-41","t":"Prompt Builder"},{"n":42,"q":"Universal Containers is developing an Agentforce Service Agent to handle a complex, multi-step customer onboarding process. To better organize the conversational logic, the Agentforce Specialist splits the process across two distinct subagents and places the setup configuration for the second step inside the before_reasoning block of the new subagent. During testing, when the agent transitions to this new subagent mid-conversation, the conversation occasionally stalls or behaves unexpectedly. What is the risk the Agentforce Specialist must consider regarding the execution timing of before_reasoning?","o":{"A":"The before_reasoning block will only run once and sets the immutable variables.","B":"The before_reasoning block runs at the start of the next turn after a transition.","C":"The before_reasoning block only runs on the very first turn after the agent launches."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-42","t":"Testing & monitoring"},{"n":43,"q":"When a verified customer in a help center says, \"I want to upgrade my service plan,\" an AI agent needs to complete the following tasks: • Verify identity and entitlement. • Create a new quote. • Calculate a prorated upgrade amount. • Escalate to an Account Executive (AE) only if the reorder exceeds US $25,000. Which type of agent should an Agentforce Specialist build to support this use case?","o":{"A":"Service Agent to resolve the case end-to-end and create a new opportunity for the sales team","B":"Sales Agent to handle the upsell and large-deal escalation","C":"Employee Agent to orchestrate internal logistics and finance"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-43","t":"Agent types & channels"},{"n":44,"q":"Universal Containers (UC) plans to automatically populate the Description field on the Account object. Which type of prompt template should UC use?","o":{"A":"Sales Email","B":"Flex","C":"Field Generation"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-44","t":"Prompt Builder"},{"n":45,"q":"Universal Containers recently deployed a customer service agent to handle common inquiries. After a month of usage, the support manager wants to analyze the agent's performance. They need to view aggregated metrics, such as the escalation rate to human agents, average session duration, and which topics have the lowest resolution scores, so they can prioritize which agent actions need optimization. Which native Salesforce capability should the Agentforce Specialist use to provide these insights and guide the optimization strategy?","o":{"A":"Agentforce Observability, leveraging Agent Analytics dashboards and the Session Tracing Data Model to review aggregate performance and drill into specific underperforming interactions","B":"The Einstein Trust Layer Audit Trail, exporting the raw JSON logs to measure the token usage and temperature settings of every user session","C":"The Salesforce Optimization report, scheduling a monthly scan to identify deprecated subagents (formerly known as topics) and unused agent actions across the org"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-45","t":"Testing & monitoring"},{"n":46,"q":"Coral Cloud Resorts wants to cover a broad range of user phrasing when testing its FAQ agent. Which Testing Center feature meets that need?","o":{"A":"Relying on live customer logs to capture phrasing diversity after deployment","B":"Uploading only a small set of manually written prompts","C":"AI-generated synthetic test utterances based on natural language variations"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-46","t":"Testing & monitoring"},{"n":47,"q":"During retrieval augmented generation (RAG) quality testing, an Agentforce Specialist notices that tabular information from a custom Data 360 Document Ingestion Pipeline is losing its context because the data is scattered across multiple separate chunks. What is the most appropriate approach to resolve this?","o":{"A":"Change the search index's parser from the default to Docling.","B":"Use an ensemble retriever to stitch multiple chunks back together dynamically.","C":"Switch the search index configuration to use only keyword search scoring."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-47","t":"Testing & monitoring"},{"n":48,"q":"Universal Containers is configuring a customer service agent and needs to restrict a specific \"Process Refund\" action so that it is only visible to the reasoning engine when a customer's account is flagged as active. An Agentforce Specialist is writing the available when clause in Agent Script to evaluate the @variables.isActive variable. Which operator should the Agentforce Specialist use for this condition?","o":{"A":"The Agentforce Specialist must use the == operator; Agent Script uses == strictly for comparison in conditionals.","B":"Both = and == are valid and interchangeable; the Agentforce Specialist can use either operator to evaluate conditional logic in Agent Script.","C":"The Agentforce Specialist must use the = operator; Agent Script uses = for both variable assignment and condition comparison."},"a":"A","orig":"C","status":"corrected","note":"Agent Script uses == for comparisons.","src":"SET2-48","t":"Agent types & channels"},{"n":49,"q":"The sales team at a hotel resort would like to generate a guest summary about the guests' interests and provide recommendations based on their activity preferences captured in each guest profile. They want the summary to be available only on the contact record page. Which AI capability should the team use?","o":{"A":"Model Builder","B":"Prompt Builder","C":"Agent Builder"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-49","t":"Deployment & security"},{"n":50,"q":"Universal Containers is deploying a new customer service agent using Agent Script. The Agentforce Specialist needs to update conversational state, navigate between different subagents (formerly known as topics), and hand off conversations to a human agent when necessary. To minimize technical debt, the Agentforce Specialist wants to implement these capabilities without building any custom backend code. Which statement correctly describes how the Agentforce Specialist can implement these specific requirements?","o":{"A":"The Agentforce Specialist can use @utils.setVariables, @utils.transition, and @utils.escalate directly.","B":"The Agentforce Specialist can use most utilities directly, but @utils.escalate requires a custom Apex class to define the escalation queue.","C":"The Agentforce Specialist can use most utilities out of the box, but @utils.transition requires a flow to define the target subagent at runtime."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-50","t":"Deployment & security"},{"n":51,"q":"Cloud Kicks (CK) is launching a new partner portal on Experience Cloud. CK wants to provide partners with an agent that can answer questions about product specifications from the knowledge base and allow them to submit a new Lead for a potential customer they've identified. The agent must be accessible only to authenticated partner users on the portal. Which agent type is required to meet this scenario?","o":{"A":"Sales Agent","B":"Commerce Agent","C":"Service Agent"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-51","t":"Data, retrieval & Knowledge"},{"n":52,"q":"Universal Containers (UC) has a Flex prompt template that has been used for the last 3 months to answer questions based on user input. Now, UC wants to give a PDF as a second input. What is the best approach for the Agentforce Specialist to meet this requirement?","o":{"A":"Reindex in order to add a new resource to an existing template.","B":"Add a Resource anytime by navigating to the Resources section and configuring inputs.","C":"Discard the current Flex template and create a new one with a resource."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-52","t":"Prompt Builder"},{"n":53,"q":"An Agentforce Specialist deployed a Service Agent to an Experience Cloud site and enabled Credential-Based User Verification. The specialist notices that all Data Manipulation Language (DML) record updates are showing the \"LastModifiedUser\" as the authenticated Community User instead of the Agent User. What should the specialist explain to the business about the effect on audit fields?","o":{"A":"Credential-Based User Verification has been enabled, which in turn respects all of the sharing and field-level security.","B":"The Flow execution mode for the agent is set to 'System Context Without Sharing'.","C":"Token-Based User Verification has been enabled, which in turn respects all of the sharing and field-level security."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-53","t":"Testing & monitoring"},{"n":54,"q":"Universal Containers is deploying two agents simultaneously: an internal Sales Productivity Agent for employees and a customer-facing Service Agent on its Experience Cloud site. An Agentforce Specialist is configuring permissions and needs to understand the correct security context for each. Which statement accurately describes the execution model?","o":{"A":"The customer-facing Service Agent inherits the security context of the Experience Cloud site's guest user profile by default, requiring guest profile object permissions to be configured for all actions the agent executes.","B":"The internal Sales Productivity Agent executes actions using the authenticated Salesforce employee's own permissions, while the customer-facing Service Agent executes actions as a dedicated Einstein Service Agent User with its own permission set.","C":"Both the internal Sales Productivity Agent and the customer-facing Service Agent execute actions as a dedicated Einstein Service Agent User with its own permission set that is configured as required for the agent."},"a":"C","orig":"C","status":"disputed","note":"Running as the logged-in user (B) also argued.","src":"SET2-54","t":"Deployment & security"},{"n":55,"q":"Universal Containers has configured an agent to handle customer return requests. When a customer initiates a return, the agent must calculate a specific restocking fee. The agent needs to quote this exact fee to the customer and then reuse that same fee amount when summarizing the final refund. The Agentforce Specialist needs to ensure the agent uses deterministic logic to calculate the fee and consistently reuses the exact same value without guessing or hallucinating. How should the specialist configure the agent to achieve this behavior?","o":{"A":"Define a context variable for the fee. Execute a flow as an agent action to calculate the fee, assign the flow's output to that context variable, and have the agent reference that variable in its responses.","B":"Execute a flow as an agent action to calculate the fee, and make the flow's output directly available to the agent response. The agent will be able to continue to use this value from memory.","C":"Provide the mathematical formula for the restocking fee in the agent's system instructions and instruct it to remember the result for reuse."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-55","t":"Agent Builder & actions"},{"n":56,"q":"The support team at Coral Cloud Resorts needs to create a Flex prompt template that summarizes complex case histories for agent handoffs. The goal is to ensure summaries are concise and follow a specific three-part structure: Issue, Steps Taken, and Next Action. What should an Agentforce Specialist recommend to ensure consistent data output?","o":{"A":"Use chain-of-thought reasoning.","B":"Define the desired output structure with explicit headings in the instruction.","C":"Use a prompt template-triggered flow to format responses."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-56","t":"Prompt Builder"},{"n":57,"q":"Universal Containers has seen a high adoption rate of a new feature that uses generative AI to populate a summary field of a custom object, Competitor Analysis. All sales users have the same profile but one user cannot see the generative AI-enabled field icon next to the summary field. What is the most likely cause of the issue?","o":{"A":"The user does not have the field Generative AI User permission set assigned.","B":"The prompt template associated with summary field is not activated for that user.","C":"The user does not have the Prompt Template User permission set assigned."},"a":"A","orig":"A","status":"corrected","note":"Sparkle icon needs Prompt Template User.","src":"SET2-57","t":"Deployment & security"},{"n":58,"q":"What is the correct process to leverage Prompt Builder in a Salesforce org?","o":{"A":"Select the appropriate prompt template type to use, develop the prompt within the prompt workspace, select resources to dynamically insert CRM-derived grounding data, pick the model to use, and test and validate the generated responses.","B":"Enable the target object for generative prompting, develop the prompt within the prompt workspace, select records to fine-tune and ground the response, enable the Trust Layer, and associate the prompt to an action.","C":"Select the appropriate prompt template type to use, select one of Salesforce's standard prompts, determine the object to associate the prompt, select a record to validate against, and associate the prompt to an action."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-58","t":"Prompt Builder"},{"n":59,"q":"An administrator at Universal Containers has successfully deployed a new agent from a sandbox to production using a change set. The agent uses a prompt template that invokes a Salesforce flow to perform a complex calculation. In production, when users interact with the agent, it fails with an error message every time the flow is supposed to run. The flow was included in the change set and is present in production. What is the most likely cause of this issue?","o":{"A":"The change set did not include the dependent Apex classes for the flow.","B":"The flow was not manually activated in the production org after the deployment.","C":"The user in production does not have permission to run the flow."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-59","t":"Deployment & security"},{"n":60,"q":"Global Finance Corp (GFC) is expanding its Agentforce rollout from a basic customer service agent to a suite of specialized agents handling Fraud Detection, Loan Origination, and Billing. GFC operates entirely within a single, global Salesforce instance. The CIO wants to ensure that as the number of specialized agents scales, the company maintains strict, centralized control over security guardrails and user context, ensuring customers do not have to repeat themselves when their request spans multiple departments. What is a reasonable architectural approach to achieve this level of scalability and control?","o":{"A":"Implement a Multi-Org, Multi-Agent (MOMA) architecture connected via the Agent-to-Agent (A2A) protocol to safely isolate each department's agent.","B":"Deploy a Single-Org, Multi-Agent (SOMA) architecture using a primary Orchestrator agent to manage shared context natively and route sub-tasks to the specialized agents.","C":"Use the Model Context Protocol (MCP) to federate multiple external, third-party agents directly into the existing Agentforce Service console."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-60","t":"Deployment & security"},{"n":61,"q":"Universal Containers (UC) uses an agent to handle customer service inquiries. UC recently partnered with an external logistics provider that operates its own distinct, autonomous AI agent. When a customer requests a complex international shipping reroute, the UC agent needs to securely communicate, negotiate routing terms, and delegate the execution of the reroute directly to the logistics provider's AI agent. Which open standard multi-agent protocol is specifically designed to facilitate this autonomous task delegation and negotiation between independent AI agents?","o":{"A":"Agent-to-Agent (A2A) Protocol","B":"Model Context Protocol (MCP)","C":"OpenAPI Specification (OAS)"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-61","t":"Agent types & channels"},{"n":62,"q":"Cloud Kicks wants to integrate its agent with its custom website. The goal is for customers to interact with the custom agent chat interface. Which approach provides the framework for the custom web application to communicate with the agent?","o":{"A":"Agent API","B":"Model Context Protocol (MCP)","C":"Agent to Agent (A2A)"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-62","t":"Agent types & channels"},{"n":63,"q":"Universal Containers is building an Agentforce Service Agent to handle order cancellations. The Agentforce Specialist needs to ensure that a critical \"Check Cancellation Eligibility\" action is executed deterministically on every relevant turn, without relying on the reasoning engine's discretion to choose the tool. During a code review, a junior developer asks why the Agentforce Specialist called the action using the run @actions.name command instead of simply listing the action under the reasoning.actions: block. What must the Agentforce Specialist explain regarding the difference between these two invocation methods?","o":{"A":"Both patterns execute the action on every turn automatically; the difference is purely syntactic, as the run command is simply the newer notation for Agent Script.","B":"The run command is only valid when nested inside reasoning.actions: blocks to pass parameters; the Agentforce Specialist must list it under reasoning.actions: for the large language model (LLM) to access it.","C":"Listing an action under reasoning.actions: makes it a subjective tool that the large language model (LLM) decides whether to call; calling it with the run command forces guaranteed execution every time."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-63","t":"Agent types & channels"},{"n":64,"q":"Universal Containers (UC) wants to deploy an Agentforce Service Agent to support customers via a web experience. UC uses a Digital Experience site and wants to enable messaging for logged in users. The customer needs to pass the membership number to the agent for which a pre chat variable is available. What is a required step to connect the agent to the Digital Experience site using Messaging for In-App and Web?","o":{"A":"Configure MuleSoft to establish a secure API tunnel between the agent and the Digital Experience site.","B":"Configure a messaging Lightning web component using standard or custom Lightning Type for Agentforce.","C":"Create an Omni-Channel flow that routes messages to the agent."},"a":"B","orig":"B","status":"disputed","note":"Two other question sets also say B; Omni-Channel flow (C) also argued.","src":"SET2-64","t":"Deployment & security"},{"n":65,"q":"Universal Containers (UC) is implementing an Agentforce Service Agent to assist customers. The agent must be able to retrieve information from proprietary policy documents stored as PDFs and ensure its responses are grounded exclusively in this approved company data, rather than generic large language model (LLM) knowledge. The project team requires the fastest and least complex setup possible, minimizing manual configuration of backend data components. Which approach should the Agentforce Specialist take to satisfy these requirements?","o":{"A":"Upload the PDF to Salesforce Files and configure the agent's Topic Instructions to dynamically read the files at run time.","B":"Manually upload the PDFs into Data 360 as Unstructured Data Model Object (UDMO) type and select the create a new Agentforce Data Library mapping option.","C":"Create an Agentforce Data Library (ADL) and upload the PDF policy documents directly to the library."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-65","t":"Data, retrieval & Knowledge"},{"n":66,"q":"Universal Containers wants to systematically validate agent responses before deployment using a scalable testing process. Which Testing Center approach should the company implement?","o":{"A":"Manually interact with the agent in Builder until responses seem correct.","B":"Use pilot users in production to flag incorrect responses post launch.","C":"Upload a structured CSV test template and run batch test cases in Testing Center."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-01","t":"Testing & monitoring"},{"n":67,"q":"Universal Containers is building a custom agent and creating a new Apex action that accepts a collection of text values (such as a list of product names) as an input parameter. The Agentforce Specialist is configuring the action's metadata in Agentforce Assets and needs to properly map this input so the reasoning engine can pass the list of strings correctly. When defining this input, which complex_data_type_name should the Agentforce Specialist use?","o":{"A":"lightning__stringType","B":"apex__String","C":"lightning__textType"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET3-03","t":"Deployment & security"},{"n":68,"q":"An Agentforce Specialist is preparing to upload several PDF policy documents to a new file-based Agentforce Data Library. To leverage advanced processing with Intelligent Context, how should the Agentforce Specialist proceed?","o":{"A":"Upload up to five PDFs that are 100 MB or less to allow the system to evaluate the optimal indexing configuration.","B":"Upload up to five PDFs that are 10 MB or less to allow the system to evaluate the optimal indexing configuration.","C":"Manually enable Intelligent Context in Data 360 prior to uploading the PDF files."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-04","t":"Data, retrieval & Knowledge"},{"n":69,"q":"Universal Containers operates a customer self-service portal supported by an Agentforce Service Agent. The compliance team maintains a Salesforce Knowledge base of published product compliance guidelines, service terms, and regulatory procedures, updated regularly by subject matter experts. What is the most efficient approach to ensure the agent retrieves only current published content using semantic understanding of customer questions, and that outdated articles are never surfaced?","o":{"A":"Build a subagent action (formerly known as a topic action) using a Salesforce flow to query the Knowledge articles data model object (DMO) at runtime and return matching content to the agent, ensuring the agent always retrieves live article data directly from the Knowledge object when responding to customer questions.","B":"Create an Agentforce Data Library connected to the Salesforce Knowledge base, filtered to published articles only, enabling the agent to ground responses using retrieval-augmented generation (RAG) powered semantic retrieval that automatically reflects Knowledge updates without requiring agent reconfiguration.","C":"Configure a custom retriever in Einstein Studio connected to a Data 360 search index, applying filters to restrict…"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-05","t":"Data, retrieval & Knowledge"},{"n":70,"q":"Universal Containers (UC) has deployed several specialized Agentforce Employee Agents, such as IT Support, HR Assistant, and Procurement, to assist with internal tasks. Recently, UC's help desk has reported a high volume of failed interactions because employees are frequently selecting the incorrect agent to handle their requests (for example, asking the HR Assistant agent to reset a network password). UC wants to improve the user experience, scale their deployment, and centralize control without requiring employees to guess which agent to use. Which architectural approach should the Agentforce Specialist recommend to resolve this issue?","o":{"A":"Create a custom validation rule on the Agent Session object to prevent users from submitting prompts that do not match the selected agent's system instructions.","B":"Implement a Single Org Multi-Agent (SOMA) to act as a unified, central entry point that interprets user intent and routes the request to the appropriate specialized capabilities.","C":"Deploy a standalone Multi-Agent architecture where each specialized agent prompts the user to verify their specific department and role before proceeding with the conversation."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-07","t":"Deployment & security"},{"n":71,"q":"Universal Containers needs to ground a new Agentforce agent with structured data stored in an external system without duplicating it in Data 360. This approach is necessary to ensure real-time data accuracy and minimize storage costs. Which Data 360 concept should the team use to accomplish this?","o":{"A":"Establish a semantic index for external content.","B":"Utilize Zero Copy to access external data without ingestion.","C":"Configure a data stream to import the data into Data 360."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-08","t":"Data, retrieval & Knowledge"},{"n":72,"q":"What happens when a chunk of text is vectorized?","o":{"A":"It creates numerical representations of chunk content to enable meaning-based retrieval.","B":"It encrypts the content so it can be stored securely within Data 360 data spaces.","C":"It reduces the file size of the original document to reduce Data 360 costs."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-09","t":"Data, retrieval & Knowledge"},{"n":73,"q":"A service manager wants to use Salesforce Prompt Builder to help agents summarize customer case notes after a support call. The summary should: • Capture the customer's issue, troubleshooting steps taken, and next actions. • Be no longer than five sentences. • Use plain language (no technical jargon). • If no next action is identified, the summary should explicitly state \"No next action required.\" Which prompt template follows Salesforce prompt design best practices?","o":{"A":"Role: You are an experienced support agent. Task: Summarize the case notes. Context: Include customer issue, troubleshooting steps, and next actions. Constraints: Limit to 5 sentences, use plain language, and if no next action is found, state \"No next action required.\" Format: Use numbered sentences for clarity.","B":"Task: Provide a professional summary of the issue and troubleshooting steps. Context: Include customer issue, steps taken, and next actions if available. Constraints: No strict sentence limit, but use plain language. If no next action is found, leave it out. Format: Use paragraphs for readability.","C":"Context: Include customer issue, steps taken, and next actions if available. Constraints: No strict sentence limit, but use plain language. If no next action is found, leave it out. Format: Use paragraphs for readability. Role: You are a case documentation assistant. Task: Write a summary of the support call.","D":"Context: Always describe the customer issue, troubleshooting, and resolution details. Constraints: The summary should be comprehensive and professional, but there is no limit on length or language style. Format: Use complete sentences in a narrative style."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-10","t":"Prompt Builder"},{"n":74,"q":"Universal Containers' Agentforce Service Agent has been live for 4 weeks. Agent Optimization in Agentforce Observability shows the main support intent cluster scoring low quality, with score reasons citing ambiguous subagent match. The Session Trace confirms the reasoning engine is consistently selecting the wrong subagent on most turns. What is the most viable solution to resolve the issue?","o":{"A":"Refine the classification descriptions and scope of the competing subagents to eliminate the semantic overlap that is causing the reasoning engine to misroute.","B":"Use the intent cluster data from Agent Optimization to identify the most frequently misrouted intents and add new subagents with tightly scoped classification descriptions for each.","C":"Extend the agent's data library with additional knowledge articles covering the misrouted intent scenarios identified in Agent Optimization."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET3-11","t":"Data, retrieval & Knowledge"},{"n":75,"q":"A company needs to ensure customers always receive answers based on the most current version of support documentation. What should an Agentforce Specialist recommend?","o":{"A":"Use a file-based Agentforce Data Library (ADL) and enable the version management setting to ensure the agent always retrieves the latest document.","B":"Use a knowledge-based Agentforce Data Library (ADL); knowledge articles have native versioning built in, so agents automatically retrieve the current published version.","C":"Use either Agentforce Data Library (ADL) type; both automatically serve the most recent content once the search index rebuilds."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-12","t":"Data, retrieval & Knowledge"},{"n":76,"q":"Which element should an Agentforce Specialist use in an Omni-Flow to route conversations to an agent?","o":{"A":"Route Conversation","B":"Route Work","C":"Route to Agent"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET3-13","t":"General"},{"n":77,"q":"In a knowledge-based data library, which capability does enabling the \"Filter by Knowledge Data Categories\" option provide?","o":{"A":"It applies custom metadata from the selected data categories to the knowledge articles, aiming to enhance search relevance.","B":"It organizes the indexed knowledge articles into separate sections based on their assigned data categories.","C":"It limits the
