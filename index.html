search index, thereby enhancing the relevancy of the content returned.","C":"Filters reformat and aggregate multiple documents into a single summary output to streamline and unify retriever output for more efficient and accurate AI grounding."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":110,"q":"Universal Containers is setting up the data library configuration within the Agentforce Builder. What is true regarding Agentforce Data Libraries?","o":{"A":"An agent can have only one data library assigned to it.","B":"Each data category can only have one data library.","C":"Only data library owners can assign it to the agent."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":111,"q":"Universal Containers (UC) needs to capture and store detailed interaction data for all agents. Which feature should help UC get a full view of the agent's behavior from start to finish, including reasoning engine executions, actions, prompt and gateway inputs/outputs, error messages, and final responses?","o":{"A":"Utterance Analysis","B":"Agentforce Session Tracing","C":"Agentforce Analytics"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":112,"q":"Universal Containers wants to keep retrieval accurate as product documentation changes frequently. Which approach should the company implement?","o":{"A":"Rebuild the search index.","B":"Manually delete the stale data chunks.","C":"Leave embeddings unchanged even if content is updated."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":113,"q":"Universal Containers (UC) is preparing and defining success criteria for Agentforce Testing Center test cases. Which details should UC specify as the expected output to ensure the tests accurately reflect the agent's functionality?","o":{"A":"Expected Topic API Name","B":"Expected Flow API Name","C":"Expected Prompt Template Name"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":114,"q":"An Agentforce Specialist at Universal Containers (UC) is building with no-code tools only. They have many small accounts that are only touched periodically by a specialized sales team, and UC wants to maximize the sales operations team's time. UC wants to help prep the sales team for calls by: Summarizing past purchases Displaying products the contact has shown interest in (with data captured via Data Cloud) Providing a recap of past email and phone conversations that have transcripts Which approach should the Agentforce Specialist recommend to achieve this goal?","o":{"A":"Deploy UC's own custom foundational model on this data first.","B":"Use a prompt template grounded on CRM and Data Cloud data using standard foundation models.","C":"Fine tune the standard foundational model due to the complexity of the data."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":115,"q":"Universal Containers (UC) wants to ensure its compliance team can retrieve exact matches of policy clause numbers from a structured legal document library. Which search type should UC implement?","o":{"A":"Use hybrid search to blend keyword and semantic recall.","B":"Use keyword search for exact term matching on structured fields like clause numbers.","C":"Use semantic search to interpret synonyms of clauses dynamically."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":116,"q":"A company wants to retrieve patient history details to augment the AI agent response. The company wants to leverage the Data Cloud search index feature. What is best practice when considering retrieval-augmented generation (RAG) for information that may contain personally identifiable information (PII)?","o":{"A":"Mask sensitive fields and index only non-PII data.","B":"Depend on the agent's prompt to avoid exposing PII.","C":"Encrypt embeddings, but still index PII records."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":117,"q":"Sales reps at Universal Containers should not be able to create or edit prompt templates. Which permission set should an Agentforce Specialist assign to the sales reps?","o":{"A":"Prompt Template User","B":"Prompt Template Manager","C":"Prompt Execute User"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":118,"q":"Universal Containers' service team wants to customize the standard case summary response from Agentforce. What should the Agentforce Specialist do to achieve this?","o":{"A":"Customize the standard Record Summary template for the Case object.","B":"Create a custom Record Summary prompt template for the Case object.","C":"Summarize the Case with a standard agent action."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":119,"q":"Universal Containers (UC) has a new AI project. What should UC consider when adding a related list on the Account object to be used in the prompt template?","o":{"A":"The fields for the related list are based on the default page layout of the Account for the current user.","B":"After selecting a related list from the Account, use the field picker to choose merge fields in Prompt Builder.","C":"Prompt Builder must be used to assign the fields from the related list as a JSON format."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":120,"q":"Universal Containers deploys a new Agentforce Service Agent into the company's website but is getting feedback that the Service Agent is not providing answers to customer questions that are found in the company's Salesforce Knowledge articles. What is the likely issue?","o":{"A":"The Agentforce Service Agent user needs to be created under the standard Agent Knowledge profile.","B":"The Agentforce Service Agent user was not given the Allow View Knowledge permission set.","C":"The Agentforce Service Agent user is not assigned the correct Agent Type License."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":121,"q":"An Agentforce Specialist is building a Flex prompt template. Which best practice should the Agentforce Specialist follow when creating the Flex prompt template?","o":{"A":"Provide the large language model (LLM) with contextual information and give it a role such as a sales or support rep.","B":"Ground the large language model (LLM) with a retriever and create a custom field to store the LLM-generated response.","C":"Ground the large language model (LLM) with account data and create a custom field account summary to store the LLM-generated response."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":122,"q":"Coral Cloud Resorts wants to cover a broad range of user phrasing when testing its FAQ agent. Which Testing Center feature meets that need?","o":{"A":"Relying on live customer logs to capture phrasing diversity after deployment","B":"Uploading only a small set of manually written prompts","C":"AI-generated synthetic test utterances based on natural language variations"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":123,"q":"Universal Containers (UC) is building a Flex prompt template. UC needs to use data returned by the flow in the prompt template. Which flow element should UC use?","o":{"A":"Add Flow Instructions","B":"Add Flex Instructions","C":"Add Prompt Instructions"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":124,"q":"Coral Cloud Resorts needs consistent pass/fail logic for agent testing. Which Testing Center capability provides that?","o":{"A":"Use customer rating as a proxy for correctness.","B":"Run a script on event logs to identify the failed utterances.","C":"Use structured batch testing with validation per test utterance."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":125,"q":"A Service Agent at Universal Containers (UC) is designed to help customers resolve issues by searching against knowledge articles. Knowledge articles have PDF attachments that add critical details. UC reports that the agent provides excellent summaries of the knowledge articles, but seems completely unaware of the PDF attachments. How should an Agentforce Specialist configure the Data Cloud search index to include the content of these attached files?","o":{"A":"Increase article chunk size and token limits for Knowledge indexing so larger contexts capture attachment references.","B":"Enable 'Include Related Attachments' for Knowledge_kav and map the ContentDocumentLink unstructured data model object (UDMO).","C":"Use Data Cloud's 'Include Attachments' option and select the ContentDocumentVersion unstructured data model object (UDMO)."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":126,"q":"Universal Containers wants to use an AI agent to answer questions about warranties. Warranty information has already been uploaded as unstructured data in Data Cloud. When answering user questions, the results must be filterable by product line and ranked by recent updates. Which approach should the Agentforce Specialist implement?","o":{"A":"Use the default retriever which automatically accounts for recency ranking.","B":"Build a custom retriever in Einstein Studio with product line filters and recency ranking.","C":"Apply semantic embeddings with default metadata filters to achieve the desired result."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":127,"q":"A service manager wants to use Salesforce Prompt Builder to help agents summarize customer case notes after a support call. The summary should: Capture the customer's issue, troubleshooting steps taken, and next actions. Be no longer than five sentences. Use plain language (no technical jargon). If no next action is identified, the summary should explicitly state \"No next action required.\" Which prompt template follows Salesforce prompt design best practices?","o":{"A":"Role: You are an experienced support agent. Task: Summarize the case notes. Context: Include customer issue, troubleshooting steps, and next actions. Constraints: Limit to 5 sentences, use plain language, and if no next action is found, state \"No next action required.\" Format: Use numbered sentences for clarity.","B":"Task: Provide a professional summary of the issue and troubleshooting steps. Context: Include customer issue, steps taken, and next actions if available. Constraints: No strict sentence limit, but use plain language. If no next action is found, leave it out. Format: Use paragraphs for readability.","C":"Context: Include customer issue, steps taken, and next actions if available. Constraints: No strict sentence limit, but use plain language. If no next action is found, leave it out. Format: Use paragraphs for readability. Role: You are a case documentation assistant. Task: Write a summary of the support call.","D":"Context: Always describe the customer issue, troubleshooting, and resolution details. Constraints: The summary should be comprehensive and professional, but there is no limit on length or language style. Format: Use complete sentences in a narrative style."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":129,"q":"An administrator at Universal Containers is setting up a new Sales Development Representative (SDR) Agent. The agent's purpose is to nurture cold leads before connecting them to the assigned sales rep. To ensure the agent has all the necessary access to the leads in the North America sales region, what should the administrator do?","o":{"A":"Assign the user in the highest-level role within the North America role hierarchy as the SDR Agent User.","B":"Grant View All record permission of the Lead object to the 'Einstein Agent User' profile.","C":"Create a criteria-based sharing rule to grant access to targeted lead records to SDR Agent User."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":130,"q":"Coral Cloud Resorts (CCR) wants to configure its agent so that booking actions are only available when a customer's membership tier is \"Premium\" or \"Elite\". This business rule must be enforced deterministically. What should CCR implement?","o":{"A":"Set up custom validation rules on the underlying booking objects to prevent non- eligible customers from completing bookings.","B":"Configure topic instructions that clearly state booking actions should only be used for Premium or Elite customers and include examples.","C":"Create a context variable mapped to the customer's membership tier field, then add a conditional filter on MembershipTier."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":132,"q":"During configuration, Universal Containers (UC) forgot to grant Knowledge access to the Agentforce Service Agent. Which permission must UC add for the agent to interact with Knowledge articles and answer customer questions effectively?","o":{"A":"Allow View Knowledge and Run Flows","B":"Access Knowledge records and fields, and Allow View Knowledge","C":"Access Custom Objects and Manage External Users"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":133,"q":"An Agentforce Specialist turned on Einstein Generative AI in Setup. Now, the Agentforce Specialist would like to create custom prompt templates in Prompt Builder. However, they cannot access Prompt Builder in the Setup menu. What is causing the problem?","o":{"A":"The Prompt Template Manager permission set was not assigned correctly.","B":"The Prompt Template User permission set was not assigned correctly.","C":"The large language model (LLM) was not configured correctly in Data Cloud."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Deployment & security"},{"n":134,"q":"An Agentforce Specialist wants to ensure their custom agent action performs as expected in conversations. What should the Agentforce Specialist focus on when creating action instructions?","o":{"A":"Write concise agent action instructions and test in Agentforce Builder.","B":"Ensure the agent action label matches the utterance's intent.","C":"Include comprehensive detailed descriptions and perform smoke testing."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":135,"q":"Universal Containers wants to implement a customer verification process where sensitive account information can only be accessed after the customer passes identity verification. The agent must enforce this security rule deterministically without allowing the large language model (LLM) to bypass the verification requirement. What should an Agentforce Specialist recommend as the best solution?","o":{"A":"Use context variables to store verification status in the messaging session and configure the agent to check these variables through natural language prompts during each sensitive action.","B":"Include detailed verification instructions in the agent's topic instructions explaining when customers should be verified and rely on the LLM to follow these guidelines consistently across all interactions.","C":"Create a custom variable IsCustomerVerified set by a verification action, then apply a conditional filter using the expression IsCustomerVerified equals true to all sensitive data actions, ensuring deterministic access control that the LLM can't alter."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":136,"q":"Universal Containers plans to enable Agentforce in Slack so teams can interact with agents directly in Slack channels. Which description represents the key steps required to enable Agentforce in Slack?","o":{"A":"Enable the default Slack channel Agentforce, and assign Slack agent access to users.","B":"Configure the Slack workflow to invoke the Agentforce API, enabling users to interact with agents through predefined triggers and automated steps.","C":"Configure the Slack agent connection and, in Manage Agentforce, install the agent, then assign agent access to users."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":137,"q":"Coral Cloud Resorts (CCR) uses Agentforce to assist customers with booking and service issues. CCR wants to implement a triage process so that: High severity requests must be escalated to a human service rep. Lower severity requests should result in creating a support case for the guest. The requirement is to achieve the highest reliability and determinism in the response from the agent. Which approach should an Agentforce Specialist recommend?","o":{"A":"Write the triage and routing logic in Topic Instructions using an IF, THEN, ELSE pattern: \"Escalate to human service rep if the request is considered severe, otherwise create support case\".","B":"Use absolute keywords like \"Always\" and \"Never\" in Topic Instructions to enforce logic, such as \"Always escalate when severity is high\" and \"Never create a support case when severity is high\".","C":"Create a custom variable severityLevel populated by a Triage action. Add filters so the \"Escalate to human service rep\" action only runs when severityLevel = 'High', and the \"Create Support Case\" action runs only when severityLevel != 'High'."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":138,"q":"Coral Cloud Resorts wants visibility into credit usage associated with testing. Which feature supports this?","o":{"A":"Agentforce Analytics","B":"Digital Wallet","C":"Testing Center"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":139,"q":"Universal Containers implements custom agent actions to enhance its customer service operations. The development team needs to understand the core components of a custom agent action to ensure proper configuration and functionality. What should the development team review in the custom agent action configuration to identify one of the core components of a custom agent action?","o":{"A":"Output Types","B":"Action Triggers","C":"Instructions"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":140,"q":"What should Universal Containers consider when deploying a Service Agent with multiple topics and agent actions to production?","o":{"A":"Deploy flows or Apex after agents, topics, and agent actions to avoid deployment failures and potential production agent issues requiring complete redeployment.","B":"Ensure all dependencies are included, test coverage is appropriate, and configuration settings are aligned with production. Plan for version management and post- deployment activation.","C":"Ensure the agent is deployed without testing due to the probabilistic nature of AI which will prevent deployment issues."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":141,"q":"An Agentforce Specialist builds a new Service Agent that uses a custom action built on a flow. The agent has been tested in a sandbox and is now ready to deploy. What is a key consideration regarding the activation status of the agent in the production environment?","o":{"A":"The agent will be activated automatically only if the flow is also active.","B":"The agent must be manually activated in production, regardless of its status in the sandbox.","C":"The agent will automatically be activated upon successful deployment."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":142,"q":"Universal Containers has set up a Service Agent to allow customers to look up their order status. The topic setup includes: Name: Order Inquiry Classification Description: Handles user requests to look up order status, including tracking details and delivery estimates for orders placed within the last 90 days. Scope: Your job is only to assist authenticated users in looking up the status of their orders placed within the last 90 days. If the order is pending delivery, provide the tracking number and estimated delivery date. Do not handle inquiries for orders older than 90 days. Which information will be used by the Agentforce reasoning engine to choose this topic?","o":{"A":"Topic Name and Classification Description","B":"Topic Name and Scope","C":"Classification Description and Scope"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":143,"q":"Universal Containers needs to bring individual customer warranties from an external system into Data Cloud. They want Agentforce to return warranty-related responses only for accounts whose warranty status is active. Which search approach should the Agentforce Specialist configure to ensure warranty- related information is retrieved correctly?","o":{"A":"Depend on Agentforce instructions to enforce warranty constraints and include only WarrantyStatus = Active results.","B":"Store the account's warranty status in an Agentforce custom variable to dynamically filter warranties during retrieval.","C":"Use Hybrid Search and apply pre-filtering in a new custom retriever for matching accounts and where the WarrantyStatus = Active field."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":144,"q":"A business stakeholder wants to use AI to generate a summary based on Data Cloud data. Which method(s) should the stakeholder use to access Data Cloud data from Prompt Builder?","o":{"A":"Accessing data model objects (DMOs) directly in Flex templates, using Data Cloud related lists, and fetching Data Cloud data using prompt-initiated flows","B":"Using Data Cloud related lists and fetching Data Cloud data using prompt-initiated flows","C":"Using only external APIs to import Data Cloud data into Prompt Builder"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":145,"q":"What is one key purpose of action instructions when creating a custom agent action in Agentforce?","o":{"A":"Action instructions help the reasoning engine decide which action to use.","B":"Action instructions define the temperature of the large language model (LLM) powering the Reasoning Engine.","C":"Action instructions tell the user how to call this action in a conversation."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":146,"q":"Support agents at Universal Containers are using Agentforce to find troubleshooting information. They've reported that the agent frequently provides knowledge articles that are outdated, even when newer versions of the articles are available. The administrator has confirmed that all articles are correctly chunked and indexed. Which configuration change in the Data Cloud hybrid search index best addresses this problem?","o":{"A":"Disable the keyword index to rely solely on the vector index.","B":"Switch the chunking strategy from section-aware to fixed-size.","C":"Add a ranking factor for recency based on the LastModifiedDate field."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":147,"q":"What is one of the recommended approaches when constructing and refining Agentforce custom action instructions?","o":{"A":"Use consistent introductory phrases and verbs across multiple action instructions.","B":"Provide examples of user messages that are expected to trigger the action.","C":"Specify the persona who will request the action."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":148,"q":"Universal Containers (UC) has effectively utilized prompt templates to update summary fields on Lightning record pages. An admin now wishes to incorporate similar functionality into UC's automation processes using Flow. How should the admin get a response from this prompt template from within a flow to use as part of UC's automation?","o":{"A":"Invocable Apex","B":"Einstein for Flow","C":"Flow action"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":149,"q":"An Agentforce Specialist is creating a prompt template to assist support reps in drafting responses to customer complaints. To ensure the responses are empathetic and helpful, what is a key element to include in the prompt template?","o":{"A":"A direct instruction to the large language model (LLM) to role-play as a character","B":"A list of keywords related to customer complaints","C":"The entire history of the customer's previous interactions with the company"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":150,"q":"What is a valid use case for Data Cloud retrievers?","o":{"A":"Grounding data from external websites to augment a prompt with retrieval- augmented generation (RAG)","B":"Returning relevant data from the vector database to augment a prompt","C":"Modifying and updating data within the source systems connected to Data Cloud"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":151,"q":"At Universal Containers, a sales manager is tackling a tough challenge as several new junior sales reps struggle with objection handling and price negotiations for complex deals. The manager lacks the time to personally guide each sales rep through their specific customer scenarios before their critical meetings. The junior sales reps have asked for a tool that would allow them to practice their pitches by simulating tough conversations and receive personalized feedback that is specific to the commerce opportunity they are working on. Which Salesforce solution should an Agentforce Specialist recommend?","o":{"A":"Employee Coach","B":"SDR Agent","C":"Sales Coach"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":152,"q":"Universal Containers (UC) is implementing Agentforce Service Agent on Email. UC made an email template and now needs to connect it to a Service Agent. What should an Agentforce Specialist recommend?","o":{"A":"Create an Email Configuration for the Service Agent.","B":"Create an Omni-Channel flow to point to an email template.","C":"No action needed; the Service Agent connects automatically."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":153,"q":"What is the primary advantage of creating an individual retriever instead of the default retriever?","o":{"A":"Individual retrievers can aggregate multiple data spaces and data model objects (DMOs) into a unified retriever output.","B":"Individual retrievers allow the configuration of filters, specified fields, and how many results are returned.","C":"Individual retrievers automatically generate new search indexes and dynamically update vectors."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":154,"q":"Universal Containers (UC) is using related list merge fields in a prompt template associated with an Account object in Prompt Builder. What should UC consider?","o":{"A":"If person accounts have been enabled, merge fields will not be available for the Account object.","B":"Prompt generation will yield no response when there is no related list associated with an Account in runtime.","C":"The Activities related list on the Account object is not supported because it is a polymorphic field."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":156,"q":"Universal Containers wants to assign agents to improve department efficiency. Which configuration ensures the right tasks are handled by the right agents?","o":{"A":"SDR Agent for lead qualification, Service Agent for support tickets, Employee Agent for HR requests","B":"Sales Coach Agent for lead and service Agent for HR requests, and Support tickets to ensure cases are available","C":"One Service Agent to efficiently handle each of these scenarios, which reduces the number of agent types needed for support"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":157,"q":"Universal Containers (UC) plans to automatically populate the Description field on the Account object. Which type of prompt template should UC use?","o":{"A":"Sales Email","B":"Flex","C":"Field Generation"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":158,"q":"An Agentforce Specialist is assisting Universal Containers with troubleshooting an agent. The Agentforce Specialist notices that the agent is not using topic actions in the desired sequence, causing inconsistent outcomes. Which technique should the Agentforce Specialist recommend to ensure deterministic control over the order in which actions are executed?","o":{"A":"Specify the large language model (LLM) provider and version.","B":"Specify custom variables and filters.","C":"Specify the order of actions."},"a":"B","orig":"C","status":"corrected","note":"Order is enforced with variables + filters.","t":"Agent Builder & actions"},{"n":159,"q":"The Agentforce Specialist for Coral Cloud Resorts wants to create an agent that will automate the resolution of a large portion of guest complaints related to their vacation experiences. The agent will be able to offer upgrades, hotel credit, and other complimentary options. The agent will also be in charge of escalating the case to a human when a guest has suffered a major disruption (such as cancellation). Following Salesforce best practices, which type of agent should the Agentforce Specialist create?","o":{"A":"Sales Agent with a Flex prompt template","B":"Custom Agent with a Flex prompt template","C":"Service Agent with a Flex prompt template"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":161,"q":"What is a key benefit of the Agent-to-Agent (A2A) protocol?","o":{"A":"Provides a standardized framework for cross-vendor agent discovery and communication","B":"Allows auto-onboard third-party agents without additional contracts, trust scores, or shared identity controls","C":"Provides a standardized runtime engine for internal agent discovery and communication"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":162,"q":"Universal Containers is indexing millions of product manuals where users may ask both structured queries (model numbers) and natural language questions (for example, \"How do I reset my device?\"). Which retrieval approach should the company use?","o":{"A":"Use keyword search only, since model numbers dominate queries.","B":"Use semantic search only, as natural language is always preferred.","C":"Use hybrid search to combine keyword precision with semantic flexibility."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":163,"q":"When using a prompt template, what should an Agentforce Specialist consider with their grounding data and chosen model?","o":{"A":"Review the token limit in the Einstein Trust Layer.","B":"Ensure queries used for grounding employ offset so the token limits of models are not exceeded.","C":"Review the model limitation in Prompt Builder versus the grounding data size."},"a":"C","orig":"A","status":"corrected","note":"Trust Layer has no token limit setting.","t":"Prompt Builder"},{"n":164,"q":"An Agentforce Specialist created a Field Generation prompt template. What should the Agentforce Specialist do to expose the template to the user?","o":{"A":"Use a screen flow to associate the Field Generation prompt template.","B":"Associate the template with the form field on the Lightning page.","C":"Call a template using an autolaunched flow."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":165,"q":"Universal Containers (UC) is tracking web activities in Data Cloud for a unified contact. It wants to use that information in a prompt template to help extract insights from the data. Assuming that the Contact object is one of the objects associated with the prompt template, what is a valid way for UC to do this?","o":{"A":"Create a prompt template that takes a list of all Data Cloud activity records as input to pass to the large language model (LLM).","B":"Call the prompt directly from Data Cloud with a web tracking activity included in the prompt definition.","C":"Add the activity records as an enrichment related list to the Contact, then pass the Contact into a prompt template workspace using related list grounding."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":166,"q":"Universal Containers wants to test agents while preserving real data and isolating from production. Which environment should the company use with Testing Center?","o":{"A":"Use personal developer orgs unrepresentative of production data.","B":"Use production org directly with test assertions.","C":"Use sandbox environments replicated from production for safe testing."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":167,"q":"Coral Cloud Resorts wants to handle frequent customer misspellings of package names in queries. Which approach should the Agentforce Specialist implement?","o":{"A":"Hybrid search","B":"Vector search","C":"Keyword search"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":168,"q":"Universal Containers (UC) has configured a data library and wants to restrict indexing of knowledge articles to articles which are only publicly available in their knowledge base. UC also wants the agent to link sources that the large language model (LLM) grounded its response on. Which settings should help UC with this?","o":{"A":"In the data library setting window, under Knowledge Settings, enable Use Public Knowledge Article and select Show sources.","B":"In the data library setting window, under Knowledge Settings, enable Use Public Knowledge Article. It is not possible to display articles that the LLM grounded its response in.","C":"Use Data Categories to categorize publicly available articles to index. Sources are automatically displayed when knowledge articles are categorized as Public."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":170,"q":"Universal Containers (UC) has a library of custom-built personalized investment portfolio APIs, and is planning to extend it to agents. Which method should UC's agent choose to dynamically use the best API service?","o":{"A":"Agent-to-Agent (A2A) protocol support","B":"Model Context Protocol (MCP) server support","C":"MuleSoft connector for custom hosted processes"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent types & channels"},{"n":172,"q":"Cloud Kicks (CK) is launching a new partner portal on Experience Cloud. CK wants to provide partners with an agent that can answer questions about product specifications from the knowledge base and allow them to submit a new Lead for a potential customer they've identified. The agent must be accessible only to authenticated partner users on the portal. Which agent type is required to meet this scenario?","o":{"A":"Sales Agent","B":"Commerce Agent","C":"Service Agent"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":173,"q":"Universal Containers (UC) recently added a custom flow for processing returns and created a new agent action. What should UC do to ensure the Agentforce Service Agent can run this new flow as part of the new agent action?","o":{"A":"Recreate the flow using the Agentforce Agent user.","B":"Assign the Run Flows permission to the Agentforce Agent user.","C":"Assign the Manage Users permission to the Agentforce Agent user."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":174,"q":"Universal Containers is building a digital shopping assistant that needs to dynamically generate product recommendations using information from the company's external product recommendation predictive model through APIs. Which Agentforce capability should make it easier for the agent to consume the external product recommendation tool?","o":{"A":"Model Context Protocol (MCP)","B":"Hugging Face","C":"Agent-to-Agent (A2A) protocol"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":175,"q":"Universal Containers is using Agentforce for Sales to find similar opportunities to help close deals faster. The team wants to understand the criteria used by the agent to match opportunities. What is one criteria that Agentforce for Sales uses to match similar opportunities?","o":{"A":"Matched opportunities were created in the last 12 months.","B":"Matched opportunities have a status of Closed Won from last 12 months.","C":"Matched opportunities are limited to the same account."},"a":"B","orig":"B","status":"disputed","note":"Its duplicate in the master file was keyed C.","t":"General"},{"n":176,"q":"After an agent selects a topic, what is an important factor the reasoning engine uses to select the action?","o":{"A":"The priority given to each action","B":"The explicit order of actions in the topic","C":"The name and instructions of the actions"},"a":"C","orig":"A","status":"corrected","note":"No action priority; name + instructions decide.","t":"Agent Builder & actions"},{"n":188,"q":"Universal Containers (UC) recently attended a major trade show and received thousands of new leads from event badge scans. UC is struggling to follow up with each lead in a timely, personalized way. Leadership wants to: Qualify and nurture leads 24/7. Provide accurate answers to prospect questions. Automatically book meetings with qualified prospects. Free up reps to focus on building relationships and closing deals. Which Agentforce capability should UC implement to meet these goals?","o":{"A":"SDR Agent","B":"Sales Coach","C":"Commerce Agent"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent types & channels"},{"n":193,"q":"Universal Containers (UC) is considering using a Field Generation prompt template type. What should UC check before creating the Field Generation prompt to ensure it is possible for the field to be enabled for generative AI?","o":{"A":"That the field chosen is a rich text field with 255 characters or more","B":"That the org is set to API version 59 or higher","C":"That the Lightning page layout where the field will reside has been upgraded to Dynamic Forms"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":197,"q":"When configuring a prompt template, an Agentforce Specialist previews the results of the prompt template they've written. They see two distinct text outputs: Resolution and Response. Which information does the Resolution text provide?","o":{"A":"It shows which sensitive data is masked before it is sent to the LLM.","B":"It shows the response from the LLM based on the sample record.","C":"It shows the full text that is sent to the Trust Layer."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Prompt Builder"},{"n":198,"q":"Universal Containers (UC) is creating a new custom prompt template to populate a field with generated output. UC enabled the Einstein Trust Layer to ensure AI Audit data is captured and monitored for adoption and possible enhancements. Which prompt template type should UC use and which consideration should UC review?","o":{"A":"Flex, and that Dynamic Fields is enabled","B":"Field Generation, and that Dynamic Fields is enabled","C":"Field Generation, and that Dynamic Forms is enabled"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":199,"q":"Universal Containers (UC) wants to make a sales proposal and directly use data from multiple unrelated objects (standard and custom) in a prompt template. How should UC accomplish this?","o":{"A":"Create a Flex template to add resources with standard and custom objects as inputs.","B":"Create a prompt template passing in a special custom object that connects the records temporarily.","C":"Create a prompt template-triggered flow to access the data from standard and custom objects."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":200,"q":"Universal Containers has grounded a prompt template with a related list. During user acceptance testing (UAT), users are not getting the correct responses. What is causing this issue?","o":{"A":"The related list prompt template option is not enabled.","B":"The related list is not on the parent object's page layout.","C":"The related list is Read Only."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":201,"q":"An Agentforce Specialist wants to troubleshoot their Agent's performance. Where should the Agentforce Specialist go to access all user interactions with the Agent, including Agent errors, incorrectly triggered actions, and incomplete plans?","o":{"A":"Event Logs","B":"Agent Settings","C":"Plan Canvas"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":202,"q":"Universal Containers (UC) uses a file upload-based data library and custom prompt to support AI-driven training content. However, users report that the AI frequently returns outdated documents. Which corrective action should UC implement to improve content relevancy?","o":{"A":"Switch the data library source from file uploads to a Knowledge-based data library, because Salesforce Knowledge bases automatically manage document recency, ensuring current documents are returned.","B":"Configure a custom retriever that includes a filter condition limiting retrieval to documents updated within a defined recent period, ensuring that only current content is used for AI responses.","C":"Continue using the default retriever without filters, because periodic re-uploads will eventually phase out outdated documents without further configuration or the need for custom retrievers."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":203,"q":"Universal Containers plans to enhance its sales team's productivity using AI. Which specific requirement necessitates the use of Prompt Builder?","o":{"A":"Predicting the likelihood of customers churning or discontinuing their relationship with the company","B":"Creating a draft newsletter for an upcoming tradeshow","C":"Creating an estimated Customer Lifetime Value (CLV) with historical purchase data"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":204,"q":"Universal Containers (UC) is experimenting with using public Generative AI models and is familiar with the language required to get the information it needs. However, it can be time consuming for both UC's sales and service reps to type in the prompt to get the information they need, and ensure prompt consistency. Which Salesforce feature should the company use to address these concerns?","o":{"A":"Einstein Prompt Builder and Prompt Templates","B":"Agent Builder and Action: Query Records","C":"Einstein Recommendation Builder"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":206,"q":"A data scientist needs to view and manage models in Einstein Studio. The data scientist also needs to create prompt templates in Prompt Builder. Which permission sets should an Agentforce Specialist assign to the data scientist?","o":{"A":"Prompt Template User and Data Cloud Admin","B":"Data Cloud Admin and Prompt Template Manager","C":"Prompt Template Manager and Prompt Template User"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":207,"q":"A customer service representative is looking at a custom object that stores travel information. They recently received a weather alert and now need to cancel flights for the customers that are related with this itinerary. The representative needs to review the Knowledge articles about canceling and rebooking the customer flights. Which Agentforce capability helps the representative accomplish this?","o":{"A":"Invoke a flow which makes a call to external data to create a Knowledge article.","B":"Generate a Knowledge article based off the prompts that the agent enters to create steps to cancel flights.","C":"Execute tasks based on available actions, answering questions using information from accessible Knowledge articles."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":208,"q":"In a Knowledge-based data library configuration, what is the primary difference between the identifying fields and the content fields?","o":{"A":"Identifying fields highlight key terms for relevance scoring, while content fields store the full text of the article for retrieval.","B":"Identifying fields categorize articles for indexing purposes, while content fields provide a brief summary for display.","C":"Identifying fields help locate the correct Knowledge article, while content fields enrich AI responses with detailed information."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":209,"q":"Universal Containers (UC) wants to enable its sales team to use AI to suggest recommended products from its catalog. Which type of prompt template should UC use?","o":{"A":"Record summary prompt template","B":"Flex prompt template","C":"Email generation prompt template"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":210,"q":"Universal Containers (UC) plans to implement prompt templates that utilize the standard foundation models. What should UC consider when building prompt templates in Prompt Builder?","o":{"A":"Train LLM with data using different writing styles including word choice, intensifiers, emojis, and punctuation.","B":"Ask it to role-play as a character in the prompt template to provide more context to the LLM.","C":"Include multiple-choice questions within the prompt to test the LLM's understanding of the context."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":211,"q":"Universal Containers needs its sales reps to be able to only execute prompt templates. What should the company use to achieve this requirement?","o":{"A":"Prompt Template Manager permission set","B":"Prompt Execute Template permission set","C":"Prompt Template User permission set"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":212,"q":"An Agentforce Specialist is tasked with analyzing Agent interactions looking into user inputs, requests, and queries to identify patterns and trends. What functionality allows the Agentforce Specialist to achieve this?","o":{"A":"User Utterances dashboard","B":"Agent Event Logs dashboard","C":"AI Audit and Feedback Data dashboard"},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":213,"q":"Universal Containers has an active standard email prompt template that does not fully deliver on the business requirements. Which steps should an Agentforce Specialist take to use the content of the standard prompt email template in question and customize it to fully meet the business requirements?","o":{"A":"Save as New Version and edit as needed.","B":"Clone the existing template and modify as needed.","C":"Save as New Template and edit as needed."},"a":"C","orig":"B","status":"disputed","note":"Prompt Builder has Save As New Template, no Clone.","t":"Prompt Builder"},{"n":214,"q":"Universal Containers (UC) wants to implement an AI-powered customer service agent that can: Retrieve proprietary policy documents that are stored as PDFs. Ensure responses are grounded in approved company data, not generic LLM knowledge. What should UC do first?","o":{"A":"Add the files to the content, and then select the data library option.","B":"Expand the AI agent's scope to search all Salesforce records.","C":"Set up an Agentforce Data Library for AI retrieval of policy documents."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":215,"q":"Universal Containers (UC) would like to implement Sales Development Representative (SDR) Agent. Which channel consideration should UC be aware of while implementing it?","o":{"A":"SDR Agent must also be deployed in the company website.","B":"SDR Agent must be deployed in Messaging channel.","C":"SDR Agent only works in Email channel."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":216,"q":"Universal Containers would like to route SMS text messages to a service rep from an Agentforce Service Agent. Which Service Channel should the company use in the flow to ensure it's routed properly?","o":{"A":"Live Agent","B":"Route Work Action","C":"Messaging"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":217,"q":"Universal Containers (UC) is rolling out an AI-powered support assistant to help customer service agents quickly retrieve relevant troubleshooting steps and policy guidelines. The assistant relies on a search index in Data Cloud that contains product manuals, policy documents, and past case resolutions. During testing, UC notices that agents are receiving too many irrelevant results from older product versions that no longer apply. How should UC address this issue?","o":{"A":"Create a custom retriever in Einstein Studio, and apply filters for publication date and product line.","B":"Use the default retriever, as it already searches the entire search index and provides broad coverage.","C":"Modify the search index to only store documents from the last year and remove older records."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Testing & monitoring"},{"n":218,"q":"When creating a custom retriever in Einstein Studio, which step is considered essential?","o":{"A":"Select the search index, specify the associated data model object (DMO) and data space, and optionally define filters to narrow search results.","B":"Define the output configuration by specifying the maximum number of results to return, and map the output fields that will ground the prompt.","C":"Configure the search index, choose vector or hybrid search, choose the fields for filtering, the data space and model, then define the ranking method."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":219,"q":"For an Agentforce Data Library that contains uploaded files, what occurs once it is created and configured?","o":{"A":"Indexes the uploaded files in a location specified by the user","B":"Indexes the uploaded files into Data Cloud","C":"Indexes the uploaded files in Salesforce File Storage"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":220,"q":"Universal Containers has implemented an agent that answers questions based on Knowledge articles. Which topic and Agent Action will be shown in the Agent Builder?","o":{"A":"General CRM topic and Answers Questions with LLM Action","B":"General FAQ topic and Answers Questions with Knowledge Action","C":"General Q&A topic and Knowledge Article Answers action"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Data, retrieval & Knowledge"},{"n":221,"q":"How does an Agent respond when it can't understand the request or find any requested information?","o":{"A":"With a preconfigured message, based on the action type","B":"With a general message asking the user to rephrase the request","C":"With a generated error message"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":223,"q":"Universal Containers wants to utilize Agentforce for Sales to help sales reps reach their sales quotas by providing AI-generated plans containing guidance and steps for closing deals. Which feature meets this requirement?","o":{"A":"Create Account Plan","B":"Create Close Plan","C":"Find Similar Deals"},"a":"B","orig":"B","status":"reviewed","note":"","t":"General"},{"n":226,"q":"Universal Containers wants to reduce overall customer support handling time by minimizing the time spent typing routine answers for common questions in-chat, and reducing the post-chat analysis by suggesting values for case fields. Which combination of Agentforce for Service features enables this effort?","o":{"A":"Einstein Reply Recommendations and Case Summaries","B":"Einstein Service Replies and Work Summaries","C":"Einstein Reply Recommendations and Case Classification"},"a":"C","orig":"A","status":"corrected","note":"Case field values = Case Classification.","t":"Agent types & channels"},{"n":227,"q":"Universal Containers (UC) wants to leverage Generative AI Salesforce functionality to reduce Service Agent handling time by providing recommended replies based on the existing Knowledge articles. On which AI capability should UC train the service agents?","o":{"A":"Knowledge Replies","B":"Service Replies","C":"Case Replies"},"a":"B","orig":"A","status":"corrected","note":"No 'Knowledge Replies' feature.","t":"Data, retrieval & Knowledge"},{"n":228,"q":"An Agentforce Specialist needs to create a prompt template to fill a custom field named Latest Opportunities Summary on the Account object with information from the three most recently opened opportunities. How should the Agentforce Specialist gather the necessary data for the prompt template?","o":{"A":"Select the latest Opportunities related list as a merge field.","B":"Select the Account Opportunity object as a resource when creating the prompt template.","C":"Create a flow to retrieve the opportunity information."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Prompt Builder"},{"n":229,"q":"Universal Containers wants to implement a solution in Salesforce with a custom UX that allows users to enter a sales order number. Subsequently, the system will invoke a custom prompt template to create and display a summary of the sales order header and sales order details. Which solution should an Agentforce Specialist implement to meet this requirement?","o":{"A":"Create a template-triggered prompt flow and invoke the prompt template using the standard \"Prompt Template\" flow action.","B":"Create a screen flow to collect sales order number and invoke the prompt template using the standard \"Prompt Template\" flow action.","C":"Create an autolaunched flow and invoke the prompt template using the standard \"Prompt Template\" flow action."},"a":"B","orig":"B","status":"reviewed","note":"","t":"Prompt Builder"},{"n":230,"q":"The sales team at a hotel resort would like to generate a guest summary about the guests' interests and provide recommendations based on their activity preferences captured in each guest profile. They want the summary to be available only on the contact record page. Which AI capability should the team use?","o":{"A":"Model Builder","B":"Prompt Builder","C":"Agent Builder"},"a":"B","orig":"B","status":"reviewed","note":"","t":"Deployment & security"},{"n":231,"q":"Which element in the Omni-Channel flow should be used to connect the flow with the agent?","o":{"A":"Assignment","B":"Decision","C":"Route Work Action"},"a":"C","orig":"C","status":"reviewed","note":"","t":"Agent types & channels"},{"n":232,"q":"What is the importance of Action Instructions when creating a custom Agent action?","o":{"A":"Action Instructions tell the large language model (LLM) which action to use.","B":"Action Instructions define the expected user experience of an action.","C":"Action Instructions tell the user how to call this action in a conversation."},"a":"A","orig":"A","status":"reviewed","note":"","t":"Agent Builder & actions"},{"n":233,"q":"Universal Containers (UC) wants to limit an agent's access to Knowledge articles, while deploying Answer Questions with Knowledge action. How should UC achieve this?","o":{"A":"Define scope instructions to the agent specifying a list of allowed article titles or IDs.","B":"Update the Data Library Retriever to filter on a custom field on the Knowledge article.","C":"Assign Data Categories to Knowledge articles, and define Data Category filters in the Agentforce Data Library."},"a":"C","orig":"C","status":"reviewed","note":"","t":"Deployment & security"},{"n":234,"q":"Universal Containers has successfully chunked and vectorized its unstructured meeting notes into a Data 360 search index. An Agentforce Specialist needs to connect this data to a prompt template to dynamically refine search criteria and retrieve the most relevant information. How should the specialist achieve this?","o":{"A":"Create a Flex template referencing a data lake object (DLO).","B":"Create a Flex template referencing a retriever in the prompt template.","C":"Create a Flex template referencing the data model object (DMO)."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-01","t":"Prompt Builder"},{"n":235,"q":"Which business requirement best presents a good use case for using Prompt Builder?","o":{"A":"Forecast future sales trends based on historical data","B":"Send a quote proposal in reply to a request for a quote","C":"Identify potential high-value leads based on lead score."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-02","t":"Prompt Builder"},{"n":236,"q":"An Agentforce Specialist is creating a custom agent action. The subagent (formerly known as a topic) is selected correctly, but the action is not. Which component of Action structure in Agent Script helps the large language model (LLM) decide when to use the action?","o":{"A":"target","B":"label","C":"description"},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-03","t":"Agent Builder & actions"},{"n":237,"q":"An Agentforce Specialist is evaluating an agent conversation. What is the reason why intents and session metrics within Observability are important to consider?","o":{"A":"To evaluate the agent's overall performance","B":"To evaluate why the agent was unable to answer a user's question","C":"To evaluate the deflection rate of the agent"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-04","t":"Testing & monitoring"},{"n":238,"q":"A company's support agent is inconsistently executing a mandatory fraud check action before processing refunds. In some conversations the fraud check fires, but in others the agent skips directly to issuing the refund. Upon review, an Agentforce Specialist recommends placing the instruction guideline with 'run @actions.fraud_check' followed by 'run @actions.process_refund'. What is the effect of this configuration change?","o":{"A":"The fraud-check action will be more strongly suggested to the large language model (LLM), but it may still be skipped if the LLM determines it is not relevant to the conversation.","B":"The fraud-check action will execute after the large language model (LLM) check if it missed it in the process step execution, but the agent will lose its ability to use an empathetic tone.","C":"The fraud-check action will be forced to execute before the refund action in every conversation, because procedural instructions provide deterministic control over the execution order."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-06","t":"Agent Builder & actions"},{"n":239,"q":"Universal Containers is configuring its Agentforce Testing Center to evaluate an agent handling customer complaints. The company wants to assess if the agent successfully demonstrates empathy and follows a proprietary \"De-escalation Framework\" before offering a resolution. Where should the Agentforce Specialist utilize a large language model (LLM)-as-judge to achieve an appropriate evaluation?","o":{"A":"Adjust the fixed criteria of the standard Coherence quality evaluation to control the LLM-as-judge evaluation.","B":"Enable the default Instruction Adherence evaluation which natively uses LLM-as-judge.","C":"Create a custom evaluation with a tailored prompt outlining the framework's criteria."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-07","t":"Testing & monitoring"},{"n":240,"q":"Universal Containers is implementing a customer verification process for its service agent where sensitive account information can only be accessed after the customer passes identity verification. The Agentforce Specialist needs to ensure this security rule is enforced deterministically, preventing the large language model (LLM) from bypassing the verification requirement to execute the account lookup action. What should the specialist configure to manage this deterministic behavior?","o":{"A":"Configure a Prompt Defense policy in the Einstein Trust Layer to mask the sensitive account data from the reasoning engine until the user successfully completes the verification process.","B":"Store the user's verification status in a custom variable and apply an \"available when\" filter condition to the account lookup action, making the action invisible to the reasoning engine until the variable evaluates to true.","C":"Add explicit natural language instructions within the subagent (formerly known as a topic) definition instructing the large language model (LLM) to always prioritize the customer verification action before proceeding to the account lookup action."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-08","t":"Prompt Builder"},{"n":241,"q":"Universal Containers' agent must always look up the customer's account tier and open cases from Salesforce before deciding how to respond. Based on Agent Script flow of control, what is true about executing deterministic actions at the very start of a subagent (formerly known as a topic)?","o":{"A":"Actions can only be guaranteed to run by placing them in the config block.","B":"Only before_reasoning can guarantee the large language model (LLM) is invoked before an action runs.","C":"The first instruction in reasoning instructions always runs before the large language model (LLM) is invoked."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-09","t":"Agent Builder & actions"},{"n":242,"q":"An Agentforce Specialist is testing an agent with Testing Center. The test results show that an agent correctly identifies the right subagent to handle an utterance, but it fails to select all necessary actions within that subagent. Which evaluation metric specifically identifies this failure?","o":{"A":"Action Assertion","B":"Response Evaluation","C":"Subagent Assertion"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-11","t":"Testing & monitoring"},{"n":243,"q":"The compliance team at Universal Containers has determined that a specific customer service prompt must only process data through a secure, self-hosted Amazon Bedrock model and must be prevented from accessing the default OpenAI models. How should the Agentforce Specialist configure this specific model routing?","o":{"A":"Assign a permission set to the dedicated Agent User that restricts Read access to the default Salesforce large language model (LLM) metadata records.","B":"Configure a Data 360 Private Connect endpoint that automatically reroutes all Agentforce requests away from the default large language model (LLM) Gateway.","C":"Register the model as a BYOLLM in Einstein Studio, then explicitly select this model when configuring the prompt template."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-13","t":"Deployment & security"},{"n":244,"q":"Cloud Kicks wants its Agentforce Service Agent to retrieve up-to-date factual data from the internet. Which step must an Agentforce Specialist take to ensure the agent uses the web search capability properly?","o":{"A":"Enable the Answer Questions with Knowledge standard action specifically on the General FAQ subagent (formerly known as a topic).","B":"Map the web search retriever to a custom search index in Data 360 before activating the agent.","C":"Remove the default General FAQ subagent (formerly known as a topic) from the agent and replace its function with a new General Web Search topic."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-14","t":"Data, retrieval & Knowledge"},{"n":245,"q":"Universal Containers (UC) is scaling its Agentforce deployment and needs to securely connect its AI agents to a growing number of external enterprise data systems and local developer environments. Instead of building custom integration logic and bespoke Application Programming Interfaces (APIs) for each new data source, the Agentforce Specialist recommends leveraging the Model Context Protocol (MCP). What is the primary purpose of using an open standard like MCP in this scenario?","o":{"A":"To standardize the secure connection and delivery of context between the AI models and various local or remote data sources","B":"To replace the need for Retrieval-Augmented Generation (RAG) by storing all external data natively within the large language model (LLM) weights","C":"To allow the agent to autonomously negotiate task delegation with third-party supply chain agents"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-15","t":"Deployment & security"},{"n":246,"q":"An Agentforce Specialist at Universal Containers previously recommended removing superseded mortgage policy documents ingested into Data 360 to prevent the agent retrieving outdated terms. Legal has now confirmed that all historical versions must remain in the system simultaneously, as each version remains contractually binding for customers who signed under it. Which revised recommendation should the specialist make?","o":{"A":"Configure a custom retriever in AI Models (formerly Einstein Studio) with a dynamic filter on the policy version metadata field, populated at runtime from the customer's Contract record in CRM, ensuring retrieval is deterministically scoped to the document version applicable to that customer's agreement before similarity ranking is applied.","B":"Add the policy version identifier as a prepend field in the search index so every chunk is tagged with its applicable version at indexing time, enabling the large language model (LLM) to identify and select the correct version during response generation.","C":"Create a separate data stream for each policy version and configure the agent to query the appropriate unstructured data model object (UDMO) corresponding to the customer's contract date, isolating each version's vectors from the others."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-16","t":"Deployment & security"},{"n":247,"q":"Universal Containers (UC) wants to incorporate the current order fulfillment status into a prompt for a large language model (LLM). The order status is stored in the external enterprise resource planning (ERP) system. What is the most appropriate data grounding technique that UC should use?","o":{"A":"External Object Record merge fields","B":"Apex merge fields","C":"External Services merge fields"},"a":"A","orig":"A","status":"disputed","note":"Apex merge fields (B) also argued.","src":"SET2-17","t":"Prompt Builder"},{"n":248,"q":"An Agentforce Specialist is building a multistep onboarding workflow using agent actions. The workflow includes four sequential steps: account creation, profile setup, settings configuration, and finalization. After the create_account action executes successfully, the system must immediately send a verification email without requiring an additional user interaction. Which approach should the specialist use to ensure the verification email is automatically triggered after account creation?","o":{"A":"Use the keyword 'run' within the create_account action to chain the send_verification action as a follow-up.","B":"Add the send verification logic inside the procedural instructions so it executes before profile setup finishes.","C":"Configure the send_verification action to be available when account_created = True and wait for the agent to call it in the next step."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-18","t":"Deployment & security"},{"n":249,"q":"Universal Containers has deployed Agentforce to handle customer order tracking, returns, and loyalty support. The agent needs to balance conversational flexibility for customer inquiries with guaranteed execution of identity verification steps before accessing the account information. The development team is evaluating how to structure the agent's instruction pattern to meet both requirements. Which statement correctly describes hybrid reasoning in Agentforce Agent Script?","o":{"A":"Hybrid reasoning uses multiple large language model (LLM) models simultaneously, with one model handling conversational responses and another model executing deterministic business logic through Flow integration.","B":"Hybrid reasoning requires Canvas View for declarative instructions and Script View for procedural instructions, as each editor provides different capabilities for the respective instruction types.","C":"Hybrid reasoning combines declarative natural language instructions that allow large language model (LLM) interpretation with procedural instructions using the \"->\" prefix that enforce guaranteed execution order."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-20","t":"Deployment & security"},{"n":250,"q":"Universal Containers has built a Service Agent for its hospitality brand grounded on a knowledge data library containing 200 FAQ articles covering reservations, amenities, and cancellation policies. The project team estimates that manually authoring test cases to achieve adequate knowledge coverage would take 3 weeks. A junior administrator proposes that Testing Center can significantly accelerate this process. Which step should an Agentforce Specialist take to generate a comprehensive initial test suite without manual authoring of individual test cases?","o":{"A":"Upload test cases","B":"Generate test cases based on the knowledge available to the agent","C":"Generate test cases based on subagent (formerly known as a topic) and actions"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-21","t":"Testing & monitoring"},{"n":251,"q":"An Agentforce Specialist is working declaratively on version 4 of a prompt template which is significantly different than the previous version 3. A bug is then identified in version 3 and requires a hotfix to be deployed to production immediately by another team. The team will deploy this change as a new version. What should the specialist do to ensure that their work on the latest version is not lost and does not conflict with the new version?","o":{"A":"Create a new prompt template with the bug fix, update all references to the new version, and delete the old prompt template.","B":"Save their work in version 4, and allow the template to be deployed with a new version 5 containing the fix.","C":"Copy and paste version 4 into a backup file or version-control alternative, and allow the other team to overwrite the contents of version 4 with the bug-fixed version."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-22","t":"Deployment & security"},{"n":252,"q":"Cloud Kicks has long, complex legal agreements. An Agentforce agent must be able to retrieve specific clauses that are often nested within larger sections. The standard chunking method is failing to capture the full context of these clauses. Which chunking strategy should an administrator use to preserve the structure of the documents?","o":{"A":"Implement a smaller chunk size.","B":"Implement a larger chunk size.","C":"Implement a keyword-based chunking strategy."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-23","t":"Data, retrieval & Knowledge"},{"n":253,"q":"An Agentforce Specialist is setting up Salesforce Knowledge as the data source for a Data Library and must select \"Identifying Fields\" to help Agentforce locate the right information. The Knowledge article contents are rich, detailed, and quite long. What should the Agentforce Specialist use as Identifying Fields?","o":{"A":"The main contents of the article to ensure the most relevant article is used","B":"Any text or text area fields that provide a concise summary of the article","C":"Any standard or custom formula field that contains a suitable concatenated key"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-24","t":"Data, retrieval & Knowledge"},{"n":254,"q":"Universal Containers (UC) has built a custom retriever in AI Models (formerly Einstein Studio) to ground AI responses with technical documentation. UC now requires that a summary field from the search index be included in the output to provide a brief overview of each retrieved document. What is the recommended course of action for UC?","o":{"A":"Create a completely new custom retriever with an entirely revised configuration that incorporates the summary field, and delete the current retriever. Editing the existing retriever is not possible.","B":"Edit the existing retriever version to add the summary field to the list of fields returned by the retriever, save the changes, and activate the new version so that prompt templates use the updated configuration.","C":"Use only the default retriever, which will automatically include all available fields from the search index, including the summary field, without any need to create or manage custom retrievers."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-25","t":"Prompt Builder"},{"n":255,"q":"An Agentforce Specialist is trying to troubleshoot a reported issue from an end user and they do not see the session in the Processed Sessions tab of Agentforce Observability. What should the specialist take into consideration?","o":{"A":"The agent has not yet been registered in the Observability app so no sessions are processed.","B":"The session is queued to be processed and can be viewed on the Unprocessed Sessions tab.","C":"Sessions are batched on a 24-hour rolling process and the logs must be checked again the next day."},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-26","t":"General"},{"n":256,"q":"Universal Containers is designing an agent to assist with order management and dealer support automation. The agent must verify a dealer's credentials before granting access to order details. The team has already: - Declared a variable is_verified to track verification status - Configured an action that verifies the dealer's credentials. They plan to restrict access to the order details subagent (formerly known as a topic) using a guard condition based on is_verified. What must the team do to ensure the order details subagent becomes available only after a dealer is successfully verified?","o":{"A":"Add an available when: @variables.is_verified == true condition to the order details subagent.","B":"Declare the is_verified variable as immutable so it cannot be modified during the session.","C":"Update the is_verified variable to true after the verification action succeeds using @utils.setVariables."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-27","t":"Agent Builder & actions"},{"n":257,"q":"Universal Containers is implementing a Retrieval Augmented Generation (RAG) solution where the knowledge store contains Spanish articles, but users will query the agent in French and English. The Agentforce Specialist needs to ensure the retriever can accurately find relevant articles despite the language differences. What should the specialist do to meet this requirement?","o":{"A":"Use the multilingual-e5-large embedding model for French and Spanish language users.","B":"Use the multilingual-e5-large embedding model for French and English language users.","C":"Use the multilingual-e5-large embedding model to handle all languages."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-28","t":"Data, retrieval & Knowledge"},{"n":258,"q":"Universal Containers (UC) wants to create a prompt template that consistently extracts a customer's specific product model number and quantity from an email inquiry to draft a response back to the customer. Which best practice should UC implement to achieve this goal?","o":{"A":"Provide clear, positive instructions and use few-shot examples.","B":"Incorporate open-ended questions to encourage detailed responses.","C":"Use a high temperature setting to increase creative output."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-30","t":"Prompt Builder"},{"n":259,"q":"A customer wants to analyze complete agent interactions, from the initial user request through to the final resolution, to better understand agent behavior and response quality. Which Agentforce feature should an Agentforce Specialist recommend?","o":{"A":"Agent Inspection","B":"Agent Insights","C":"Agent Optimization"},"a":"A","orig":"A","status":"disputed","note":"No feature called Agent Inspection found; Agent Optimization (C) also argued.","src":"SET2-32","t":"Agent Builder & actions"},{"n":260,"q":"Universal Containers has been building an agent using Canvas. It has created an \"Issue Refund\" action. Business rules dictate that refunds can only be issued if the customer's Account_Tier is \"Platinum\". Currently, the agent relies on its system instructions to check the tier, but it occasionally hallucinates authorization and attempts to call the refund action for Standard customers, resulting in backend errors. How should the Agentforce Specialist use filters to deterministically ensure the agent cannot process the \"Issue Refund\" action unless the customer meets the criteria?","o":{"A":"Update the agent's system instructions with a strict rule to manually filter out any refund requests if the customer's account tier is not Platinum.","B":"Apply a text filter to the Agent Session that automatically blocks the word 'refund' from the user's prompt unless they are a Platinum customer.","C":"Configure an Action Condition filter on the \"Issue Refund\" action so that it is only available to the agent when Account Tier equals \"Platinum\"."},"a":"C","orig":"C","status":"reviewed","note":"","src":"SET2-33","t":"Agent Builder & actions"},{"n":261,"q":"When configuring a file upload based data library, what are the maximum allowed file sizes for text/HTML files and PDF files, respectively?","o":{"A":"Up to 4 MB for text/HTML files and up to 100 MB for PDF files","B":"Up to 50 MB for both text/HTML files and PDF files","C":"Up to 100 MB for text/HTML files and up to 4 MB for PDF files"},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-35","t":"Data, retrieval & Knowledge"},{"n":262,"q":"A customer is authenticated and identified as being either bronze, silver, or gold membership level. Those levels define which subagents or actions are available to the agent to perform specific tasks as per the level-based entitlements. What is the best way to ensure the agent responds appropriately?","o":{"A":"Use before_reasoning to set custom variables that will be used in filters and flow logic.","B":"Use after_reasoning to set custom variables that will be used in filters and flow logic.","C":"Use Agent Router to set custom variables that will be used in filters and flow logic."},"a":"A","orig":"A","status":"reviewed","note":"","src":"SET2-36","t":"Agent Builder & actions"},{"n":263,"q":"Which feature in the Trust Layer helps to minimize the risks of jailbreaking and prompt injection attacks?","o":{"A":"Data Masking","B":"Prompt Defense","C":"Secure Data Retrieval and Grounding"},"a":"B","orig":"B","status":"reviewed","note":"","src":"SET2-37","t":"Prompt Builder"},{"n":264,"q":"An Agentforce Specialist at Cloud Kicks wants to build a retrieval augmented generation (RAG) powered agent grounded in text-based PDF documents. The specialist wants a quickstart approach that automatically generates all underlying components, including the vector data store, search index, retriever, and standard action. Which feature should the specialist use?","o":{"A":"Ensemble Retriever","B":"Agentforce Data Library","C":"Search Index"},"a":"B","orig":"B","status":"reviewed","note"
